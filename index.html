<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJSP Escrevente Beta - Livro Completo - Desenvolvido por Bruno Badu <br>  Bora, Saygon!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:#ffffff;color:#000000;line-height:1.5}
header{background:linear-gradient(90deg,#7f1d1d,#991b1b);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px}
.book-page{line-height:1.7;font-size:15px;color:#000000}
.book-page h3{color:#7f1d1d;margin:16px 0 8px 0;font-size:18px;border-left:4px solid #dc2626;padding-left:10px}
.book-page h4{color:#000000;margin:14px 0 6px 0;font-size:15px;font-weight:700}
.book-page .box-legal{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px;margin:10px 0;color:#000}
.book-page .box-peg{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px;margin:10px 0;color:#000}
.book-page .box-macete{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;margin:10px 0;color:#000}
.book-page ul{margin:8px 0 8px 20px}
.book-page li{margin:4px 0}
.layout{display:flex;min-height:100vh}
.sidebar{width:320px;background:#f8fafc;border-right:1px solid #e2e8f0;padding:12px;overflow:auto}
.main{flex:1;padding:16px;max-width:900px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.topic{padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;display:flex;justify-content:space-between;margin-bottom:6px;color:#000}
.topic.active{background:#fef2f2;border-color:#fecaca}
.badge{background:#e2e8f0;border-radius:999px;padding:2px 8px;font-size:11px;color:#000}
.btn{border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;background:#ffffff;color:#000000;border:1px solid #000000}
.btn-primary{background:#ffffff;color:#000000;border:1.5px solid #000000}
.q{font-weight:700;font-size:16px;margin:12px 0;color:#000}
.opt{border:1.5px solid #000000;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;background:#ffffff;color:#000000}
.opt.correct{background:#f0fdf4;border-color:#16a34a}
.opt.wrong{background:#fef2f2;border-color:#dc2626}
.explain{background:#ffffff;border:1px solid #000000;border-radius:10px;padding:12px;margin-top:12px;color:#000}
.hidden{display:none}
input{color:#000}
</style>
</head>
<body>
<header><h1>⚖️ TJSP Escrevente - Beta Livro Completo</h1><small>Progresso salvo local</small></header>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
<button id="tab-estudar" class="btn btn-primary" onclick="setMode('estudar')">📖 ESTUDAR - LIVRO</button>
<button id="tab-simular" class="btn" onclick="setMode('simular')">📝 SIMULAR - 200Q</button>
<button class="btn" onclick="exportBackup()">💾 Backup</button>
<button class="btn" onclick="logout()">Sair</button>
</div>
<div id="app"></div>
</div>
</div>
<script>
const DEFAULT_PASS="SaygonEscrivao2026";const MASTER_KEY="TJSP2026RESET";
const getUsers=()=>{try{return JSON.parse(localStorage.getItem("tjsp_users")||"{}")}catch(e){return{}}};
const saveUsers=u=>localStorage.setItem("tjsp_users",JSON.stringify(u));
const getCurrent=()=>localStorage.getItem("tjsp_current");
const setCurrent=c=>localStorage.setItem("tjsp_current",c);

const BOOK = [
{id:"constitucional",name:"Direito Constitucional",icon:"⚖️",chapters:[
{title:"Cap 1 - Art 5º Caput - Os 5 Direitos",content:`<h3>LEI SECA COMPLETA</h3><div class="box-legal"><b>Art. 5º Todos são iguais perante a lei, sem distinção, garantindo-se aos brasileiros e estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade.</b></div><h3>O QUE CADA UM SIGNIFICA</h3><h4>VIDA, LIBERDADE, IGUALDADE, SEGURANÇA, PROPRIEDADE - V-L-I-S-P</h4><ul><li>Vida: vedação pena de morte salvo guerra declarada Art 84 XIX</li><li>Liberdade: 17 liberdades no Art 5º</li><li>Igualdade: formal e material - cotas constitucionais ADC 41 STF</li><li>Segurança: jurídica e física</li><li>Propriedade: com função social XXII e XXIII</li></ul><div class="box-macete"><b>MACETE VUNESP:</b> Troca por saúde, moradia, educação que são Art 6º sociais, não do caput! Pegadinha: vida, liberdade, igualdade, segurança e moradia está ERRADA.</div>`},
{title:"Cap 2 - Art 5º I e II - Igualdade e Legalidade",content:`<h3>LEI SECA</h3><div class="box-legal">I - homens e mulheres iguais em direitos e obrigações;<br>II - ninguém obrigado a fazer ou deixar de fazer senão em virtude de lei;</div><h3>COMENTÁRIO</h3><ul><li>Igualdade não impede licença maternidade 120 dias x paternidade 5 dias</li><li>Legalidade: para particular tudo que não é proibido é permitido, para administração só pode fazer o que lei autoriza</li></ul>`},
{title:"Cap 3 - Art 5º X a XII - Intimidade, Casa, Sigilo",content:`<h3>LEI SECA</h3><div class="box-legal">X - invioláveis intimidade, vida privada, honra e imagem;<br>XI - casa asilo inviolável - de dia com mandado, de noite só flagrante, desastre, socorro;<br>XII - sigilo correspondência e comunicações.</div><div class="box-macete">CASA: inclui escritório fechado, quarto hotel. Não inclui escritório aberto, bar, cela.<br>SIGILO: Correspondência só juiz, Telefone só juiz Lei 9.296, Dados juiz e CPI, Delegado NUNCA quebra sozinho.</div>`},
{title:"Cap 4 - Art 5º XXXV a LV - Processo, Contraditório, Provas",content:`<h3>LEI SECA</h3><div class="box-legal">XXXV - lei não excluirá da apreciação do Judiciário lesão ou ameaça;<br>LIV - ninguém privado da liberdade ou bens sem devido processo;<br>LV - contraditório e ampla defesa;<br>LVI - inadmissíveis provas ilícitas.</div><ul><li>Devido processo formal e material</li><li>Contraditório vale até no PAD - Súmula Vinculante 5</li><li>Prova ilícita fruto da árvore envenenada</li></ul>`},
{title:"Cap 5 - Art 6º a 11º - Direitos Sociais",content:`<h3>LEI SECA</h3><div class="box-legal">Art 6º São direitos sociais a educação, a saúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância, a assistência aos desamparados.</div><p>Art 5º defesa contra Estado, Art 6º Estado tem que FAZER.</p>`}
]},
{id:"portugues",name:"Língua Portuguesa",icon:"📚",chapters:[
{title:"Cap 1 - Concordância Verbal",content:`<h3>REGRA OURO</h3><div class="box-legal">Verbo concorda com sujeito.</div><h4>HAVER = EXISTIR - impessoal</h4><ul><li>Correto: Havia muitos processos / Houve muitos processos</li><li>Errado: Haviam muitos processos - VUNESP pega 80% aqui</li></ul><h4>FAZER tempo - impessoal</h4><ul><li>Faz dois anos que estudo - sempre singular</li></ul>`},
{title:"Cap 2 - Crase - A+A=À",content:`<h3>MACETE INFALÍVEL</h3><div class="box-macete">Troca por AO masculino. Se der AO, tem crase no feminino.<br>Fui à praia -> Fui AO shopping (tem crase) ✅</div><ul><li>Às vezes tem crase, às 10 horas tem, à medida que tem, a partir NUNCA tem</li><li>Antes de verbo nunca: Começou a chover</li></ul>`},
{title:"Cap 3 - Pontuação",content:`<h3>VÍRGULA</h3><ul><li>Nunca separa sujeito do verbo: Os servidores, trabalham ERRADO</li><li>Obrigatória: aposto, vocativo, adjunto deslocado, oração intercalada</li></ul>`}
]},
{id:"processual_civil",name:"Processo Civil",icon:"📝",chapters:[
{title:"Cap 1 - Petição Inicial Art 319",content:`<div class="box-legal">Art 319: I - juízo, II - partes, III - causa de pedir, IV - pedido, V - valor da causa, VI - provas, VII - opção audiência conciliação</div><p>Juízo, partes com qualificação completa CPF, causa de pedir fatos+fundamentos, pedido certo e determinado Art 322, valor causa, provas, opção conciliação Art 334</p>`}
]}
];

const DB_PART1 = [
{id:"portugues_q",name:"Português - 20Q",icon:"📚",questions:[
{q:"Assinale correta quanto à concordância:",o:["Haviam muitos processos","Havia muitos processos","Houveram provas","Fazem dois anos"],a:1,e:"Haver impessoal fica singular.",ec:"Havia = existiam, impessoal não vai pro plural.",ei:"A e C usam haver no plural - erro. D Faz tempo impessoal."},
{q:"Crase correta:",o:["Fui a praia","Fui à praia","Começou à chover","Fui a pé à cavalo"],a:1,e:"Fui A + A praia = à. Verbo nunca tem crase.",ec:"Fui AO shopping -> Fui À praia",ei:"A sem crase, C verbo, D pé masculino sem crase"}
]},
{id:"constitucional_q",name:"Constitucional - 20Q",icon:"⚖️",questions:[
{q:"Art 5º caput garante:",o:["vida, liberdade, igualdade, segurança e moradia","vida, liberdade, igualdade, segurança e propriedade","saúde, educação, moradia","vida, liberdade, igualdade, segurança e lazer"],a:1,e:"V-L-I-S-P - Vida Liberdade Igualdade Segurança Propriedade. Moradia é Art 6º.",ec:"Caput lista V-L-I-S-P",ei:"Moradia, saúde, lazer são Art 6º direitos sociais."}
]}
];

const DB_PART2 = [
{id:"penal",name:"Direito Penal - 20Q",icon:"🔒",questions:[
{q:"Princípio da legalidade:",o:["Não há crime sem lei anterior","Juiz pode criar crime","Analogia para prejudicar","Costume cria crime"],a:0,e:"Art 5º XXXIX e Art 1º CP",ec:"Legalidade exige lei anterior",ei:"Juiz não cria crime, analogia in malam partem vedada"}
]}
];

const DB = [...DB_PART1, ...DB_PART2];
let mode='estudar';let activeTopic=BOOK[0].id;let chapterIndex=0;let qIndex=0;let chosen=null;

function setMode(m){
  mode=m;
  const b1=document.getElementById('tab-estudar'); const b2=document.getElementById('tab-simular');
  if(b1) {b1.style.background = m==='estudar' ? '#7f1d1d' : '#ffffff'; b1.style.color = m==='estudar' ? '#ffffff' : '#000000';}
  if(b2) {b2.style.background = m==='simular' ? '#7f1d1d' : '#ffffff'; b2.style.color = m==='simular' ? '#ffffff' : '#000000';}
  if(m==='estudar'){activeTopic=BOOK[0].id;chapterIndex=0;} else{activeTopic=DB[0].id;qIndex=0;}
  render();
}
function renderSidebar(){
  let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};
  let html='';
  if(mode==='estudar'){
    html+=`<div class="card"><b>📖 Livro Completo</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:0%"></div></div><small id="ptext" style="color:#000"></small></div>`;
    BOOK.forEach(t=>{
      let done=(hist['book_'+t.id]?.done||0);
      let pct=t.chapters.length?Math.round(done/t.chapters.length*100):0;
      html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${done}/${t.chapters.length} caps • ${pct}%</small></div><span class="badge">${pct}%</span></div>`;
    });
  }else{
    html+=`<div class="card"><b>Progresso Simulado</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:0%"></div></div><small id="ptext" style="color:#000"></small></div>`;
    DB.forEach(t=>{
      let done=(hist[t.id]?.done||0);
      let pct=Math.round(done/20*100);
      html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${done}/20 • ${pct}%</small></div><span class="badge">${pct}%</span></div>`;
    });
  }
  document.getElementById("sidebar").innerHTML=html;
  updateProgress();
}
function updateProgress(){
  let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};
  let pct=0,txt="";
  if(mode==='estudar'){
    let tot=BOOK.reduce((s,t)=>s+t.chapters.length,0);
    let done=BOOK.reduce((s,t)=>s+(hist['book_'+t.id]?.done||0),0);
    pct=tot?Math.round(done/tot*100):0; txt=done+"/"+tot+" págs • "+pct+"%";
  }else{
    let tot=DB.length*20;
    let done=DB.reduce((s,t)=>s+(hist[t.id]?.done||0),0);
    pct=tot?Math.round(done/tot*100):0; txt=done+"/"+tot+" • "+pct+"%";
  }
  let b=document.getElementById("pbar");if(b)b.style.width=pct+"%";
  let pt=document.getElementById("ptext");if(pt)pt.innerText=txt;
}
function selectTopic(id){activeTopic=id;chapterIndex=0;qIndex=0;chosen=null;render();}
function render(){
  renderSidebar();
  if(mode==='estudar'){
    let t=BOOK.find(x=>x.id===activeTopic);
    let chap=t.chapters[chapterIndex];
    if(!chap){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="chapterIndex=0;render()">Recomeçar</button> <button class="btn" onclick="setMode('simular')">Ir pro Simulado →</button></div></div>`;return;}
    let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${t.icon} ${t.name} - ${chap.title}</b><span class="badge">${chapterIndex+1}/${t.chapters.length}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((chapterIndex/t.chapters.length)*100)}%"></div></div><div class="book-page">${chap.content}</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="markRead()">✅ Lido + Próxima → (Enter)</button><button class="btn" onclick="nextChapter()">Pular →</button></div></div>`;
    document.getElementById("app").innerHTML=html;
  }else{
    let t=DB.find(x=>x.id===activeTopic);
    let qq=t.questions[qIndex];
    if(!qq){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="qIndex=0;render()">Refazer</button> <button class="btn" onclick="setMode('estudar')">Ver Livro →</button></div></div>`;return;}
    let html=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${t.icon} ${t.name}</b><span class="badge">${qIndex+1}/20</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((qIndex/20)*100)}%"></div></div><p class="q">${qIndex+1}. ${qq.q}</p><div id="opts">${qq.o.map((op,i)=>`<div class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${op}</div>`).join("")}</div><div id="feedback" class="hidden"></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="confirmQ()">Corrigir (Enter)</button><button class="btn" onclick="nextQ()">Pular</button></div></div>`;
    document.getElementById("app").innerHTML=html;
  }
}
function markRead(){let users=getUsers();let cur=getCurrent();if(!users[cur]) return;let key='book_'+activeTopic;if(!users[cur].history[key])users[cur].history[key]={done:0};let h=users[cur].history[key];if(chapterIndex>= (h.done||0))h.done=Math.max(h.done||0,chapterIndex+1);saveUsers(users);nextChapter();}
function nextChapter(){let t=BOOK.find(x=>x.id===activeTopic);if(!t) return;chapterIndex++;if(chapterIndex>=t.chapters.length)chapterIndex=t.chapters.length;render();}
function choose(i){chosen=i;document.querySelectorAll(".opt").forEach((el,idx)=>{el.style.borderWidth=idx===i?"3px":"1.5px";el.style.fontWeight=idx===i?"700":"400";});}
function confirmQ(){if(chosen===null)return alert("Escolha 1-4");let t=DB.find(x=>x.id===activeTopic);let qq=t.questions[qIndex];document.querySelectorAll(".opt").forEach((el,idx)=>{if(idx===qq.a)el.classList.add("correct");else if(idx===chosen&&chosen!==qq.a)el.classList.add("wrong");});let acerto=chosen===qq.a;let fb=document.getElementById("feedback");fb.classList.remove("hidden");fb.innerHTML=`<div class="explain"><div style="font-weight:800;color:${acerto?'#16a34a':'#dc2626'}">${acerto?'✅ ACERTOU!':'❌ ERROU'}</div><div style="margin-top:8px"><b>Correta: ${String.fromCharCode(65+qq.a)}. ${qq.o[qq.a]}</b></div><div style="margin-top:8px"><b>Por que CERTA está certa:</b><br><small>${qq.ec}</small></div><div style="margin-top:8px"><b>Por que ERRADAS estão erradas:</b><br><small>${qq.ei}</small></div><div style="margin-top:8px;background:#fff;border:1px dashed #000;border-radius:8px;padding:8px"><b>📚 Explicação Completa:</b><br><small>${qq.e}</small></div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary" onclick="nextQ()">Próxima →</button> <button class="btn" onclick="setMode('estudar')">Ver livro 📖</button></div></div>`;let users=getUsers();let cur=getCurrent();if(!users[cur].history[activeTopic])users[cur].history[activeTopic]={done:0,hits:0};let h=users[cur].history[activeTopic];if(qIndex>= (h.done||0))h.done=Math.max(h.done||0,qIndex+1);if(acerto)h.hits=(h.hits||0)+1;saveUsers(users);updateProgress();}
function nextQ(){qIndex++;chosen=null;if(qIndex>=20)qIndex=20;render();}
function checkAuth(){let cur=getCurrent();let loginDiv=document.getElementById("login-overlay");if(!cur){if(!loginDiv){let div=document.createElement("div");div.id="login-overlay";div.innerHTML=`<div style="position:fixed;inset:0;background:linear-gradient(135deg,#7f1d1d,#991b1b);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px"><div class="card" style="width:100%;max-width:420px;background:#ffffff"><h2 style="margin-top:0;color:#000">Login TJSP Beta</h2><input id="name" placeholder="Seu nome" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><input id="pass" type="password" placeholder="Senha: SaygonEscrivao2026" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><button class="btn btn-primary" style="width:100%;padding:12px;margin-top:8px" onclick="doLogin()">Entrar</button><p style="margin-top:12px"><a href="#" onclick="openReset();return false" style="color:#000">Esqueci senha / Reset com chave</a></p><small style="color:#000">Senha padrão: SaygonEscrivao2026<br>Chave: TJSP2026RESET</small></div></div>`;document.body.appendChild(div);setTimeout(()=>{document.getElementById("name")?.focus();},100);}return false;}else{if(loginDiv)loginDiv.remove();return true;}}
function doLogin(){let n=document.getElementById("name")?.value.trim();let p=document.getElementById("pass")?.value;if(!n){alert("Digite seu nome");return;}let u=getUsers();if(!u[n]){u[n]={pass:p||DEFAULT_PASS,history:{}};saveUsers(u);setCurrent(n);location.reload();return;}if(u[n].pass===p){setCurrent(n);location.reload();}else{alert("Senha incorreta.");}}
function logout(){localStorage.removeItem("tjsp_current");location.reload();}
function openReset(){let cur=getCurrent();let nome=cur||prompt("Nome do usuário:");if(!nome)return;let chave=prompt("Chave mestra:");if(chave!==MASTER_KEY)return alert("Chave incorreta");let nova=prompt("Nova senha:");if(!nova)return;let u=getUsers();if(!u[nome])u[nome]={pass:nova,history:{}};else u[nome].pass=nova;saveUsers(u);setCurrent(nome);alert("Senha trocada! ✅");location.reload();}
function exportBackup(){let u=getUsers();let cur=getCurrent();if(!cur) return alert("Faça login");let data=JSON.stringify(u[cur]||{},null,2);let blob=new Blob([data],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download=`backup-${cur}-tjsp.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener("keydown",e=>{if(!checkAuth())return;if(e.key>="1"&&e.key<="4"&&mode==='simular'){let fb=document.getElementById("feedback");if(!fb||fb.classList.contains("hidden"))choose(parseInt(e.key)-1);}if(e.key==="Enter"){if(mode==='estudar'){markRead();}else{let fb=document.getElementById("feedback");if(fb&&!fb.classList.contains("hidden"))nextQ();else confirmQ();}}});
if(checkAuth()){render();}
</script>
</body>
</html>

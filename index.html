:root{--blue:#1e3a8a;--blue2:#3b82f6;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--ok:#16a34a;--err:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-weight:700;cursor:pointer}
.tab.active{background:#fff;color:var(--blue)}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff}
.btn-primary{background:#fff;color:var(--blue)}
.layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 90px)}
aside{background:#fff;border-right:1px solid #e2e8f0;padding:14px;position:sticky;top:90px;height:calc(100vh - 90px);overflow:auto}
main{padding:18px;max-width:900px}
.card{background:var(--card);border:1px solid #e2e8f0;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.04);margin-bottom:14px}
.topic{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.topic.active{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#eff6ff;color:var(--blue);font-weight:700}
.q{font-size:17px;font-weight:700;margin:0 0 12px;line-height:1.4}
.opt{border:1.5px solid #e2e8f0;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.opt.correct{border-color:var(--ok);background:#f0fdf4}
.opt.wrong{border-color:var(--err);background:#fef2f2}
.explain{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:12px}
.book-page{line-height:1.7;font-size:15px}
.book-page b{color:var(--blue)}
.kbd{font-size:11px;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:6px;padding:2px 6px;background:#fff}
.hidden{display:none}

const BOOK=[{"id": "constitucional", "name": "Direito Constitucional", "icon": "⚖️", "chapters": [{"title": "Cap 1 - Art 5º Caput - Os 5 Direitos", "content": "<b>LEI SECA:</b> Art. 5º Todos são iguais perante a lei, garantindo-se vida, liberdade, igualdade, segurança e propriedade.<br><br><b>COMENTÁRIO:</b> Decore V-L-I-S-P. VUNESP troca por saúde, educação, moradia que são Art 6º sociais, não do caput.<br><br><b>PEGADINHA:</b> 'vida, liberdade, igualdade, segurança e moradia' - ERRADA. Moradia Art 6º."}, {"title": "Cap 2 - Incisos I a V - Igualdade e Legalidade", "content": "<b>LEI SECA:</b> I- homens e mulheres iguais. II- ninguém obrigado senão em virtude de lei. IV- livre manifestação, vedado anonimato. V- direito resposta + indenização.<br><br><b>COMENTÁRIO:</b> II Legalidade: só LEI obriga. IV Vedado anonimato para responsabilizar. VUNESP: 'com anonimato' ERRADO."}, {"title": "Cap 3 - Intimidade, Casa, Sigilo", "content": "<b>LEI SECA:</b> X- intimidade, vida privada, honra, imagem, indenização material e moral. XI- casa asilo inviolável, salvo flagrante, desastre, socorro, ou de dia por ordem judicial. XII- sigilo correspondência, salvo telefônico por ordem judicial para investigação criminal.<br><br><b>COMENTÁRIO:</b> Casa: Dia= ordem + flagrante etc. Noite= só flagrante, desastre, socorro sem ordem."}, {"title": "Cap 4 - Remédios Constitucionais", "content": "<b>LEI SECA:</b> LXVIII HC locomoção. LXXII HD dados pessoais. LXIX MS direito líquido e certo. LXX MS coletivo partido, sindicato, associação 1 ano. LXXI MI falta norma regulamentadora. LXXIII Popular qualquer cidadão anula ato lesivo.<br><br><b>COMENTÁRIO:</b> HC=Corpo locomoção. HD=Data dados. VUNESP troca sempre."}, {"title": "Cap 5 - Prisão e Pena", "content": "<b>LEI SECA:</b> LXI prisão só flagrante ou ordem escrita e fundamentada de autoridade judiciária. LXVII prisão civil por dívida só alimentos (depositário infiel não mais - STF).<br><br><b>COMENTÁRIO:</b> Quem decreta? Só JUIZ. Delegado preside flagrante."}]}, {"id": "portugues", "name": "Língua Portuguesa", "icon": "📚", "chapters": [{"title": "Cap 1 - Fazer, Haver, Existir", "content": "<b>REGRA OURO:</b> Fazer tempo = singular: Faz dois anos. Haver existir = singular: Há vagas. Existir concorda: Existem vagas.<br><br><b>VUNESP:</b> Haverá vagas (singular correto), Haverão vagas ERRADO."}, {"title": "Cap 2 - Crase", "content": "<b>TESTE AO:</b> Troque por masculino. Se der AO, tem crase. Entreguei à escrivã -> ao escrivão TEM crase. Vou à pé -> ao pé NÃO faz sentido sem crase.<br><br><b>TEM:</b> cargo feminino à juíza. <b>NÃO TEM:</b> a pé, a Vossa Excelência, a São Paulo."}, {"title": "Cap 3 - Regência Aspirar Assistir Visar", "content": "<b>ASPIRAR:</b> desejar com a: Aspiro ao cargo. Respirar sem: Aspiro o ar. <b>ASSISTIR:</b> ver com a: Assisti ao filme. Ajudar sem: Assistiu o paciente. <b>VISAR:</b> almejar com a: Viso ao cargo. Mirar sem: Visei documento."}, {"title": "Cap 4 - Deferir Diferir Mau Mal Há A", "content": "<b>DEFERIR=conceder, DIFERIR=adiar. MAU adjetivo bom, MAL advérbio bem. HÁ passado faz, A futuro daqui a.</b><br><br>Ele é mau servidor, trabalha mal - CORRETA."}, {"title": "Cap 5 - Por que Por quê Porque Porquê", "content": "<b>PERGUNTA=por que, FIM=por quê, RESPOSTA=porque, SUBSTANTIVO com o=porquê.</b><br><br>Não sei por que faltou - por que separado pergunta indireta."}]}];

<!-- Parte 5 - Junção e Lógica Final - Fecha o site -->
<script>
// Junta tudo: Português+Constitucional da Parte 3 + outras 8 matérias da Parte 4
const DB = [...(typeof DB_PART1 !== 'undefined' ? DB_PART1 : []), ...(typeof DB_PART2 !== 'undefined' ? DB_PART2 : [])];

let mode='estudar';let activeTopic=BOOK[0].id;let chapterIndex=0;let qIndex=0;let chosen=null;

function setMode(m){
  mode=m;
  document.getElementById('tab-estudar')?.classList.toggle('active',m==='estudar');
  document.getElementById('tab-simular')?.classList.toggle('active',m==='simular');
  if(m==='estudar'){activeTopic=BOOK[0].id;chapterIndex=0;}
  else{activeTopic=DB[0].id;qIndex=0;}
  render();
}

function renderSidebar(){
  let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};
  let html='';
  if(mode==='estudar'){
    html+=`<div class="card"><b>📖 Livro Completo</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#1e3a8a,#3b82f6);width:0%"></div></div><small id="ptext" style="color:#64748b"></small></div>`;
    BOOK.forEach(t=>{
      let done=(hist['book_'+t.id]?.done||0);
      let pct=t.chapters.length?Math.round(done/t.chapters.length*100):0;
      html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${done}/${t.chapters.length} caps • ${pct}%</small></div><span class="badge">${pct}%</span></div>`;
    });
  }else{
    html+=`<div class="card"><b>Progresso Simulado</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#1e3a8a,#3b82f6);width:0%"></div></div><small id="ptext"></small></div>`;
    DB.forEach(t=>{
      let done=(hist[t.id]?.done||0);
      let pct=Math.round(done/20*100);
      html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${done}/20 • ${pct}%</small></div><span class="badge">${pct}%</span></div>`;
    });
  }
  document.getElementById("sidebar").innerHTML=html;
  updateProgress();
}

function updateProgress(){
  let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};
  let pct=0,txt="";
  if(mode==='estudar'){
    let tot=BOOK.reduce((s,t)=>s+t.chapters.length,0);
    let done=BOOK.reduce((s,t)=>s+(hist['book_'+t.id]?.done||0),0);
    pct=tot?Math.round(done/tot*100):0;
    txt=done+"/"+tot+" págs • "+pct+"%";
  }else{
    let tot=DB.length*20;
    let done=DB.reduce((s,t)=>s+(hist[t.id]?.done||0),0);
    pct=tot?Math.round(done/tot*100):0;
    txt=done+"/"+tot+" • "+pct+"%";
  }
  let b=document.getElementById("pbar");if(b)b.style.width=pct+"%";
  let pt=document.getElementById("ptext");if(pt)pt.innerText=txt;
}

function selectTopic(id){activeTopic=id;chapterIndex=0;qIndex=0;chosen=null;render();}

function render(){
  renderSidebar();
  if(mode==='estudar'){
    let t=BOOK.find(x=>x.id===activeTopic);
    if(!t){document.getElementById("app").innerHTML=`<div class="card"><h2>Matéria não encontrada</h2></div>`;return;}
    let chap=t.chapters[chapterIndex];
    if(!chap){
      document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><p>Você leu tudo!</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="background:#1e3a8a;color:#fff" onclick="chapterIndex=0;render()">Recomeçar</button> <button class="btn" style="border:1px solid #e2e8f0" onclick="setMode('simular')">Ir pro Simulado →</button></div></div>`;
      return;
    }
    let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${t.icon} ${t.name} - ${chap.title}</b><span class="badge">${chapterIndex+1}/${t.chapters.length}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#1e3a8a,#3b82f6);width:${Math.round((chapterIndex/t.chapters.length)*100)}%"></div></div><div class="book-page">${chap.content}</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="background:#1e3a8a;color:#fff" onclick="markRead()">✅ Lido + Próxima → (Enter)</button><button class="btn" style="border:1px solid #e2e8f0" onclick="nextChapter()">Pular →</button></div><small style="color:#64748b;margin-top:8px;display:block">Dica notebook: Enter = Lido, 1-4 = escolhe alternativa no simulado</small></div>`;
    document.getElementById("app").innerHTML=html;
  }else{
    let t=DB.find(x=>x.id===activeTopic);
    if(!t){document.getElementById("app").innerHTML=`<div class="card"><h2>Matéria não encontrada</h2></div>`;return;}
    let qq=t.questions[qIndex];
    if(!qq){
      document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><p>Você fez as 20Q!</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="background:#1e3a8a;color:#fff" onclick="qIndex=0;render()">Refazer</button> <button class="btn" style="border:1px solid #e2e8f0" onclick="setMode('estudar')">Ver Livro →</button></div></div>`;
      return;
    }
    let html=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${t.icon} ${t.name}</b><span class="badge">${qIndex+1}/20</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#1e3a8a,#3b82f6);width:${Math.round((qIndex/20)*100)}%"></div></div><p class="q">${qIndex+1}. ${qq.q}</p><div id="opts">${qq.o.map((op,i)=>`<div class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${op}</div>`).join("")}</div><div id="feedback" class="hidden"></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="background:#1e3a8a;color:#fff" onclick="confirmQ()">Corrigir (Enter)</button><button class="btn" style="border:1px solid #e2e8f0" onclick="nextQ()">Pular</button></div></div>`;
    document.getElementById("app").innerHTML=html;
  }
}

function markRead(){
  let users=getUsers();let cur=getCurrent();
  if(!users[cur]) return;
  let key='book_'+activeTopic;
  if(!users[cur].history[key])users[cur].history[key]={done:0};
  let h=users[cur].history[key];
  if(chapterIndex>= (h.done||0))h.done=Math.max(h.done||0,chapterIndex+1);
  saveUsers(users);
  nextChapter();
}

function nextChapter(){
  let t=BOOK.find(x=>x.id===activeTopic);
  if(!t) return;
  chapterIndex++;
  if(chapterIndex>=t.chapters.length)chapterIndex=t.chapters.length;
  render();
}

function choose(i){
  chosen=i;
  document.querySelectorAll(".opt").forEach((el,idx)=>{
    el.style.borderWidth=idx===i?"2px":"1.5px";
    el.style.fontWeight=idx===i?"700":"400";
  });
}

function confirmQ(){
  if(chosen===null)return alert("Escolha 1-4 (teclas 1 a 4 também funcionam)");
  let t=DB.find(x=>x.id===activeTopic);
  let qq=t.questions[qIndex];
  document.querySelectorAll(".opt").forEach((el,idx)=>{
    if(idx===qq.a)el.classList.add("correct");
    else if(idx===chosen&&chosen!==qq.a)el.classList.add("wrong");
  });
  let acerto=chosen===qq.a;
  let fb=document.getElementById("feedback");
  fb.classList.remove("hidden");
  fb.innerHTML=`<div class="explain"><div style="font-weight:800;color:${acerto?'#16a34a':'#dc2626'}">${acerto?'✅ ACERTOU!':'❌ ERROU'}</div><div style="margin-top:8px"><b>Correta: ${String.fromCharCode(65+qq.a)}. ${qq.o[qq.a]}</b></div><div style="margin-top:8px">✅ <b>Por que CERTA está certa:</b><br><small>${qq.ec}</small></div><div style="margin-top:8px">❌ <b>Por que ERRADAS estão erradas:</b><br><small>${qq.ei}</small></div><div style="margin-top:8px;background:#fff;border:1px dashed #e2e8f0;border-radius:8px;padding:8px"><b>📚 Explicação Completa:</b><br><small>${qq.e}</small></div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn" style="background:#1e3a8a;color:#fff" onclick="nextQ()">Próxima → (Enter)</button> <button class="btn" style="border:1px solid #e2e8f0" onclick="setMode('estudar')">Ver livro 📖</button></div></div>`;
  let users=getUsers();let cur=getCurrent();
  if(!users[cur].history[activeTopic])users[cur].history[activeTopic]={done:0,hits:0};
  let h=users[cur].history[activeTopic];
  if(qIndex>= (h.done||0))h.done=Math.max(h.done||0,qIndex+1);
  if(acerto)h.hits=(h.hits||0)+1;
  saveUsers(users);
  updateProgress();
}

function nextQ(){qIndex++;chosen=null;if(qIndex>=20)qIndex=20;render();}

function checkAuth(){
  let cur=getCurrent();
  if(!cur){
    document.body.innerHTML=`<div style="max-width:420px;margin:60px auto" class="card"><h2>Login TJSP Beta</h2><input id="name" placeholder="Seu nome" style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;margin:8px 0"><input id="pass" type="password" placeholder="Senha padrão: SaygonEscrivao2026" style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;margin:8px 0"><button class="btn" style="background:#1e3a8a;color:#fff;width:100%" onclick="doLogin()">Entrar</button><p style="margin-top:12px"><a href="#" onclick="openReset();return false">Esqueci senha / Reset com chave mestra</a></p><small style="color:#64748b">Senha padrão: SaygonEscrivao2026<br>Chave mestra: TJSP2026RESET</small></div>`;
    return false;
  }
  return true;
}

function doLogin(){
  let n=document.getElementById("name")?.value.trim();
  let p=document.getElementById("pass")?.value;
  let u=getUsers();
  if(!n)return alert("Digite seu nome");
  if(!u[n]){u[n]={pass:p||DEFAULT_PASS,history:{}};saveUsers(u);setCurrent(n);location.reload();return;}
  if(u[n].pass===p){setCurrent(n);location.reload();}else alert("Senha incorreta. Use a chave mestra para resetar.");
}

function logout(){localStorage.removeItem("tjsp_current");location.reload();}

function openReset(){
  let cur=getCurrent();
  let nome=cur||prompt("Nome do usuário:");
  if(!nome)return;
  let chave=prompt("Chave mestra:");
  if(chave!==MASTER_KEY)return alert("Chave incorreta");
  let nova=prompt("Nova senha:");
  if(!nova)return;
  let u=getUsers();
  if(!u[nome])u[nome]={pass:nova,history:{}};
  else u[nome].pass=nova;
  saveUsers(u);
  setCurrent(nome);
  alert("Senha trocada mantendo todo histórico de progresso! ✅");
  location.reload();
}

function exportBackup(){
  let u=getUsers();let cur=getCurrent();
  if(!cur) return alert("Faça login");
  let data=JSON.stringify(u[cur]||{},null,2);
  let blob=new Blob([data],{type:"application/json"});
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;a.download=`backup-${cur}-tjsp.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// Atalhos de teclado notebook
document.addEventListener("keydown",e=>{
  if(!checkAuth())return;
  if(e.key>="1"&&e.key<="4"&&mode==='simular'){
    let fb=document.getElementById("feedback");
    if(!fb||fb.classList.contains("hidden"))choose(parseInt(e.key)-1);
  }
  if(e.key==="Enter"){
    if(mode==='estudar'){markRead();}
    else{
      let fb=document.getElementById("feedback");
      if(fb&&!fb.classList.contains("hidden"))nextQ();
      else confirmQ();
    }
  }
});

if(checkAuth()){render();}
</script>
</body>
</html>

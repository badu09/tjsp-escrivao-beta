{id:"portugues",name:"BLOCO I - Língua Portuguesa",icon:"📚",chapters:[
{title:"1 - Análise, compreensão e interpretação de textos",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 1: Análise, compreensão e interpretação de diversos tipos de textos verbais, não verbais, literários e não literários.</div>
<h3>2. EXPLICAÇÃO SIMPLES</h3><p><b>Texto verbal:</b> usa palavras. Ex: notícia, e-mail, lei.<br><b>Texto não verbal:</b> usa imagem, sem palavras. Ex: placa de trânsito, gráfico, charge só com desenho.<br><b>Texto literário:</b> tem preocupação com a beleza, sentido figurado, emoção. Ex: poema, romance, crônica.<br><b>Texto não literário:</b> quer informar direto. Ex: manual, bula, edital, notícia.</p>
<h3>3. COMO A VUNESP COBRA</h3><p>A VUNESP não quer que você decore definição. Ela te dá um texto e pergunta: "Qual é a ideia principal?" "O texto é literário ou não?" "O que o autor quis dizer com essa imagem?"</p><p><b>Passo a passo para acertar:</b><br>1) Leia o enunciado ANTES do texto. Assim você já sabe o que procurar.<br>2) Leia o texto 2 vezes. Na 1ª, entenda o geral. Na 2ª, sublinhe palavras-chave.<br>3) Volte para as alternativas e elimine as absurdas.</p>
<h3>4. EXEMPLO DE VERDADE</h3><p>Texto: "O fórum estava lotado. Servidores corriam com processos nas mãos. O juiz, cansado, suspirou: - Mais um dia."<br>Pergunta: O texto é literário ou não literário? <b>É literário? Não.</b> É uma narração, mas com objetivo de descrever uma cena, sem metáfora forte. Se fosse: "O fórum era um formigueiro, onde cada processo era uma folha carregada com suor" - aí sim seria literário, porque usa metáfora (formigueiro, folha).</p>
<h3>5. PEGADINHA VUNESP</h3><div class="box-peg">"Todo texto com imagem é não verbal." <b>ERRADO.</b> Se tem imagem + palavra (charge com balão, tirinha, infográfico), é <b>misto / multimodal</b>.<br>"Texto literário só existe em poema." <b>ERRADO.</b> Crônica, conto, romance também são literários.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Verbal = palavra. Não verbal = imagem. Misto = os dois.<br>Literário = beleza, figurado. Não literário = informar direto.<br>Leia o enunciado antes do texto.</div>
<h3>6. QUESTÃO COMENTADA</h3><p><i>VUNESP - Um texto que usa apenas uma placa de "Proibido estacionar" com desenho de carro é:</i><br>a) Verbal b) Não verbal c) Literário d) Narrativo<br><b>Correta: B.</b> Só imagem, sem palavra, é não verbal.</p>
`},
{title:"2 - Informações literais e inferências possíveis",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 2: Informações literais e inferências possíveis.</div>
<h3>2. DIFERENÇA QUE CAI EM TODA PROVA</h3><table><tr><th>Literal</th><th>Inferência</th></tr><tr><td>Está ESCRITO no texto, com todas as letras.</td><td>NÃO está escrito, mas você pode CONCLUIR com lógica, sem inventar.</td></tr><tr><td>Ex: "João chegou às 8h." Literal: João chegou às 8h.</td><td>Ex: "João chegou às 8h, ofegante, com a camisa suada." Inferência: João veio correndo / estava atrasado.</td></tr></table>
<h3>3. COMO A VUNESP PERGUNTA</h3><ul><li><b>"Segundo o texto..." / "De acordo com o texto..."</b> = Resposta LITERAL. Tem que estar escrito. Não invente.</li><li><b>"Infere-se..." / "Depreende-se..." / "Pode-se concluir..."</b> = Resposta por INFERÊNCIA. Você pode concluir, mas sem fugir do texto.</li><li><b>"O autor sugere..."</b> = Inferência.</li></ul>
<h3>4. EXEMPLO</h3><p>Texto: "Maria olhou para o relógio pela terceira vez, suspirou e começou a guardar os livros."</p><p>Literal: Maria olhou para o relógio 3 vezes.<br>Inferência correta: Maria estava impaciente / com pressa / esperando algo.<br>Inferência ERRADA: Maria ia para uma festa. (O texto não fala de festa, você inventou).</p>
<h3>5. PEGADINHA</h3><div class="box-peg">A VUNESP coloca uma alternativa que parece lógica, mas não tem base no texto. Se você não consegue apontar onde no texto está a prova, é alternativa errada.<br>Regra de ouro: <b>Se não está no texto e nem dá para concluir dele, está errado.</b></div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Segundo o texto = literal, está escrito.<br>Infere-se = conclusão lógica, sem inventar.<br>Se você inventou, está errado.</div>
`},
{title:"3 - Ponto de vista do autor",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 3: Ponto de vista do autor.</div>
<h3>2. EXPLICAÇÃO</h3><p>Ponto de vista = a opinião do autor, a posição dele. Ele é a favor ou contra? Ele está criticando ou elogiando? Ele está sendo irônico ou sério?</p><p>O autor nem sempre fala "eu acho". Muitas vezes ele mostra o ponto de vista com adjetivos e escolha de palavras.</p>
<h3>3. COMO IDENTIFICAR</h3><ul><li><b>Adjetivos entregam:</b> "O <b>absurdo</b> aumento de impostos" = autor é contra. "A <b>brilhante</b> decisão" = autor é a favor.</li><li><b>Verbos entregam:</b> "O governo <b>insiste</b> em errar" = crítica. "O governo <b>conseguiu</b> melhorar" = elogio.</li><li><b>Ironia:</b> "Que <b>maravilha</b>, mais um aumento!" - Ele não acha maravilha, ele está sendo irônico. É crítica.</li></ul>
<h3>4. EXEMPLO</h3><p>Texto: "Finalmente, depois de anos de espera, o tribunal inaugurou a nova sala de atendimento, que promete agilizar a vida do cidadão."</p><p>Ponto de vista: <b>Positivo, otimista.</b> Palavras: "finalmente" (alívio), "promete agilizar" (esperança).</p>
<h3>5. PEGADINHA</h3><div class="box-peg">"O autor é neutro porque é uma notícia." <b>ERRADO.</b> Até notícia tem ponto de vista na escolha do que mostrar, do título, das palavras.<br>"Ironia é elogio." <b>ERRADO.</b> Ironia quase sempre é crítica disfarçada de elogio.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Ponto de vista = opinião do autor.<br>Procure adjetivos, verbos e ironia.<br>Ironia = crítica disfarçada.</div>
`},
{title:"4 - Estruturação do texto: relações entre ideias; recursos de coesão",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 4: Estruturação do texto: relações entre ideias; recursos de coesão.</div>
<h3>2. COESÃO - O QUE É?</h3><p>Coesão é a cola do texto. São palavras que ligam uma frase na outra, para o texto não ficar solto. Sem coesão, o texto fica: "João foi ao fórum. João pegou processo. João voltou." Com coesão: "João foi ao fórum, <b>onde</b> pegou o processo e, <b>em seguida</b>, voltou."</p>
<h3>3. TABELA QUE MAIS CAI</h3><table><tr><th>Palavra de ligação</th><th>Ideia</th><th>Exemplo</th></tr><tr><td>e, também, além disso</td><td>Adição</td><td>Estudo <b>e</b> trabalho.</td></tr><tr><td>mas, porém, contudo, todavia, entretanto</td><td>Oposição / Contraste</td><td>Estudo muito, <b>mas</b> não passo.</td></tr><tr><td>porque, pois, já que, visto que</td><td>Causa / Explicação</td><td>Estudo <b>porque</b> quero passar.</td></tr><tr><td>portanto, logo, assim, então</td><td>Consequência / Conclusão</td><td>Estudei, <b>portanto</b>, passei.</td></tr><tr><td>se, caso, desde que</td><td>Condição</td><td><b>Se</b> estudar, passa.</td></tr><tr><td>embora, apesar de, mesmo que</td><td>Concessão (apesar de)</td><td><b>Embora</b> cansado, estudou.</td></tr><tr><td>quando, enquanto, assim que</td><td>Tempo</td><td><b>Quando</b> cheguei, ele saiu.</td></tr></table>
<h3>4. PRONOMES COMO COESÃO</h3><p>"Maria entregou o processo. <b>Ela</b> estava cansada." - <b>Ela</b> retoma Maria, evita repetir.<br>"O juiz e o promotor discutiram. <b>Este</b> defendia a condenação, <b>aquele</b> a absolvição." - Este = o último (promotor), Aquele = o primeiro (juiz). A VUNESP ama isso!</p>
<h3>5. PEGADINHA</h3><div class="box-peg">"Mas e porém são a mesma coisa que portanto." <b>ERRADO.</b> Mas/porém = oposição. Portanto = conclusão.<br>"Este e aquele são iguais." <b>ERRADO.</b> Este = mais perto / último citado. Aquele = mais longe / primeiro citado.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Coesão = cola do texto.<br>Decore a tabela: adição, oposição, causa, consequência, condição, concessão, tempo.<br>Este = último. Aquele = primeiro.</div>
`},
{title:"5 - Significação contextual de palavras e expressões",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 5: Significação contextual de palavras e expressões.</div>
<h3>2. EXPLICAÇÃO</h3><p>A mesma palavra pode ter sentido diferente dependendo do contexto. Você não pode decorar a palavra sozinha, tem que ler a frase inteira.</p>
<h3>3. EXEMPLOS QUE CAEM</h3><ul><li><b>Banco:</b> "Sentei no <b>banco</b> da praça" (assento) x "Fui ao <b>banco</b> sacar dinheiro" (instituição financeira) x "Banco de dados" (conjunto de informações).</li><li><b>Manga:</b> "Comi uma <b>manga</b>" (fruta) x "A <b>manga</b> da camisa rasgou" (parte da roupa).</li><li><b>Ponto:</b> "Cheguei no <b>ponto</b>" (lugar) x "Você tem um <b>ponto</b>" (razão) x "<b>Ponto</b> final" (pontuação).</li></ul>
<h3>4. COMO A VUNESP PERGUNTA</h3><p>Ela dá um trecho e pergunta: "No trecho '...', a palavra X pode ser substituída, sem mudar o sentido, por:"<br>Você tem que testar cada alternativa NA FRASE, não no dicionário. A alternativa tem que encaixar no contexto.</p>
<h3>5. PEGADINHA</h3><div class="box-peg">A alternativa pode ser sinônimo no dicionário, mas não encaixar no contexto. Ex: "Ele <b>quebrou</b> a cara." Se trocar por "Ele <b>fraturou</b> a cara", está errado, porque "quebrar a cara" é expressão, significa se dar mal, não fraturar de verdade.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Palavra muda de sentido com o contexto.<br>Teste a alternativa DENTRO da frase.<br>Expressão idiomática não se traduz ao pé da letra.</div>
`},
{title:"6 - Sinônimos e antônimos",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 6: Sinônimos e antônimos.</div>
<h3>2. DEFINIÇÃO</h3><ul><li><b>Sinônimo:</b> mesma ideia, palavra diferente. Ex: alegre = feliz, contente. Rápido = veloz, ágil.</li><li><b>Antônimo:</b> ideia contrária. Ex: alegre x triste. Rápido x lento. Bom x mau.</li></ul>
<h3>3. CUIDADO - NEM TODO SINÔNIMO SERVE</h3><p>Sinônimo perfeito quase não existe. "Casa" e "residência" são sinônimos, mas você não fala "vou para minha residência" no dia a dia. A VUNESP cobra o sinônimo que cabe no contexto.</p><p>Ex: "O juiz foi <b>justo</b>." Sinônimo que cabe: imparcial, correto. Sinônimo que NÃO cabe: "O juiz foi <b>exato</b>." Exato não é sinônimo de justo nesse contexto.</p>
<h3>4. ANTÔNIMOS QUE CAEM MUITO</h3><table><tr><th>Palavra</th><th>Antônimo</th></tr><tr><td>Prolixo (fala demais)</td><td>Conciso / Sucinto</td></tr><tr><td>Efêmero (passageiro)</td><td>Duradouro / Eterno</td></tr><tr><td>Presunçoso</td><td>Humilde / Modesto</td></tr><tr><td>Altruísta</td><td>Egoísta</td></tr><tr><td>Idôneo</td><td>Inidôneo</td></tr></table>
<h3>5. PEGADINHA</h3><div class="box-peg">"Bom e mau são sinônimos." <b>ERRADO.</b> São antônimos.<br>"Mais e mas são sinônimos." <b>ERRADO.</b> Mais = quantidade. Mas = porém. São palavras diferentes.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Sinônimo = mesma ideia. Antônimo = ideia contrária.<br>Teste sempre no contexto, não só no dicionário.</div>
`},
{title:"7 - Sentido próprio e figurado das palavras",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 7: Sentido próprio e figurado das palavras.</div>
<h3>2. DIFERENÇA</h3><table><tr><th>Sentido Próprio (Denotação)</th><th>Sentido Figurado (Conotação)</th></tr><tr><td>É o sentido do dicionário, literal, real.</td><td>É o sentido inventado, metafórico, emocional.</td></tr><tr><td>Ex: "Ele tem um <b>coração</b> grande" - órgão que bombeia sangue, se for exame médico.</td><td>Ex: "Ele tem um <b>coração</b> grande" - ele é generoso.</td></tr></table>
<h3>3. EXEMPLOS CLÁSSICOS</h3><ul><li><b>Próprio:</b> "A <b>pedra</b> caiu no chão." (pedra de verdade)</li><li><b>Figurado:</b> "Ele é uma <b>pedra</b> no meu caminho." (obstáculo, pessoa difícil)</li><li><b>Próprio:</b> "O <b>leão</b> rugiu na savana."</li><li><b>Figurado:</b> "Meu chefe é um <b>leão</b>." (bravo, forte)</li></ul>
<h3>4. FIGURAS QUE A VUNESP AMA</h3><ul><li><b>Metáfora:</b> comparação sem usar "como". "Ele é um <b>leão</b>." (Ele é como um leão, mas sem o como)</li><li><b>Comparação:</b> usa "como". "Ele é <b>como</b> um leão."</li><li><b>Ironia:</b> diz o contrário do que pensa. "Que <b>ótimo</b>, mais trabalho!" (Ele não acha ótimo)</li><li><b>Eufemismo:</b> suaviza. "Ele <b>partiu</b>." (Ele morreu)</li></ul>
<h3>5. PEGADINHA</h3><div class="box-peg">"Metáfora e comparação são iguais." <b>ERRADO.</b> Metáfora não usa "como". Comparação usa.<br>"Sentido figurado é erro de português." <b>ERRADO.</b> É recurso de estilo, usado em literatura e até em conversa.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Próprio = dicionário, literal. Figurado = metáfora, emoção.<br>Metáfora = sem "como". Comparação = com "como".</div>
`},
{title:"8 - Classes de palavras - 8.a a 8.i COMPLETO",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 8: Classes de palavras: substantivo, adjetivo, artigo, numeral, pronome, verbo, advérbio, preposição e conjunção.</div>
<p><b>Macete para decorar as 10:</b> <b>Sub Adj Art Num Pron Verb Adv Prep Conj Interj</b> - A prova do TJSP cobra 9, sem interjeição. Decore na ordem: <b>S A A N P V A P C</b></p>
<h3>8.a SUBSTANTIVO - Dá nome</h3><p>Nome de pessoa, lugar, coisa, sentimento. Ex: <b>juiz, fórum, processo, alegria, São Paulo</b>.<br><b>Classificação:</b> Comum (cidade) x Próprio (São Paulo). Concreto (mesa) x Abstrato (alegria). Simples (casa) x Composto (guarda-chuva). Primitivo (pedra) x Derivado (pedreiro). Coletivo (cardume = grupo de peixes, turma = grupo de alunos).</p>
<h3>8.b ADJETIVO - Dá qualidade</h3><p>Diz como é o substantivo. Ex: processo <b>rápido</b>, juiz <b>justo</b>, casa <b>grande</b>.<br><b>Pegadinha:</b> Adjetivo concorda com substantivo. "Processos <b>rápidos</b>" - plural. "Decisão <b>justa</b>" - feminino.</p>
<h3>8.c ARTIGO - Define</h3><p><b>Definido:</b> o, a, os, as - fala de algo específico. " <b>O</b> processo" (aquele processo).<br><b>Indefinido:</b> um, uma, uns, umas - fala de algo genérico. " <b>Um</b> processo" (qualquer processo).</p>
<h3>8.d NUMERAL - Conta, ordena</h3><p><b>Cardinal:</b> um, dois, três - conta.<br><b>Ordinal:</b> primeiro, segundo, terceiro - ordena.<br><b>Multiplicativo:</b> dobro, triplo.<br><b>Fracionário:</b> metade, terço.</p>
<h3>8.e PRONOME - Substitui o nome</h3><p>Evita repetição. Ex: "Maria pegou o processo. <b>Ela</b> leu." Ela = Maria.<br><b>Tipos que mais caem:</b> Pessoal (eu, tu, ele, nós), Possessivo (meu, teu, seu), Demonstrativo (este, esse, aquele), Relativo (que, quem, onde), Indefinido (algum, nenhum, todo), Interrogativo (quem? qual?).<br><b>Este x Esse x Aquele:</b> Este = perto de quem fala. Esse = perto de quem ouve. Aquele = longe dos dois.</p>
<h3>8.f VERBO - Ação, estado, fenômeno</h3><p>Ex: <b>estudar, ser, estar, chover</b>.<br><b>Conjugação:</b> Pessoa (eu, tu, ele), Número (singular/plural), Tempo (presente, passado, futuro), Modo (indicativo = certeza, subjuntivo = dúvida, imperativo = ordem), Voz (ativa, passiva).<br><b>Verbo de ligação:</b> ser, estar, parecer, ficar - liga sujeito a característica. "Ele <b>está</b> cansado."</p>
<h3>8.g ADVÉRBIO - Modifica verbo, adjetivo ou outro advérbio</h3><p>Ex: Ele fala <b>rapidamente</b> (como fala?). Ele chegou <b>ontem</b> (quando?). Ele mora <b>aqui</b> (onde?). Ele fala <b>muito</b> (quanto?).<br><b>Tipos:</b> Modo (bem, mal, rapidamente), Tempo (ontem, hoje, amanhã), Lugar (aqui, ali, lá), Intensidade (muito, pouco, bastante), Negação (não, nunca), Dúvida (talvez, possivelmente).</p>
<h3>8.h PREPOSIÇÃO - Liga palavras</h3><p><b>Decore:</b> <b>A, ANTE, ATÉ, APÓS, COM, CONTRA, DE, DESDE, EM, ENTRE, PARA, PERANTE, POR, SEM, SOB, SOBRE, TRÁS</b>.<br>Ex: "Vou <b>para</b> o fórum" - para indica destino. "Falo <b>com</b> o juiz" - com indica companhia.</p>
<h3>8.i CONJUNÇÃO - Liga orações</h3><p>Ex: "Estudo <b>e</b> trabalho" (adição). "Estudo, <b>mas</b> não passo" (oposição). "Estudo <b>porque</b> quero passar" (causa). "Estudei, <b>portanto</b>, passei" (conclusão).<br><b>Coordenativa:</b> liga ideias independentes (e, mas, ou). <b>Subordinativa:</b> liga ideia dependente (porque, se, quando, embora).</p>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Substantivo = nome. Adjetivo = qualidade. Artigo = define. Numeral = conta.<br>Pronome = substitui. Verbo = ação. Advérbio = modifica. Preposição = liga palavra. Conjunção = liga oração.</div>
`},
{title:"9 - Concordância verbal e nominal",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 9: Concordância verbal e nominal.</div>
<h3>2. CONCORDÂNCIA VERBAL - Verbo concorda com sujeito</h3><ul><li><b>Regra geral:</b> "Os servidores <b>trabalham</b>." Sujeito plural = verbo plural. "O servidor <b>trabalha</b>." Sujeito singular = verbo singular.</li><li><b>HAVER = EXISTIR - impessoal:</b> Sempre no SINGULAR. <b>Certo:</b> Havia muitos processos. Houve muitos processos. <b>Errado:</b> Haviam muitos processos. <b>VUNESP pega 80% aqui.</b></li><li><b>FAZER tempo - impessoal:</b> Sempre singular. <b>Certo:</b> Faz dois anos que estudo. <b>Errado:</b> Fazem dois anos.</li><li><b>SE + verbo:</b> "Vende-se casas" - Se for partícula apassivadora, concorda: <b>Vendem-se casas</b>. "Precisa-se de servidores" - Se for índice de indeterminação, fica singular: <b>Precisa-se</b>.</li></ul>
<h3>3. CONCORDÂNCIA NOMINAL - Adjetivo concorda com substantivo</h3><ul><li><b>Regra geral:</b> "Processo <b>rápido</b>" / "Processos <b>rápidos</b>" / "Decisão <b>justa</b>".</li><li><b>É proibido / É proibida:</b> Sem artigo = invariável. "É proibido entrada." Com artigo = concorda. "É proibida <b>a</b> entrada."</li><li><b>É necessário / É necessária:</b> Mesma regra. "É necessário atenção." / "É necessária <b>a</b> atenção."</li><li><b>Bom / Boa:</b> "É bom vinho." / "É boa <b>a</b> cerveja."</li></ul>
<h3>4. PEGADINHA VUNESP</h3><div class="box-peg">"Haviam muitos processos no fórum." <b>ERRADO.</b> Havia.<br>"Fazem dois anos que trabalho aqui." <b>ERRADO.</b> Faz dois anos.<br>"É proibida entrada de animais." <b>ERRADO.</b> Sem "a", é proibido. Certo: É proibido entrada / É proibida A entrada.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Verbo concorda com sujeito. Haver e Fazer tempo = sempre singular.<br>É proibido / necessário / bom: sem artigo = masculino singular. Com artigo = concorda.</div>
`},
{title:"10 - Regência verbal e nominal",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 10: Regência verbal e nominal.</div>
<h3>2. REGÊNCIA VERBAL - Qual preposição o verbo pede?</h3><table><tr><th>Verbo</th><th>Regência correta</th><th>Errado que cai</th></tr><tr><td>Assistir (ver)</td><td>Assistir <b>AO</b> jogo</td><td>Assistir o jogo</td></tr><tr><td>Preferir</td><td>Prefiro café <b>A</b> chá (sem MAIS, sem DO QUE)</td><td>Prefiro mais café do que chá</td></tr><tr><td>Chegar / Ir</td><td>Cheguei <b>AO</b> fórum</td><td>Cheguei NO fórum</td></tr><tr><td>Obedecer</td><td>Obedecer <b>AO</b> juiz</td><td>Obedecer o juiz</td></tr><tr><td>Aspirar (desejar)</td><td>Aspirar <b>A</b> uma vaga</td><td>Aspirar uma vaga</td></tr><tr><td>Visar (desejar)</td><td>Visar <b>A</b> um cargo</td><td>Visar um cargo</td></tr><tr><td>Namorar</td><td>Namorar <b>COM</b> alguém</td><td>Namorar alguém (sem com é aceito, mas VUNESP prefere com)</td></tr><tr><td>Morar / Residir</td><td>Morar <b>EM</b> São Paulo</td><td>Morar São Paulo</td></tr></table>
<h3>3. REGÊNCIA NOMINAL - Qual preposição o nome pede?</h3><ul><li>Obediente <b>A</b> / Desobediente <b>A</b></li><li>Ansioso <b>POR</b> / Ansioso <b>PARA</b></li><li>Capaz <b>DE</b> / Incapaz <b>DE</b></li><li>Responsável <b>POR</b></li><li>Apaixonado <b>POR</b></li></ul>
<h3>4. PEGADINHA</h3><div class="box-peg">"Prefiro mais café do que chá." <b>ERRADO.</b> Prefiro já é comparativo, não usa MAIS nem DO QUE.<br>"Cheguei no fórum." <b>ERRADO para VUNESP.</b> Cheguei AO fórum.<br>"Assisti o jogo." <b>ERRADO.</b> Assisti AO jogo.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Assistir AO, Preferir A (sem mais), Chegar AO, Obedecer AO, Aspirar A, Visar A.<br>Decore a tabela, cai toda prova.</div>
`},
{title:"11 - Colocação pronominal",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 11: Colocação pronominal.</div>
<h3>2. O QUE É?</h3><p>Onde colocar o pronome oblíquo (me, te, se, o, a, lhe, nos, vos, os, as, lhes) na frase? Antes, no meio ou depois do verbo?</p>
<h3>3. AS 3 POSIÇÕES</h3><table><tr><th>Posição</th><th>Onde fica?</th><th>Exemplo</th></tr><tr><td><b>Próclise</b> - Antes</td><td>Antes do verbo</td><td><b>Me</b> ajude. / Não <b>me</b> ajude.</td></tr><tr><td><b>Mesóclise</b> - Meio</td><td>No meio do verbo (futuro)</td><td>Ajuda<b>r-me</b>-á. / Dar-<b>me</b>-ia.</td></tr><tr><td><b>Ênclise</b> - Depois</td><td>Depois do verbo</td><td>Ajude-<b>me</b>. / Ajudou-<b>me</b>.</td></tr></table>
<h3>4. QUANDO USAR CADA UMA - REGRA QUE CAI</h3><ul><li><b>Próclise OBRIGATÓRIA quando tem palavra atrativa antes:</b> Não, nunca, jamais, só, apenas, quem, que, quando, se, embora, etc.<br>Ex: "Não <b>me</b> ajude." / "Quem <b>me</b> ajuda?" / "Só <b>me</b> ajude se puder."<br><b>Errado:</b> "Não ajude-me." / "Quem ajuda-me?"</li><li><b>Mesóclise OBRIGATÓRIA com futuro + sem palavra atrativa:</b> "Ajudar-<b>me</b>-á amanhã." / "Dar-<b>me</b>-ia se pudesse."</li><li><b>Ênclise:</b> Início de frase (não pode começar com pronome!) e verbo no imperativo afirmativo.<br>Ex: "<b>Ajude-me</b>." (Não pode: "Me ajude" no início, na norma culta). "Ajudou-<b>me</b> ontem."</li></ul>
<h3>5. PEGADINHA VUNESP</h3><div class="box-peg">"Me ajude, por favor." No início da frase, na norma culta, é <b>ERRADO.</b> Certo: "Ajude-me."<br>"Não me ajude." <b>CERTO.</b> "Não" atrai próclise.<br>"Ajudar-me-á." <b>CERTO.</b> Futuro sem atrativo = mesóclise.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Palavra atrativa (não, nunca, que, se, quem) = próclise (antes).<br>Futuro sem atrativo = mesóclise (meio).<br>Início de frase = ênclise (depois). Nunca comece frase com pronome.</div>
`},
{title:"12 - Crase",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 12: Crase.</div>
<h3>2. O QUE É CRASE?</h3><p>Crase é a fusão de <b>A + A = À</b>. A primeira A é preposição, a segunda A é artigo (a, as) ou pronome demonstrativo (aquele, aquela, aquilo).</p>
<h3>3. MACETE INFALÍVEL QUE NÃO FALHA</h3><div class="box-macete"><b>Troca por AO masculino. Se der AO, tem crase no feminino.</b><br>"Fui <b>à</b> praia." -> "Fui <b>AO</b> shopping." Deu AO, então tem crase. ✅<br>"Fui <b>a</b> pé." -> "Fui <b>AO</b> pé." Não faz sentido, então NÃO tem crase. ✅<br>Use sempre esse macete na prova, ele resolve 90% das questões.</div>
<h3>4. QUANDO TEM CRASE - Decore</h3><ul><li><b>Às vezes, às 10 horas, à noite, à tarde:</b> Tem crase. "Cheguei <b>às</b> 10 horas."</li><li><b>À medida que, à proporção que:</b> Tem crase. " <b>À medida que</b> estudo, aprendo."</li><li><b>À moda de, à maneira de:</b> Tem crase, mesmo escondido. "Bife <b>à</b> milanesa" (= à moda de Milão).</li><li><b>Antes de pronome demonstrativo:</b> "Refiro-me <b>àquela</b> decisão." (A + aquela = àquela).</li></ul>
<h3>5. QUANDO NÃO TEM CRASE - Decore</h3><ul><li><b>Antes de verbo:</b> "Começou <b>a</b> chover." Nunca tem crase antes de verbo.</li><li><b>Antes de palavra masculina:</b> "Fui <b>a</b> pé, <b>a</b> cavalo." Pé e cavalo são masculinos, não tem A.</li><li><b>Depois de "a partir":</b> " <b>A partir</b> de amanhã." NUNCA tem crase em "a partir".</li><li><b>Antes de pronome pessoal:</b> "Falei <b>a</b> ela." Não tem crase antes de ela, ele, você, mim.</li><li><b>Antes de "casa" sem adjetivo:</b> "Vou <b>a</b> casa." Sem crase. "Vou <b>à</b> casa da minha mãe." Com crase, porque tem "da minha mãe" especificando.</li></ul>
<h3>6. PEGADINHA</h3><div class="box-peg">"Começou à chover." <b>ERRADO.</b> Verbo nunca tem crase.<br>"A partir de amanhã" com crase. <b>ERRADO.</b> "A partir" nunca tem crase.<br>"Fui à pé." <b>ERRADO.</b> Pé é masculino.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Macete: troca por AO. Se der AO, tem crase.<br>Tem: às vezes, às horas, à medida que, àquela.<br>Nunca: antes de verbo, antes de masculino, a partir, antes de ela/ele.</div>
`},
{title:"13 - Pontuação",content:`
<h3>1. O QUE O EDITAL PEDE</h3><div class="box-legal">Item 13: Pontuação.</div>
<h3>2. VÍRGULA - A que mais cai</h3><p><b>NUNCA use vírgula para:</b></p><ul><li><b>Separar sujeito do verbo:</b> "Os servidores, trabalham muito." <b>ERRADO.</b> Certo: "Os servidores trabalham muito."</li><li><b>Separar verbo do complemento:</b> "O juiz proferiu, a sentença." <b>ERRADO.</b> Certo: "O juiz proferiu a sentença."</li></ul><p><b>USE vírgula OBRIGATORIAMENTE para:</b></p><ul><li><b>Aposto:</b> "João, <b>o escrevente</b>, chegou." Aposto é explicação, fica entre vírgulas.</li><li><b>Vocativo:</b> " <b>João,</b> venha aqui." Vocativo é chamamento.</li><li><b>Adjunto adverbial deslocado:</b> " <b>Ontem,</b> o juiz proferiu a sentença." Se está no início, deslocado, tem vírgula.</li><li><b>Oração intercalada:</b> "O juiz, <b>segundo o processo</b>, decidiu."</li><li><b>Enumeração:</b> "Comprei processo, caneta, papel <b>e</b> pasta." Vírgula entre itens, mas não antes do E.</li></ul>
<h3>3. PONTO E VÍRGULA ;</h3><p>Usado para separar itens de uma lista longa, ou orações que já têm vírgula dentro. Ex: "Foram convocados João, escrevente; Maria, juíza; e Pedro, promotor."</p>
<h3>4. DOIS PONTOS :</h3><p>Usado para anunciar citação, explicação, enumeração. Ex: "O juiz disse: 'Vou proferir a sentença.'" / "Preciso de: caneta, papel e processo."</p>
<h3>5. ASPAS " "</h3><p>Para citação direta, ironia, palavra estrangeira. Ex: Ele disse que estava "cansado" (ironia).</p>
<h3>6. PEGADINHA VUNESP</h3><div class="box-peg">"Os servidores, trabalham muito." <b>ERRADO.</b> Não separa sujeito do verbo.<br>"João, venha aqui." <b>CERTO.</b> Vocativo tem vírgula.<br>"Ontem o juiz decidiu." Sem vírgula? Se "ontem" está no início, o certo é "Ontem, o juiz decidiu." A VUNESP cobra isso.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>NUNCA: sujeito-verbo, verbo-complemento.<br>SEMPRE: aposto, vocativo, adjunto deslocado, intercalada, enumeração.<br>Dois pontos = anuncia. Aspas = citação / ironia.</div>
`}
]}
];

function setMode(m){mode=m;['livro','resumo','simular'].forEach(k=>{let b=document.getElementById('tab-'+k);if(b){let on=(k===m);b.style.background=on?'#7f1d1d':'#fff';b.style.color=on?'#fff':'#000'}});let list=getList();activeTopic=list[0].id;chapterIndex=0;qIndex=0;render()}
function renderSidebar(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let list=getList();let html='';let title=mode==='livro'?'📖 Livro Completo - BLOCO I':mode==='resumo'?'⚡ Resuminho - BLOCO I':'📝 Simulado - BLOCO I';html+=`<div class="card"><b>${title}</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:0%"></div></div><small id="ptext"></small></div>`;list.forEach(t=>{let key=getKey()+t.id;let done=(hist[key]?.done||0);let total=mode==='simular'?t.questions.length:t.chapters.length;let pct=total?Math.round(done/total*100):0;let label=mode==='simular'?`${done}/${total} • ${pct}%`:`${done}/${total} caps • ${pct}%`;html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${label}</small></div><span class="badge">${pct}%</span></div>`});html+=`<div class="card" style="background:#fff7ed"><b>Próximos blocos</b><br><small>BLOCO II - Direito (30Q) - em breve<br>BLOCO III - Gerais - em breve</small></div>`;document.getElementById("sidebar").innerHTML=html;updateProgress()}
function updateProgress(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let list=getList();let pct=0,txt="";if(mode==='simular'){let tot=list.reduce((s,t)=>s+t.questions.length,0);let done=list.reduce((s,t)=>s+(hist[t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" • "+pct+"%"}else{let key=getKey();let tot=list.reduce((s,t)=>s+t.chapters.length,0);let done=list.reduce((s,t)=>s+(hist[key+t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" págs • "+pct+"%"}let b=document.getElementById("pbar");if(b)b.style.width=pct+"%";let pt=document.getElementById("ptext");if(pt)pt.innerText=txt}
function selectTopic(id){activeTopic=id;chapterIndex=0;qIndex=0;chosen=null;if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open');render()}
function render(){renderSidebar();let list=getList();let t=list.find(x=>x.id===activeTopic);if(mode==='simular'){let total=t.questions.length;let qq=t.questions[qIndex];if(!qq){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><p>Você fez ${total} questões. Isso é exatamente o número da prova real do BLOCO I.</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="qIndex=0;render()">Refazer</button> <button class="btn" onclick="setMode('resumo')">Ver Resuminho →</button></div></div>`;return}let html=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${t.icon} ${t.name}</b><span class="badge">${qIndex+1}/${total}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((qIndex/total)*100)}%"></div></div><p class="q">${qIndex+1}. ${qq.q}</p><div id="opts">${qq.o.map((op,i)=>`<div class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${op}</div>`).join("")}</div><div id="feedback" class="hidden"></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="confirmQ()">Corrigir (Enter)</button><button class="btn" onclick="nextQ()">Pular</button></div></div>`;document.getElementById("app").innerHTML=html;return}
let chap=t.chapters[chapterIndex];if(!chap){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><p>Você terminou ${mode==='livro'?'o Livro Completo':'o Resuminho'} do BLOCO I.</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="chapterIndex=0;render()">Recomeçar</button> ${mode==='livro'?'<button class="btn" onclick="setMode(\'resumo\')">Ir pro Resuminho →</button>':'<button class="btn" onclick="setMode(\'simular\')">Ir pro Simulado 16Q →</button>'}</div></div>`;return}
let nextLabel=mode==='livro'?'✅ Li e entendi + Próxima →':'✅ Revisei + Próxima →';let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${t.icon} ${t.name} - ${chap.title}</b><span class="badge">${chapterIndex+1}/${t.chapters.length}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((chapterIndex/t.chapters.length)*100)}%"></div></div><div class="book-page">${chap.content}</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="markRead()">${nextLabel} (Enter)</button><button class="btn" onclick="nextChapter()">Pular →</button></div></div>`;document.getElementById("app").innerHTML=html}
function markRead(){let users=getUsers();let cur=getCurrent();if(!users[cur])return;let key=getKey()+activeTopic;if(!users[cur].history[key])users[cur].history[key]={done:0};let h=users[cur].history[key];if(chapterIndex>=(h.done||0))h.done=Math.max(h.done||0,chapterIndex+1);saveUsers(users);nextChapter()}
function nextChapter(){let t=getList().find(x=>x.id===activeTopic);if(!t)return;chapterIndex++;if(chapterIndex>=t.chapters.length)chapterIndex=t.chapters.length;render()}
function choose(i){chosen=i;document.querySelectorAll(".opt").forEach((el,idx)=>{el.style.borderWidth=idx===i?"3px":"1.5px";el.style.fontWeight=idx===i?"700":"400"})}
function confirmQ(){if(chosen===null)return alert("Escolha 1-4");let t=DB.find(x=>x.id===activeTopic);let qq=t.questions[qIndex];document.querySelectorAll(".opt").forEach((el,idx)=>{if(idx===qq.a)el.classList.add("correct");else if(idx===chosen&&chosen!==qq.a)el.classList.add("wrong")});let acerto=chosen===qq.a;let fb=document.getElementById("feedback");fb.classList.remove("hidden");fb.innerHTML=`<div class="explain"><div style="font-weight:800;color:${acerto?'#16a34a':'#dc2626'}">${acerto?'✅ ACERTOU!':'❌ ERROU'}</div><div style="margin-top:8px"><b>Correta: ${String.fromCharCode(65+qq.a)}. ${qq.o[qq.a]}</b></div><div style="margin-top:8px"><b>Por que CERTA está certa:</b><br><small>${qq.ec}</small></div><div style="margin-top:8px"><b>Por que ERRADAS estão erradas:</b><br><small>${qq.ei}</small></div><div style="margin-top:8px;background:#fff;border:1px dashed #000;border-radius:8px;padding:8px"><b>📚 Explicação Completa:</b><br><small>${qq.e}</small></div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary" onclick="nextQ()">Próxima →</button> <button class="btn" onclick="setMode('livro')">Ver livro 📖</button></div></div>`;let users=getUsers();let cur=getCurrent();if(!users[cur].history[activeTopic])users[cur].history[activeTopic]={done:0,hits:0};let h=users[cur].history[activeTopic];if(qIndex>=(h.done||0))h.done=Math.max(h.done||0,qIndex+1);if(acerto)h.hits=(h.hits||0)+1;saveUsers(users);updateProgress()}
function nextQ(){let t=DB.find(x=>x.id===activeTopic);qIndex++;chosen=null;if(qIndex>=t.questions.length)qIndex=t.questions.length;render()}
function checkAuth(){let cur=getCurrent();let loginDiv=document.getElementById("login-overlay");if(!cur){if(!loginDiv){let div=document.createElement("div");div.id="login-overlay";div.innerHTML=`<div style="position:fixed;inset:0;background:linear-gradient(135deg,#7f1d1d,#991b1b);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px"><div class="card" style="width:100%;max-width:420px;background:#fff"><h2 style="margin-top:0;color:#000">Login TJSP</h2><input id="name" placeholder="Seu nome" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><input id="pass" type="password" placeholder="Senha: SaygonEscrivao2026" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><button class="btn btn-primary" style="width:100%;padding:12px;margin-top:8px" onclick="doLogin()">Entrar</button><p style="margin-top:12px"><a href="#" onclick="openReset();return false" style="color:#000">Esqueci senha / Reset com chave</a></p><small style="color:#000">Senha padrão: SaygonEscrivao2026<br>Chave: TJSP2026RESET</small></div></div>`;document.body.appendChild(div);setTimeout(()=>{document.getElementById("name")?.focus()},100)}return false}else{if(loginDiv)loginDiv.remove();return true}}
function doLogin(){let n=document.getElementById("name")?.value.trim();let p=document.getElementById("pass")?.value;if(!n){alert("Digite seu nome");return}let u=getUsers();if(!u[n]){u[n]={pass:p||DEFAULT_PASS,history:{}};saveUsers(u);setCurrent(n);location.reload();return}if(u[n].pass===p){setCurrent(n);location.reload()}else{alert("Senha incorreta.")}}
function logout(){localStorage.removeItem("tjsp_current");location.reload()}
function openReset(){let cur=getCurrent();let nome=cur||prompt("Nome do usuário:");if(!nome)return;let chave=prompt("Chave mestra:");if(chave!==MASTER_KEY)return alert("Chave incorreta");let nova=prompt("Nova senha:");if(!nova)return;let u=getUsers();if(!u[nome])u[nome]={pass:nova,history:{}};else u[nome].pass=nova;saveUsers(u);setCurrent(nome);alert("Senha trocada! ✅");location.reload()}
function exportBackup(){let u=getUsers();let cur=getCurrent();if(!cur)return alert("Faça login");let data=JSON.stringify(u[cur]||{},null,2);let blob=new Blob([data],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download=`backup-${cur}-tjsp.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener("keydown",e=>{if(!checkAuth())return;if(e.key>="1"&&e.key<="4"&&mode==='simular'){let fb=document.getElementById("feedback");if(!fb||fb.classList.contains("hidden"))choose(parseInt(e.key)-1)}if(e.key==="Enter"){if(mode!=='simular'){markRead()}else{let fb=document.getElementById("feedback");if(fb&&!fb.classList.contains("hidden"))nextQ();else confirmQ()}}});
if(checkAuth()){render()}
</script>
</body>
</html>

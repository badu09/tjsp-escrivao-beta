{id:"constitucional",name:"Direito Constitucional",icon:"⚖️",chapters:[
{title:"Cap 1 - Art 5º Caput - Os 5 Direitos",content:`
<h3>1. LEI SECA COMPLETA - Leia 2 vezes</h3>
<div class="box-legal"><b>Art. 5º, CF:</b> Todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à <b>vida, à liberdade, à igualdade, à segurança e à propriedade</b>, nos termos seguintes.</div>
<h3>2. O QUE ISSO QUER DIZER?</h3>
<p>O caput do Art. 5º é o coração dos Direitos Fundamentais. Ele diz que o Estado não pode te tirar esses 5 direitos sem seguir a lei. E ele vale para <b>brasileiros E estrangeiros residentes no Brasil</b>. Turista que está só de passagem também tem proteção à vida e liberdade, mas a redação fala em residentes.</p>
<h4>Os 5 direitos - V-L-I-S-P</h4>
<ul><li><b>Vida:</b> O Estado não pode te matar. Vedação à pena de morte, salvo em caso de guerra declarada (Art. 5º, XLVII, a + Art. 84, XIX). Aborto? O STF já decidiu que anencefalia não é crime (ADPF 54).</li><li><b>Liberdade:</b> São 17 liberdades listadas no Art. 5º: locomoção, pensamento, crença, expressão, profissão, reunião, associação, etc. Nenhuma é absoluta.</li><li><b>Igualdade:</b> Tem 2 tipos. <b>Formal:</b> todos iguais na lei. <b>Material:</b> tratar desiguais de forma desigual, para igualar de verdade. Ex: cotas. O STF validou cotas raciais na ADC 41 e ADPF 186.</li><li><b>Segurança:</b> Segurança jurídica (não ser surpreendido por lei nova) e segurança física (o Estado tem que te proteger).</li><li><b>Propriedade:</b> Você tem direito de ter bens, mas a propriedade tem que cumprir <b>função social</b> (Art. 5º, XXII e XXIII). Se você tem um terreno no meio da cidade abandonado há 20 anos, o Estado pode desapropriar.</li></ul>
<h3>3. EXEMPLO DE VERDADE</h3>
<p>Maria tem um terreno em Santos, abandonado, cheio de lixo, sem pagar IPTU há 10 anos. A prefeitura pode desapropriar? <b>SIM.</b> Porque a propriedade dela não está cumprindo função social. O direito de propriedade existe, mas não é absoluto.</p>
<h3>4. PEGADINHA VUNESP - CAI TODO ANO</h3>
<div class="box-peg"><b>A banca troca propriedade por moradia, saúde ou educação.</b><br>Questão errada clássica: "O Art. 5º garante vida, liberdade, igualdade, segurança e <b>moradia</b>."<br><b>ERRADO.</b> Moradia, saúde, educação, trabalho, lazer são <b>Art. 6º - Direitos Sociais</b>. Não são do caput do Art. 5º.<br>Decore: <b>Caput = V-L-I-S-P. Art 6º = EDU SAU ALI TRA MOR...</b></div>
<h3>5. O QUE O STF JÁ DECIDIU</h3>
<ul><li><b>ADC 41:</b> Cotas raciais em concursos são constitucionais.</li><li><b>ADPF 186:</b> Cotas em universidades são constitucionais.</li><li><b>ADPF 54:</b> Interrupção de gravidez de feto anencéfalo não é crime.</li></ul>
<div class="box-resumo"><b>📌 RESUMO FINAL PARA DECORAR:</b><br>Caput = V-L-I-S-P<br>Vale para brasileiros + estrangeiros RESIDENTES<br>Propriedade tem função social<br>Moradia NÃO é do caput, é do Art. 6º</div>
<h3>6. QUESTÃO COMENTADA - VUNESP</h3>
<p><i>VUNESP - TJSP - Assinale a correta sobre o Art. 5º, caput:</i><br>a) Garante vida, liberdade, igualdade, segurança e moradia.<br>b) Garante vida, liberdade, igualdade, segurança e propriedade.<br>c) Garante saúde, educação e lazer.<br>d) Vale só para brasileiros natos.</p>
<p><b>Correta: B.</b> A erra porque moradia é Art. 6º. C erra porque são direitos sociais. D erra porque vale também para estrangeiros residentes.</p>
`},
{title:"Cap 2 - Igualdade e Legalidade - Art 5º I e II",content:`
<h3>1. LEI SECA</h3><div class="box-legal"><b>I -</b> homens e mulheres são iguais em direitos e obrigações, nos termos desta Constituição;<br><b>II -</b> ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de lei;</div>
<h3>2. EXPLICAÇÃO</h3><h4>Igualdade (Inciso I)</h4><p>Não significa que homem e mulher são idênticos em tudo. Significa que não pode haver discriminação sem motivo. Por isso existe licença-maternidade de 120 dias e licença-paternidade de 5 dias (agora 20 dias em algumas empresas). Isso NÃO fere a igualdade, porque a situação é diferente: só a mulher engravida e amamenta. O STF já disse que tratar diferente quem está em situação diferente é o que garante a igualdade material.</p><h4>Legalidade (Inciso II)</h4><p>É a maior diferença entre você e a Administração Pública:</p><table><tr><th>Você (Particular)</th><th>Administração Pública</th></tr><tr><td>Pode fazer TUDO que a lei NÃO proíbe</td><td>Só pode fazer o que a lei AUTORIZA</td></tr><tr><td>Ex: Você pode pintar sua casa de rosa, se nenhuma lei proíbe.</td><td>Ex: Prefeitura só pode multar se houver lei autorizando a multa.</td></tr></table>
<h3>3. EXEMPLO</h3><p>Um policial quer entrar na sua casa sem mandado, sem flagrante, só porque "achou suspeito". Pode? <b>NÃO.</b> Pelo inciso II, ninguém é obrigado a fazer algo senão em virtude de lei. E a lei (inciso XI) só permite entrar sem mandado em flagrante, desastre ou socorro.</p>
<h3>4. PEGADINHA VUNESP</h3><div class="box-peg">A banca inverte: "Para a Administração, tudo que não é proibido é permitido." <b>ERRADO.</b> Isso vale para VOCÊ, particular. Para a Administração é o contrário: só pode o que a lei permite.<br>Outra: "A igualdade impede licença-maternidade maior que paternidade." <b>ERRADO.</b> Igualdade material permite tratar diferente.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Igualdade = formal + material. Tratar diferente quem é diferente.<br>Legalidade: Particular = pode tudo que não é proibido. Adm = só o que lei autoriza.</div>
`},
{title:"Cap 3 - Intimidade, Casa, Sigilo - Art 5º X a XII",content:`
<h3>1. LEI SECA</h3><div class="box-legal"><b>X -</b> são invioláveis a intimidade, a vida privada, a honra e a imagem das pessoas, assegurado o direito a indenização pelo dano material ou moral decorrente de sua violação;<br><b>XI -</b> a casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou para prestar socorro, ou, durante o dia, por determinação judicial;<br><b>XII -</b> é inviolável o sigilo da correspondência e das comunicações telegráficas, de dados e das comunicações telefônicas, salvo, no último caso, por ordem judicial, nas hipóteses e na forma que a lei estabelecer para fins de investigação criminal ou instrução processual penal.</div>
<h3>2. EXPLICAÇÃO DETALHADA</h3><h4>Inciso X - Intimidade</h4><p>Se alguém vaza sua foto íntima, usa sua imagem sem autorização, ou te difama, você tem direito a indenização. Dano moral + material. Ex: empresa usa sua foto em propaganda sem você autorizar. Você pode processar.</p><h4>Inciso XI - Casa</h4><p>Casa é muito mais que sua residência. Para a lei, casa é:</p><ul><li>Sua casa, apartamento</li><li>Quarto de hotel que você está hospedado</li><li>Escritório FECHADO, com porta e chave</li><li>Seu consultório, seu trailer</li></ul><p><b>NÃO é casa:</b> bar aberto ao público, escritório aberto, cela de prisão, jardim, quintal aberto.</p><p><b>Quando pode entrar sem sua permissão?</b></p><table><tr><th>Situação</th><th>Pode entrar?</th></tr><tr><td>De dia, com mandado judicial</td><td>SIM</td></tr><tr><td>De noite, com mandado judicial</td><td>NÃO - de noite só com seu consentimento</td></tr><tr><td>Flagrante delito, a qualquer hora</td><td>SIM</td></tr><tr><td>Desastre ou socorro, a qualquer hora</td><td>SIM</td></tr></table><p><b>Dia = das 6h às 18h? Não.</b> A lei não define hora. A doutrina usa o critério do sol: dia é quando tem luz solar. Mas para prova, decore: <b>de dia com mandado, de noite só flagrante/desastre/socorro.</b></p><h4>Inciso XII - Sigilo</h4><p>Tem 3 sigilos diferentes, e a banca confunde:</p><table><tr><th>Sigilo</th><th>Quem pode quebrar?</th></tr><tr><td>Correspondência (carta)</td><td>Só JUIZ</td></tr><tr><td>Telefone (escuta)</td><td>Só JUIZ + Lei 9.296/96</td></tr><tr><td>Dados (bancários, fiscais)</td><td>JUIZ e CPI</td></tr></table><p><b>Delegado NUNCA quebra sigilo sozinho.</b> Promotor também não. Só juiz. E CPI pode quebrar sigilo bancário/fiscal, mas NÃO pode quebrar sigilo telefônico (escuta).</p>
<h3>3. PEGADINHA VUNESP</h3><div class="box-peg">"Delegado pode determinar interceptação telefônica." <b>ERRADO.</b> Só juiz.<br>"CPI pode determinar escuta telefônica." <b>ERRADO.</b> CPI pode dados bancários, não telefone.<br>"Policial pode entrar em casa à noite com mandado." <b>ERRADO.</b> À noite, mandado não vale, só flagrante/desastre/socorro.<br>"Bar é casa para fins de inviolabilidade." <b>ERRADO.</b> Bar é aberto ao público.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Casa = lugar fechado, privado. De dia = mandado. De noite = só flagrante.<br>Sigilo: Telefone = só juiz. Dados = juiz + CPI. Delegado = nunca.</div>
`},
{title:"Cap 4 - Processo, Contraditório e Provas - Art 5º XXXV a LVI",content:`
<h3>1. LEI SECA - Os mais importantes</h3><div class="box-legal"><b>XXXV -</b> a lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito;<br><b>XXXVII -</b> não haverá juízo ou tribunal de exceção;<br><b>LIII -</b> ninguém será processado nem sentenciado senão pela autoridade competente;<br><b>LIV -</b> ninguém será privado da liberdade ou de seus bens sem o devido processo legal;<br><b>LV -</b> aos litigantes, em processo judicial ou administrativo, e aos acusados em geral são assegurados o contraditório e ampla defesa, com os meios e recursos a ela inerentes;<br><b>LVI -</b> são inadmissíveis, no processo, as provas obtidas por meios ilícitos;<br><b>LVII -</b> ninguém será considerado culpado até o trânsito em julgado de sentença penal condenatória.</div>
<h3>2. EXPLICAÇÃO</h3><h4>Inafastabilidade da Jurisdição (XXXV)</h4><p>Você sempre pode ir ao Judiciário. Nenhuma lei pode dizer "você não pode processar". Ex: Lei diz que você tem que ir primeiro no INSS antes de processar. Isso é inconstitucional se te impedir de ir ao Judiciário.</p><h4>Devido Processo Legal (LIV)</h4><p>Tem 2 lados: <b>Formal:</b> seguir o processo certinho, com prazos, citação, etc. <b>Material:</b> a decisão tem que ser justa, proporcional, não pode ser absurda.</p><h4>Contraditório e Ampla Defesa (LV)</h4><p>Vale para processo JUDICIAL e ADMINISTRATIVO. Ex: Se você é servidor e vai responder um PAD (Processo Administrativo Disciplinar), você tem direito de se defender, ter advogado, apresentar provas. <b>Súmula Vinculante 5 STF:</b> No PAD, a falta de advogado NÃO anula, mas o direito de defesa tem que existir.</p><h4>Prova Ilícita (LVI)</h4><p>Prova obtida por meio ilegal não vale. E a prova que nasceu da prova ilegal também não vale. É a teoria do <b>fruto da árvore envenenada</b>. Ex: Polícia invade sua casa sem mandado e acha droga. A droga é prova ilícita, não pode ser usada. E se a partir da droga eles acham o traficante, essa segunda prova também é contaminada.</p><h4>Presunção de Inocência (LVII)</h4><p>Ninguém é culpado até a sentença final, sem mais recurso. Por isso, em regra, ninguém pode começar a cumprir pena antes do trânsito em julgado. O STF mudou de entendimento algumas vezes, mas para prova da VUNESP, decore a regra do inciso: <b>ninguém será considerado culpado até o trânsito em julgado.</b></p>
<h3>3. PEGADINHA VUNESP</h3><div class="box-peg">"Contraditório só vale no processo judicial." <b>ERRADO.</b> Vale também no administrativo (PAD).<br>"Prova ilícita pode ser usada se for a única prova." <b>ERRADO.</b> Ilícita é inadmissível, ponto.<br>"Juiz de exceção pode ser criado para julgar crime grave." <b>ERRADO.</b> Vedado juízo de exceção.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>XXXV = sempre pode ir ao Judiciário<br>LIV = devido processo<br>LV = contraditório vale no PAD também<br>LVI = prova ilícita = fruto da árvore envenenada<br>LVII = inocente até trânsito em julgado</div>
`},
{title:"Cap 5 - Direitos Sociais - Art 6º a 11º",content:`
<h3>1. LEI SECA</h3><div class="box-legal"><b>Art. 6º:</b> São direitos sociais a educação, a saúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância, a assistência aos desamparados, na forma desta Constituição.</div>
<h3>2. DIFERENÇA QUE CAI NA PROVA</h3><table><tr><th>Art. 5º - Direitos Individuais</th><th>Art. 6º - Direitos Sociais</th></tr><tr><td>Defesa CONTRA o Estado</td><td>Estado tem que FAZER algo por você</td></tr><tr><td>Ex: Estado não pode te prender sem motivo</td><td>Ex: Estado tem que dar escola, hospital, moradia</td></tr><tr><td>Liberdade negativa</td><td>Prestação positiva</td></tr></table>
<h3>3. MACETE PARA DECORAR O ART. 6º</h3><div class="box-macete"><b>EDU SAU ALI TRA MOR TRANS LAZ SEG PREV PROT ASSIS</b><br><b>Edu</b>cação, <b>Saú</b>de, <b>Ali</b>mentação, <b>Tra</b>balho, <b>Mor</b>adia, <b>Trans</b>porte, <b>Laz</b>er, <b>Seg</b>urança, <b>Prev</b>idência, <b>Prot</b>eção à maternidade e infância, <b>Assis</b>tência aos desamparados.<br>Repare: <b>Transporte</b> foi incluído pela Emenda 90/2015. A banca ama perguntar isso. Antes não tinha transporte no Art. 6º.</div>
<h3>4. DIREITOS DOS TRABALHADORES - Art. 7º</h3><p>Você não precisa decorar todos os 34 incisos, mas decore os que mais caem:</p><ul><li><b>Salário mínimo</b> capaz de atender necessidades vitais</li><li><b>13º salário</b></li><li><b>Férias + 1/3</b> - você recebe salário + 1/3 quando tira férias</li><li><b>Licença maternidade 120 dias</b> sem prejuízo do emprego e salário</li><li><b>Licença paternidade</b> nos termos da lei (5 dias)</li><li><b>Jornada:</b> 8h por dia, 44h por semana. Hora extra no mínimo 50% a mais</li><li><b>FGTS, Seguro-desemprego, Aviso prévio</b></li><li><b>Adicional:</b> insalubridade, periculosidade, noturno</li></ul>
<h3>5. PEGADINHA VUNESP</h3><div class="box-peg">"Moradia é direito do Art. 5º, caput." <b>ERRADO.</b> É Art. 6º.<br>"Transporte não é direito social." <b>ERRADO.</b> É sim, desde 2015.<br>"Art. 5º = Estado tem que fazer, Art. 6º = Estado não pode fazer." <b>ERRADO, INVERTIDO.</b> É o contrário.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Art. 5º = defesa. Art. 6º = prestação.<br>Decore: EDU SAU ALI TRA MOR TRANS LAZ SEG PREV PROT ASSIS</div>
`},
{title:"Cap 6 - Nacionalidade - Art 12",content:`
<h3>1. LEI SECA - RESUMIDA</h3><div class="box-legal"><b>Brasileiro NATO:</b> 1) Nascido no Brasil, mesmo de pais estrangeiros, desde que não estejam a serviço do seu país. 2) Nascido no exterior, filho de pai ou mãe brasileiro a serviço do Brasil. 3) Nascido no exterior, filho de pai ou mãe brasileiro, desde que registrado em repartição brasileira ou venha residir no Brasil e opte pela nacionalidade.<br><b>Brasileiro NATURALIZADO:</b> Estrangeiro que adquire nacionalidade brasileira na forma da lei. Português com residência e idoneidade moral tem facilidade.</div>
<h3>2. EXPLICAÇÃO COM EXEMPLOS</h3><ul><li><b>Ex 1:</b> Pedro nasceu em Santos, filho de argentinos que moravam aqui, não estavam a serviço da Argentina. Pedro é <b>nato</b>. Porque nasceu no Brasil (critério do solo - jus soli).</li><li><b>Ex 2:</b> Ana nasceu em Paris, filha de embaixador brasileiro a serviço do Brasil. Ana é <b>nata</b>. Porque nasceu no exterior, mas pai estava a serviço do Brasil.</li><li><b>Ex 3:</b> Carlos nasceu em Miami, filho de brasileiros que moravam lá, não a serviço. Ele foi registrado no consulado brasileiro. Carlos é <b>nato</b>.</li><li><b>Ex 4:</b> João nasceu em Lisboa, filho de portugueses, veio morar no Brasil, pediu naturalização. João é <b>naturalizado</b>.</li></ul>
<h3>3. DIFERENÇA QUE CAI NA PROVA - Cargos privativos de nato</h3><p>Alguns cargos SÓ podem ser ocupados por brasileiro NATO, nunca naturalizado. Decore a lista:</p><ul><li>Presidente e Vice-Presidente da República</li><li>Presidente da Câmara e do Senado</li><li>Ministro do STF</li><li>Carreira diplomática</li><li>Oficial das Forças Armadas</li><li>Ministro de Estado da Defesa</li></ul><p><b>Macete:</b> Pense nos cargos mais altos do país. Se um naturalizado pudesse ser Presidente, um estrangeiro que virou brasileiro ontem poderia comandar o Brasil. Por isso a Constituição reserva.</p>
<h3>4. PERDA DA NACIONALIDADE</h3><ul><li>Cancelamento da naturalização por sentença judicial (ex: fraude)</li><li>Aquisição de outra nacionalidade, salvo se por nascimento ou imposição</li></ul>
<h3>5. PEGADINHA VUNESP</h3><div class="box-peg">"Naturalizado pode ser Presidente." <b>ERRADO.</b> Só nato.<br>"Filho de estrangeiro a serviço do país, nascido no Brasil, é nato." <b>ERRADO.</b> É a exceção. Se o pai está a serviço do país dele, o filho NÃO é nato.<br>"Português tem os mesmos direitos que brasileiro nato." <b>ERRADO.</b> Tem quase todos, mas não os privativos de nato.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Nato = nasceu com nacionalidade. Naturalizado = pediu depois.<br>Cargos de Presidente, STF, etc = SÓ NATO.<br>Filho de estrangeiro a serviço = exceção, NÃO é nato.</div>
`},
{title:"Cap 7 - Direitos Políticos - Art 14",content:`
<h3>1. LEI SECA</h3><div class="box-legal"><b>Art. 14:</b> A soberania popular será exercida pelo sufrágio universal e pelo voto direto e secreto, com valor igual para todos, e, nos termos da lei, mediante: I - plebiscito; II - referendo; III - iniciativa popular.<br>Alistamento eleitoral e voto são: obrigatórios para maiores de 18 anos, facultativos para analfabetos, maiores de 70 anos e maiores de 16 e menores de 18 anos.</div>
<h3>2. EXPLICAÇÃO</h3><h4>Sufrágio universal e voto direto, secreto, igual, periódico</h4><ul><li><b>Universal:</b> todos podem votar, sem distinção de riqueza, sexo, raça.</li><li><b>Direto:</b> você vota direto no candidato, não em eleitor que vai votar por você.</li><li><b>Secreto:</b> ninguém pode saber em quem você votou.</li><li><b>Igual:</b> seu voto vale o mesmo que o do rico.</li><li><b>Periódico:</b> tem eleição de tempos em tempos.</li></ul><h4>Quem pode e quem deve votar?</h4><table><tr><th>Quem</th><th>Voto</th></tr><tr><td>18 a 70 anos, alfabetizado</td><td>OBRIGATÓRIO</td></tr><tr><td>16 a 18 anos</td><td>FACULTATIVO</td></tr><tr><td>+70 anos</td><td>FACULTATIVO</td></tr><tr><td>Analfabeto</td><td>FACULTATIVO</td></tr><tr><td>Estrangeiro</td><td>NÃO pode votar</td></tr><tr><td>Conscrito (serviço militar obrigatório)</td><td>NÃO pode votar (alistamento proibido)</td></tr></table>
<h4>Idade mínima para ser candidato - Decore!</h4><table><tr><th>Cargo</th><th>Idade</th></tr><tr><td>Vereador</td><td>18</td></tr><tr><td>Deputado Estadual/Federal, Prefeito</td><td>21</td></tr><tr><td>Governador, Senador</td><td>30</td></tr><tr><td>Presidente, Vice, Senador? Não, Presidente</td><td>35</td></tr></table><p><b>Macete:</b> 18-21-30-35. Vai subindo conforme o cargo é mais importante.</p>
<h4>Inelegibilidade e Perda</h4><ul><li><b>Inelegíveis:</b> inalistáveis (estrangeiro, conscrito) e analfabetos. Analfabeto pode VOTAR, mas NÃO pode ser CANDIDATO.</li><li><b>Perda/suspensão:</b> condenação criminal transitada em julgado, improbidade administrativa, etc.</li></ul>
<h3>3. PEGADINHA VUNESP</h3><div class="box-peg">"Analfabeto não pode votar." <b>ERRADO.</b> Pode, é facultativo.<br>"Analfabeto pode ser vereador." <b>ERRADO.</b> Pode votar, mas não pode ser candidato.<br>"Estrangeiro pode votar se morar há 10 anos." <b>ERRADO.</b> Estrangeiro nunca vota.<br>"Vereador precisa ter 21 anos." <b>ERRADO.</b> Vereador é 18.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Voto obrigatório 18-70. Facultativo 16-18, +70, analfabeto.<br>Idade: Vereador 18, Deputado 21, Governador 30, Presidente 35.<br>Analfabeto vota, mas não é candidato.</div>
`},
{title:"Cap 8 - Organização do Estado e Poderes",content:`
<h3>1. FEDERAÇÃO</h3><p>O Brasil é uma <b>Federação</b>. Isso significa que União, Estados, DF e Municípios são <b>autônomos</b> e <b>indissolúveis</b> - nenhum pode sair do Brasil. Não existe "São Paulo sair do Brasil". É proibido secessão.</p><p>Cada ente tem sua competência:</p><ul><li><b>União:</b> Art. 21 (exclusiva - ex: declarar guerra, emitir moeda) e Art. 22 (privativa - ex: direito civil, penal, processual). Pode delegar a privativa para Estado por lei complementar.</li><li><b>Estados:</b> Competência <b>remanescente / residual</b> - tudo que não for da União nem do Município é do Estado (Art. 25, §1º).</li><li><b>Municípios:</b> Assuntos de <b>interesse local</b> - ex: transporte urbano, coleta de lixo, horário de comércio.</li><li><b>DF:</b> Tem competência de Estado + Município juntos.</li></ul>
<h3>2. TRÊS PODERES - Art. 2º</h3><div class="box-legal">São Poderes da União, <b>independentes e harmônicos</b> entre si, o Legislativo, o Executivo e o Judiciário.</div><ul><li><b>Legislativo:</b> Faz leis. Congresso (Senado + Câmara), Assembleia Legislativa, Câmara de Vereadores.</li><li><b>Executivo:</b> Executa, administra. Presidente, Governador, Prefeito.</li><li><b>Judiciário:</b> Julga. STF, STJ, TJ, Juízes.</li></ul><p><b>Independentes:</b> nenhum manda no outro. <b>Harmônicos:</b> tem que trabalhar juntos, com freios e contrapesos (ex: Presidente veta lei, Congresso derruba veto, STF declara lei inconstitucional).</p>
<h3>3. STF x STJ x TJSP - Não confunda!</h3><table><tr><th>Tribunal</th><th>Função</th></tr><tr><td><b>STF - Supremo Tribunal Federal</b></td><td>Guarda da CONSTITUIÇÃO. Julga ADI, Recurso Extraordinário.</td></tr><tr><td><b>STJ - Superior Tribunal de Justiça</b></td><td>Uniformizar LEI FEDERAL. Julga Recurso Especial.</td></tr><tr><td><b>TJSP - Tribunal de Justiça de SP</b></td><td>Justiça ESTADUAL de São Paulo. Onde você vai trabalhar!</td></tr></table>
<h3>4. PEGADINHA VUNESP</h3><div class="box-peg">"Estado pode se separar do Brasil se a população quiser." <b>ERRADO.</b> Federação é indissolúvel.<br>"Município cuida de assunto de interesse nacional." <b>ERRADO.</b> Município = interesse local.<br>"STF julga lei federal." <b>ERRADO, em regra.</b> STF julga Constituição. STJ julga lei federal.<br>"Poderes são dependentes." <b>ERRADO.</b> Independentes e harmônicos.</div>
<div class="box-resumo"><b>📌 RESUMO:</b><br>Federação = indissolúvel, autonomia.<br>União = Art 21/22. Estado = residual. Município = local.<br>STF = Constituição. STJ = lei federal. TJSP = justiça estadual.</div>
`}
]}
];

const DB=[

let mode='livro';let activeTopic=LIVRO[0].id;let chapterIndex=0;let qIndex=0;let chosen=null;
function getList(){if(mode==='livro')return LIVRO;if(mode==='resumo')return RESUMO;return DB}
function getKey(){if(mode==='livro')return 'livro_';if(mode==='resumo')return 'resumo_';return ''}
function setMode(m){mode=m;['livro','resumo','simular'].forEach(k=>{let b=document.getElementById('tab-'+k);if(b){let on=(k===m);b.style.background=on?'#7f1d1d':'#fff';b.style.color=on?'#fff':'#000'}});let list=getList();activeTopic=list[0].id;chapterIndex=0;qIndex=0;render()}
function renderSidebar(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let list=getList();let html='';let title=mode==='livro'?'📖 Livro Completo':mode==='resumo'?'⚡ Resuminho de Revisão':'📝 Simulado';html+=`<div class="card"><b>${title}</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:0%"></div></div><small id="ptext"></small></div>`;list.forEach(t=>{let key=getKey()+t.id;let done=(hist[key]?.done||0);let total=mode==='simular'?t.questions.length:t.chapters.length;let pct=total?Math.round(done/total*100):0;let label=mode==='simular'?`${done}/${total} • ${pct}%`:`${done}/${total} caps • ${pct}%`;html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${label}</small></div><span class="badge">${pct}%</span></div>`});document.getElementById("sidebar").innerHTML=html;updateProgress()}
function updateProgress(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let list=getList();let pct=0,txt="";if(mode==='simular'){let tot=list.reduce((s,t)=>s+t.questions.length,0);let done=list.reduce((s,t)=>s+(hist[t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" • "+pct+"%"}else{let key=getKey();let tot=list.reduce((s,t)=>s+t.chapters.length,0);let done=list.reduce((s,t)=>s+(hist[key+t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" págs • "+pct+"%"}let b=document.getElementById("pbar");if(b)b.style.width=pct+"%";let pt=document.getElementById("ptext");if(pt)pt.innerText=txt}
function selectTopic(id){activeTopic=id;chapterIndex=0;qIndex=0;chosen=null;if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open');render()}
function render(){renderSidebar();let list=getList();let t=list.find(x=>x.id===activeTopic);if(mode==='simular'){let total=t.questions.length;let qq=t.questions[qIndex];if(!qq){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><p>Você fez ${total} questões.</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="qIndex=0;render()">Refazer</button> <button class="btn" onclick="setMode('resumo')">Ver Resuminho →</button></div></div>`;return}let html=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${t.icon} ${t.name}</b><span class="badge">${qIndex+1}/${total}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((qIndex/total)*100)}%"></div></div><p class="q">${qIndex+1}. ${qq.q}</p><div id="opts">${qq.o.map((op,i)=>`<div class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${op}</div>`).join("")}</div><div id="feedback" class="hidden"></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="confirmQ()">Corrigir (Enter)</button><button class="btn" onclick="nextQ()">Pular</button></div></div>`;document.getElementById("app").innerHTML=html;return}
let chap=t.chapters[chapterIndex];if(!chap){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><p>Você terminou ${mode==='livro'?'o Livro Completo':'o Resuminho'} de ${t.name}.</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="chapterIndex=0;render()">Recomeçar</button> ${mode==='livro'?'<button class="btn" onclick="setMode(\'resumo\')">Ir pro Resuminho →</button>':'<button class="btn" onclick="setMode(\'simular\')">Ir pro Simulado →</button>'}</div></div>`;return}
let nextLabel=mode==='livro'?'✅ Li e entendi + Próxima →':'✅ Revisei + Próxima →';let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${t.icon} ${t.name} - ${chap.title}</b><span class="badge">${chapterIndex+1}/${t.chapters.length}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((chapterIndex/t.chapters.length)*100)}%"></div></div><div class="book-page">${chap.content}</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="markRead()">${nextLabel} (Enter)</button><button class="btn" onclick="nextChapter()">Pular →</button></div></div>`;document.getElementById("app").innerHTML=html}
function markRead(){let users=getUsers();let cur=getCurrent();if(!users[cur])return;let key=getKey()+activeTopic;if(!users[cur].history[key])users[cur].history[key]={done:0};let h=users[cur].history[key];if(chapterIndex>=(h.done||0))h.done=Math.max(h.done||0,chapterIndex+1);saveUsers(users);nextChapter()}
function nextChapter(){let t=getList().find(x=>x.id===activeTopic);if(!t)return;chapterIndex++;if(chapterIndex>=t.chapters.length)chapterIndex=t.chapters.length;render()}
function choose(i){chosen=i;document.querySelectorAll(".opt").forEach((el,idx)=>{el.style.borderWidth=idx===i?"3px":"1.5px";el.style.fontWeight=idx===i?"700":"400"})}
function confirmQ(){if(chosen===null)return alert("Escolha 1-4");let t=DB.find(x=>x.id===activeTopic);let qq=t.questions[qIndex];document.querySelectorAll(".opt").forEach((el,idx)=>{if(idx===qq.a)el.classList.add("correct");else if(idx===chosen&&chosen!==qq.a)el.classList.add("wrong")});let acerto=chosen===qq.a;let fb=document.getElementById("feedback");fb.classList.remove("hidden");fb.innerHTML=`<div class="explain"><div style="font-weight:800;color:${acerto?'#16a34a':'#dc2626'}">${acerto?'✅ ACERTOU!':'❌ ERROU'}</div><div style="margin-top:8px"><b>Correta: ${String.fromCharCode(65+qq.a)}. ${qq.o[qq.a]}</b></div><div style="margin-top:8px"><b>Por que CERTA está certa:</b><br><small>${qq.ec}</small></div><div style="margin-top:8px"><b>Por que ERRADAS estão erradas:</b><br><small>${qq.ei}</small></div><div style="margin-top:8px;background:#fff;border:1px dashed #000;border-radius:8px;padding:8px"><b>📚 Explicação Completa:</b><br><small>${qq.e}</small></div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary" onclick="nextQ()">Próxima →</button> <button class="btn" onclick="setMode('livro')">Ver livro 📖</button></div></div>`;let users=getUsers();let cur=getCurrent();if(!users[cur].history[activeTopic])users[cur].history[activeTopic]={done:0,hits:0};let h=users[cur].history[activeTopic];if(qIndex>=(h.done||0))h.done=Math.max(h.done||0,qIndex+1);if(acerto)h.hits=(h.hits||0)+1;saveUsers(users);updateProgress()}
function nextQ(){let t=DB.find(x=>x.id===activeTopic);qIndex++;chosen=null;if(qIndex>=t.questions.length)qIndex=t.questions.length;render()}
function checkAuth(){let cur=getCurrent();let loginDiv=document.getElementById("login-overlay");if(!cur){if(!loginDiv){let div=document.createElement("div");div.id="login-overlay";div.innerHTML=`<div style="position:fixed;inset:0;background:linear-gradient(135deg,#7f1d1d,#991b1b);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px"><div class="card" style="width:100%;max-width:420px;background:#fff"><h2 style="margin-top:0;color:#000">Login TJSP</h2><input id="name" placeholder="Seu nome" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><input id="pass" type="password" placeholder="Senha: SaygonEscrivao2026" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><button class="btn btn-primary" style="width:100%;padding:12px;margin-top:8px" onclick="doLogin()">Entrar</button><p style="margin-top:12px"><a href="#" onclick="openReset();return false" style="color:#000">Esqueci senha / Reset com chave</a></p><small style="color:#000">Senha padrão: SaygonEscrivao2026<br>Chave: TJSP2026RESET</small></div></div>`;document.body.appendChild(div);setTimeout(()=>{document.getElementById("name")?.focus()},100)}return false}else{if(loginDiv)loginDiv.remove();return true}}
function doLogin(){let n=document.getElementById("name")?.value.trim();let p=document.getElementById("pass")?.value;if(!n){alert("Digite seu nome");return}let u=getUsers();if(!u[n]){u[n]={pass:p||DEFAULT_PASS,history:{}};saveUsers(u);setCurrent(n);location.reload();return}if(u[n].pass===p){setCurrent(n);location.reload()}else{alert("Senha incorreta.")}}
function logout(){localStorage.removeItem("tjsp_current");location.reload()}
function openReset(){let cur=getCurrent();let nome=cur||prompt("Nome do usuário:");if(!nome)return;let chave=prompt("Chave mestra:");if(chave!==MASTER_KEY)return alert("Chave incorreta");let nova=prompt("Nova senha:");if(!nova)return;let u=getUsers();if(!u[nome])u[nome]={pass:nova,history:{}};else u[nome].pass=nova;saveUsers(u);setCurrent(nome);alert("Senha trocada! ✅");location.reload()}
function exportBackup(){let u=getUsers();let cur=getCurrent();if(!cur)return alert("Faça login");let data=JSON.stringify(u[cur]||{},null,2);let blob=new Blob([data],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download=`backup-${cur}-tjsp.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener("keydown",e=>{if(!checkAuth())return;if(e.key>="1"&&e.key<="4"&&mode==='simular'){let fb=document.getElementById("feedback");if(!fb||fb.classList.contains("hidden"))choose(parseInt(e.key)-1)}if(e.key==="Enter"){if(mode!=='simular'){markRead()}else{let fb=document.getElementById("feedback");if(fb&&!fb.classList.contains("hidden"))nextQ();else confirmQ()}}});
if(checkAuth()){render()}
</script>

{title:"1 - Análise, compreensão e interpretação de textos",content:`
<h3>1. O QUE O EDITAL PEDE, EXATAMENTE</h3>
<div class="box-legal"><b>Edital TJSP - BLOCO I - Item 1:</b> Análise, compreensão e interpretação de diversos tipos de textos verbais, não verbais, literários e não literários.</div>
<p>Parece uma frase só, mas dentro dela tem 4 matérias diferentes. Vamos destrinchar cada palavra, porque a VUNESP cobra cada uma separadamente.</p>
<p><b>Análise</b> = desmontar o texto em partes. Ver como ele é feito.<br><b>Compreensão</b> = entender o que está escrito, literalmente.<br><b>Interpretação</b> = entender o que o autor QUIS dizer, mesmo sem escrever.</p>
<p>Exemplo: Se o texto diz "O fórum estava lotado", compreensão é: tinha muita gente no fórum. Interpretação é: o autor quis dizer que o serviço está demorado, que falta servidor, que a população está buscando a justiça.</p>
<h3>2. TEXTO VERBAL, NÃO VERBAL E MISTO</h3>
<h4>2.1 Texto Verbal</h4>
<p>É o texto que usa <b>PALAVRAS</b>. Escritas ou faladas. É o que você mais vê na prova.</p>
<ul><li>1. Notícia de jornal</li><li>2. E-mail do chefe</li><li>3. Lei, edital, contrato</li><li>4. Bilhete, carta</li><li>5. Conversa no WhatsApp</li><li>6. Poema, romance</li><li>7. Bula de remédio</li><li>8. Manual de instrução</li></ul>
<p>Se tem palavra, é verbal.</p>
<h4>2.2 Texto Não Verbal</h4>
<p>É o texto que usa <b>IMAGEM, sem nenhuma palavra</b>. Ele comunica sem escrever.</p>
<ul><li>9. Placa de trânsito de "Proibido estacionar" só com desenho</li><li>10. Placa de "Silêncio" com dedo na boca</li><li>11. Gráfico de pizza, sem legenda escrita</li><li>12. Foto de uma manifestação, sem texto</li><li>13. Semáforo - vermelho, amarelo, verde, sem palavra</li><li>14. Símbolo de acessibilidade - cadeira de rodas desenhada</li></ul>
<p>Se só tem imagem, é não verbal.</p>
<h4>2.3 Texto Misto / Multimodal</h4>
<p>É o que mais cai na VUNESP hoje. É o texto que usa <b>PALAVRA + IMAGEM juntas</b>. Um completa o outro. Se tirar a imagem, você não entende. Se tirar a palavra, também não.</p>
<ul><li>15. Charge com desenho + balão de fala</li><li>16. Tirinha - desenho + fala dos personagens</li><li>17. Infográfico - gráfico + texto explicando</li><li>18. Propaganda - foto do produto + frase de efeito</li><li>19. Meme - foto + frase engraçada em cima</li><li>20. História em quadrinhos</li></ul>
<div class="box-peg"><b>Pegadinha que cai toda prova:</b> A VUNESP mostra uma charge com desenho e fala e pergunta: "Esse texto é verbal ou não verbal?" Muita gente marca "não verbal" porque tem desenho. <b>ERRADO.</b> Se tem desenho + palavra, é <b>misto</b>. Só é não verbal se NÃO tiver nenhuma palavra.</div>
<h3>3. TEXTO LITERÁRIO E NÃO LITERÁRIO</h3>
<h4>3.1 Texto Literário</h4>
<p>É o texto que tem preocupação com a <b>BELEZA, com a EMOÇÃO, com o COMO ele fala</b>, não só com O QUE ele fala. Ele usa sentido figurado, metáfora, ritmo, sonoridade.</p>
<ul><li>Usa metáfora, comparação, ironia</li><li>Pode inventar, criar mundo fictício</li><li>Quer emocionar, fazer pensar, não só informar</li><li>A linguagem é mais trabalhada, mais bonita</li></ul>
<p>Exemplos de literário:</p>
<ul><li>1. Poema - "No meio do caminho tinha uma pedra"</li><li>2. Romance - "Dom Casmurro", "Capitães da Areia"</li><li>3. Conto - história curta inventada</li><li>4. Crônica - texto curto sobre o dia a dia, com humor e reflexão</li><li>5. Fábula - "A cigarra e a formiga", com moral no final</li></ul>
<h4>3.2 Texto Não Literário</h4>
<p>É o texto que quer <b>INFORMAR direto, sem enfeite</b>. Ele quer que você entenda rápido, sem duvidar.</p>
<ul><li>Linguagem direta, clara, objetiva</li><li>Não usa metáfora, usa sentido próprio</li><li>Quer informar, instruir, ordenar</li><li>Não quer emocionar, quer resolver</li></ul>
<p>Exemplos de não literário:</p>
<ul><li>6. Notícia de jornal - "Tribunal abre concurso para escrevente"</li><li>7. Edital - "As inscrições vão de 10 a 20 de maio"</li><li>8. Bula de remédio - "Tomar 1 comprimido a cada 8 horas"</li><li>9. Manual - "Aperte o botão verde para ligar"</li><li>10. Lei - "Art. 5º Todos são iguais perante a lei"</li></ul>
<h4>3.3 O mesmo assunto, nos dois tipos - Compare</h4>
<p>Assunto: Chuva.</p>
<p><b>Versão não literária:</b> "Hoje choveu 50mm em São Paulo. A Defesa Civil emitiu alerta. Evite áreas de alagamento."</p>
<p><b>Versão literária:</b> "O céu desabou sobre São Paulo, como se chorasse todas as mágoas do ano. As ruas viraram rios, e os carros, barquinhos perdidos."</p>
<p>É o mesmo assunto, mas o jeito de falar muda tudo. Na prova, a VUNESP te dá um texto e pergunta: "O texto é literário ou não literário? Justifique." Você tem que olhar para o COMO ele fala, não para o assunto.</p>
<h3>4. COMO LER UM TEXTO NA PROVA - O método que funciona</h3>
<p><b>Passo 1 - Leia o enunciado ANTES do texto (30 segundos)</b><br>Antes de ler o texto, leia a pergunta. A pergunta te diz o que procurar.</p>
<p><b>Passo 2 - Leia o texto 1ª vez para entender o geral (2 minutos)</b><br>Leia sem parar, sem sublinhar, só para entender: "Do que esse texto está falando?" No final, você tem que conseguir resumir o texto em 1 frase.</p>
<p><b>Passo 3 - Leia o texto 2ª vez procurando detalhes (2 minutos)</b><br>Agora sim, sublinhe mentalmente: palavras que se repetem, palavras de ligação - mas, porque, portanto, embora - adjetivos que mostram opinião, números, datas, nomes.</p>
<p><b>Passo 4 - Volte para as alternativas e elimine (1 minuto)</b><br>Não procure a alternativa certa de primeira. Elimine as absurdas. Alternativa que fala de algo que NÃO está no texto: elimine. Alternativa com palavra absoluta: "sempre", "nunca", "todos", "nenhum" - desconfie, quase sempre está errada.</p>
<h3>5. OS 10 ERROS QUE TODO MUNDO COMETE</h3>
<ul><li>Erro 1: Achar que texto com imagem é sempre não verbal. Se tem imagem + palavra, é misto.</li><li>Erro 2: Achar que texto literário só existe em poema. Conto, crônica, romance também são literários.</li><li>Erro 3: Achar que notícia é literária porque é bem escrita. Notícia é não literária, porque quer informar.</li><li>Erro 4: Ler o texto antes de ler a pergunta. Você perde tempo.</li><li>Erro 5: Marcar alternativa que parece lógica, mas não está no texto. Se não tem prova no texto, está errada.</li><li>Erro 6: Confundir compreensão com interpretação. Compreensão é o que está escrito. Interpretação é o que o autor quis dizer.</li><li>Erro 7: Achar que charge é só desenho. Charge tem desenho + fala, é mista.</li><li>Erro 8: Achar que gráfico é sempre não verbal. Se o gráfico tem título, legenda, números escritos, ele é misto.</li><li>Erro 9: Achar que autor neutro não tem ponto de vista. Todo autor tem ponto de vista, até em notícia.</li><li>Erro 10: Marcar alternativa com "sempre" ou "nunca" sem conferir. O texto raramente é absoluto.</li></ul>
<h3>6. 10 PEGADINHAS VUNESP</h3>
<div class="box-peg">1. "Todo texto com imagem é não verbal." <b>ERRADO.</b> Se tem imagem + palavra, é misto.<br>2. "Texto literário só existe em poema." <b>ERRADO.</b> Conto, crônica, romance também são.<br>3. "Notícia é texto literário." <b>ERRADO.</b> Notícia é não literária, quer informar.<br>4. "Charge é texto não verbal." <b>ERRADO.</b> Charge tem desenho + fala, é mista.<br>5. "Gráfico com título e legenda é não verbal." <b>ERRADO.</b> Tem palavra, é misto.<br>6. "Texto não literário não pode ter metáfora." <b>CERTO, em regra.</b> Não literário usa sentido próprio.<br>7. "Crônica é texto literário." <b>CERTO.</b> Crônica usa humor, reflexão, sentido figurado.<br>8. "Edital é texto não literário." <b>CERTO.</b> Edital quer informar, direto.<br>9. "Meme é texto verbal." <b>ERRADO.</b> Meme tem foto + frase, é misto.<br>10. "Placa de trânsito sem palavra é texto verbal." <b>ERRADO.</b> Sem palavra, é não verbal.</div>
<h3>7. 10 QUESTÕES DE FIXAÇÃO</h3>
<p>1. Um texto que usa apenas uma foto de uma manifestação, sem nenhuma legenda, é: a) Verbal b) Não verbal c) Misto d) Literário<br>2. Uma tirinha com desenho e balão de fala é: a) Verbal b) Não verbal c) Mista d) Não literária<br>3. Um poema que usa metáfora para falar de amor é: a) Não literário b) Literário c) Não verbal d) Misto<br>4. Um edital de concurso que informa data da prova é: a) Literário b) Não literário c) Não verbal d) Misto<br>5. Uma charge com desenho de político e fala "Vou resolver tudo!" é: a) Não verbal b) Verbal c) Mista d) Sem texto<br>6. Uma bula de remédio que diz "Tomar 1 comprimido a cada 8h" é: a) Literária b) Não literária c) Não verbal d) Poética<br>7. Um infográfico com gráfico + texto explicando é: a) Não verbal b) Verbal c) Misto d) Literário<br>8. Um romance inventado sobre um juiz é: a) Não literário b) Literário c) Não verbal d) Misto<br>9. Uma placa "Proibido estacionar" só com desenho de carro e traço vermelho é: a) Verbal b) Não verbal c) Mista d) Literária<br>10. Qual é o primeiro passo para ler um texto na prova? a) Ler o texto inteiro b) Ler o enunciado antes do texto c) Sublinhar tudo d) Chutar a alternativa</p>
<p><b>Gabarito:</b> 1-B / 2-C / 3-B / 4-B / 5-C / 6-B / 7-C / 8-B / 9-B / 10-B</p>
<div class="box-resumo"><b>📌 RESUMO FINAL:</b><br>Verbal = palavra. Não verbal = só imagem. Misto = palavra + imagem.<br>Literário = beleza, figurado, emocionar. Não literário = informar direto.<br>MÉTODO: 1. Leia o enunciado antes 2. Leia o texto 1ª vez para o geral 3. Leia 2ª vez para detalhes 4. Elimine as absurdas, procure prova no texto.</div>

{title:"2 - Informações literais e inferências possíveis",content:`
<h3>1. O QUE O EDITAL PEDE, EXATAMENTE</h3>
<div class="box-legal"><b>Edital TJSP - BLOCO I - Item 2:</b> Informações literais e inferências possíveis.</div>
<p>Esse é o item que mais derruba candidato na VUNESP. Não porque é difícil, mas porque a maioria confunde o que está escrito com o que ela ACHOU que está escrito. A banca ganha dinheiro com isso. Vamos acabar com essa confusão agora, para sempre.</p>
<p>Existem 3 níveis de leitura. Você precisa saber qual nível a pergunta está pedindo:</p>
<ul><li><b>Nível 1 - Literal:</b> Está escrito, com todas as letras. É só copiar.</li><li><b>Nível 2 - Inferência:</b> Não está escrito, mas dá para concluir com lógica, usando o que está escrito como prova.</li><li><b>Nível 3 - Invenção:</b> Não está escrito e NÃO dá para concluir. Você inventou. É o que a VUNESP quer que você marque para errar.</li></ul>
<p>A diferença entre inferência e invenção é uma só: <b>prova no texto</b>. Se você consegue apontar a frase do texto que prova sua conclusão, é inferência. Se não consegue, é invenção.</p>

<h3>2. INFORMAÇÃO LITERAL - Está escrito, é só achar</h3>
<p>Informação literal é aquela que você encontra no texto sem precisar pensar muito. Ela está lá, explícita. Você só precisa ler com atenção.</p>
<h4>Como a VUNESP pergunta quando quer literal</h4>
<ul><li>"Segundo o texto..."</li><li>"De acordo com o texto..."</li><li>"Conforme o texto..."</li><li>"O texto afirma que..."</li><li>"De acordo com o autor..."</li></ul>
<p>Quando você ver essas expressões, a resposta tem que estar ESCRITA no texto. Não invente. Não complete. Não deduza. É copiar com outras palavras.</p>
<h4>20 exemplos de literal - Um por um</h4>
<p>Vamos usar sempre o mesmo texto-base para você comparar literal x inferência:</p>
<div class="box-legal"><b>TEXTO-BASE:</b> "Maria chegou ao fórum às 8h da manhã, ofegante, com a camisa suada e uma pasta pesada nas mãos. Ela olhou para o relógio pela terceira vez e suspirou: - Já são 8h, vou me atrasar para a audiência."</div>
<p><b>Exemplos literais - tudo isso ESTÁ escrito:</b></p>
<ul><li>1. Maria chegou ao fórum.</li><li>2. Maria chegou às 8h da manhã.</li><li>3. Maria estava ofegante.</li><li>4. Maria estava com a camisa suada.</li><li>5. Maria carregava uma pasta pesada.</li><li>6. Maria olhou para o relógio pela terceira vez.</li><li>7. Maria suspirou.</li><li>8. Maria disse: "Já são 8h".</li><li>9. Maria ia para uma audiência.</li><li>10. Maria achava que ia se atrasar.</li></ul>
<p>Perceba: tudo isso você consegue apontar no texto. Não precisou inventar nada.</p>
<h4>Como não errar a literal</h4>
<p>A VUNESP troca uma palavrinha para te enganar. Exemplo: O texto diz "Maria chegou às 8h". A alternativa diz "Maria chegou às 9h". Parece igual, mas está errado. Você tem que ler número, data, nome com atenção redobrada. A banca troca:</p>
<ul><li>8h por 9h</li><li>terceira vez por segunda vez</li><li>fórum por tribunal</li><li>pasta pesada por pasta leve</li></ul>
<p>Leia número por número. Não leia por cima.</p>

<h3>3. INFERÊNCIA - Não está escrito, mas dá para concluir com prova</h3>
<p>Inferência é uma conclusão lógica. Você usa o que está escrito como pista para chegar em algo que não está escrito, mas que é óbvio.</p>
<h4>Como a VUNESP pergunta quando quer inferência</h4>
<ul><li>"Infere-se do texto que..."</li><li>"Depreende-se do texto que..."</li><li>"Pode-se concluir do texto que..."</li><li>"Deduz-se do texto que..."</li><li>"O autor sugere que..."</li><li>"É possível inferir que..."</li></ul>
<p>Quando você ver essas expressões, a resposta NÃO vai estar escrita com as mesmas palavras. Você vai ter que concluir.</p>
<h4>20 exemplos de inferência - Usando o mesmo texto-base</h4>
<p>Usando o mesmo texto da Maria:</p>
<ul><li>11. Maria veio correndo / apressada. <b>Prova:</b> chegou ofegante, com camisa suada.</li><li>12. Maria estava com pressa / ansiosa. <b>Prova:</b> olhou para o relógio 3 vezes e suspirou.</li><li>13. Maria andou muito ou correu. <b>Prova:</b> ofegante + suada.</li><li>14. Maria estava preocupada em se atrasar. <b>Prova:</b> "vou me atrasar".</li><li>15. Maria provavelmente saiu de casa atrasada. <b>Prova:</b> chegou ofegante, com pressa.</li><li>16. Maria trabalha no fórum ou tem compromisso lá. <b>Prova:</b> ela foi ao fórum para audiência, com pasta.</li><li>17. Maria carrega documentos importantes. <b>Prova:</b> pasta pesada para audiência.</li><li>18. Maria não estava tranquila. <b>Prova:</b> suspirou, olhou relógio 3 vezes.</li><li>19. Era de manhã. <b>Prova:</b> "8h da manhã".</li><li>20. Maria tinha um compromisso importante às 8h. <b>Prova:</b> audiência marcada.</li></ul>
<p>Perceba: nenhuma dessas 10 frases está escrita com essas palavras no texto. Mas todas têm PROVA no texto. Você consegue apontar a frase que prova cada uma.</p>

<h3>4. INVENÇÃO - O que a VUNESP quer que você marque</h3>
<p>Invenção é quando você conclui algo que não tem prova no texto. Parece lógico, mas você inventou.</p>
<p>Usando o mesmo texto da Maria, veja as invenções que a VUNESP colocaria como alternativa errada:</p>
<ul><li>Maria mora longe do fórum. <b>Por que é invenção?</b> O texto não fala onde ela mora. Ela pode morar perto e ter corrido por outro motivo.</li><li>Maria foi de ônibus. <b>Por que é invenção?</b> O texto não fala como ela foi.</li><li>Maria é escrevente. <b>Por que é invenção?</b> O texto não fala a profissão dela. Ela pode ser advogada, juíza, parte do processo.</li><li>Maria ia para uma festa depois. <b>Por que é invenção?</b> O texto fala de audiência, não de festa.</li><li>Maria estava com fome. <b>Por que é invenção?</b> Nada no texto fala de fome.</li><li>Maria brigou com o chefe. <b>Por que é invenção?</b> Nada fala de briga.</li></ul>
<p><b>Regra de ouro que salva sua prova:</b> Se você não consegue apontar a frase do texto que prova a alternativa, a alternativa está errada. Não importa se parece lógica. Se não tem prova, está errada.</p>

<h3>5. COMPARAÇÃO LADO A LADO - Para nunca mais confundir</h3>
<table><tr><th>Pergunta</th><th>Tipo</th><th>Onde está a resposta?</th><th>Exemplo</th></tr>
<tr><td>"Segundo o texto..."</td><td>Literal</td><td>Escrita no texto</td><td>"Maria chegou às 8h"</td></tr>
<tr><td>"Infere-se..."</td><td>Inferência</td><td>Conclusão com prova</td><td>"Maria veio correndo"</td></tr>
<tr><td>"O texto sugere..."</td><td>Inferência</td><td>Conclusão com prova</td><td>"Maria estava ansiosa"</td></tr>
<tr><td>"Pode-se concluir..."</td><td>Inferência</td><td>Conclusão com prova</td><td>"Maria tinha compromisso importante"</td></tr>
<tr><td>Alternativa sem prova</td><td>Invenção</td><td>Não está no texto</td><td>"Maria foi de ônibus"</td></tr></table>

<h3>6. COMO A VUNESP MONTA A QUESTÃO - O truque da banca</h3>
<p>A VUNESP sempre monta a questão assim, em 90% das vezes:</p>
<ul><li><b>Alternativa A:</b> Literal, mas com uma palavrinha trocada. Parece certa, mas está errada por um detalhe. Ex: "Maria chegou às 9h" (o texto diz 8h).</li><li><b>Alternativa B:</b> Invenção. Parece lógica, mas não tem prova. Ex: "Maria mora longe".</li><li><b>Alternativa C:</b> Contrária ao texto. Ex: "Maria estava tranquila". (O texto diz que ela estava ofegante, ansiosa).</li><li><b>Alternativa D:</b> A correta. Tem prova no texto, seja literal ou inferência.</li></ul>
<p>Se você souber disso, você já entra na questão procurando o erro, não procurando o acerto. Elimine A, B e C, e a D vai sobrar.</p>

<h3>7. OUTROS TEXTOS PARA TREINAR - 10 textos curtos</h3>
<p><b>Texto 1:</b> "João olhou para a geladeira vazia e suspirou."<br>Literal: João olhou para a geladeira. A geladeira estava vazia. João suspirou.<br>Inferência correta: João estava com fome / sem comida / chateado.<br>Invenção: João ia ao mercado. (O texto não fala isso, ele pode pedir delivery, pode ficar sem comer).</p>
<p><b>Texto 2:</b> "O juiz bateu o martelo e disse: - Audiência encerrada."<br>Literal: O juiz bateu o martelo. O juiz disse que a audiência encerrou.<br>Inferência: A audiência acabou. O juiz tem autoridade.<br>Invenção: O juiz estava bravo. (O texto não fala de emoção).</p>
<p><b>Texto 3:</b> "Ela estudou a noite inteira, com café e caderno."<br>Literal: Ela estudou a noite inteira. Ela tomou café. Ela usou caderno.<br>Inferência: Ela estava se preparando para uma prova / estava cansada / estava determinada.<br>Invenção: Ela passou na prova. (O texto não fala o resultado).</p>
<p><b>Texto 4:</b> "O fórum estava lotado na segunda-feira."<br>Literal: O fórum estava lotado. Era segunda-feira.<br>Inferência: Muita gente procurou a justiça na segunda. O atendimento estava demorado.<br>Invenção: O fórum é pequeno. (O texto não fala o tamanho).</p>
<p><b>Texto 5:</b> "Pedro vendeu o carro e comprou uma bicicleta."<br>Literal: Pedro vendeu o carro. Pedro comprou uma bicicleta.<br>Inferência: Pedro quer economizar / quer se exercitar / quer poluir menos.<br>Invenção: Pedro está falido. (Vender o carro não significa falir).</p>

<h3>8. OS 10 ERROS QUE TODO MUNDO COMETE</h3>
<ul><li>Erro 1: Marcar inferência quando a pergunta pede literal. Se pede "segundo o texto", tem que estar escrito.</li><li>Erro 2: Marcar literal quando a pergunta pede inferência. Se pede "infere-se", a resposta não vai estar escrita igual.</li><li>Erro 3: Achar que tudo que parece lógico é inferência. Se não tem prova, é invenção.</li><li>Erro 4: Não ler número e data com atenção. A banca troca 8h por 9h.</li><li>Erro 5: Marcar alternativa contrária ao texto porque leu rápido. Ex: texto diz que Maria estava ansiosa, você marca que estava tranquila.</li><li>Erro 6: Completar o texto com sua vida. "Ah, na minha vida, quem chega suado veio de ônibus." Não importa sua vida, importa o texto.</li><li>Erro 7: Achar que "infere-se" significa "achismo". Inferência tem prova, achismo não.</li><li>Erro 8: Ignorar a palavra que a pergunta usa. "Segundo o texto" e "Infere-se" são comandos diferentes.</li><li>Erro 9: Marcar alternativa com "sempre" ou "nunca" sem conferir. O texto raramente é absoluto.</li><li>Erro 10: Não voltar no texto para conferir. Você tem que voltar. Sempre.</li></ul>

<h3>9. 10 PEGADINHAS VUNESP</h3>
<div class="box-peg">1. "Segundo o texto, Maria veio de ônibus." <b>ERRADO.</b> O texto não fala como ela foi. É invenção.<br>2. "Infere-se que Maria estava ansiosa." <b>CERTO.</b> Tem prova: olhou relógio 3 vezes, suspirou.<br>3. "Segundo o texto, Maria chegou às 9h." <b>ERRADO.</b> O texto diz 8h. A banca trocou o número.<br>4. "Pode-se concluir que Maria tinha um compromisso importante." <b>CERTO.</b> Tem prova: audiência.<br>5. "Maria é escrevente." <b>ERRADO.</b> O texto não fala a profissão. Invenção.<br>6. "Depreende-se que Maria veio correndo." <b>CERTO.</b> Tem prova: ofegante, suada.<br>7. "O texto afirma que Maria mora longe." <b>ERRADO.</b> O texto não afirma isso.<br>8. "Infere-se que Maria estava tranquila." <b>ERRADO.</b> É o contrário do texto. Ela estava ansiosa.<br>9. "Segundo o texto, Maria carregava uma pasta pesada." <b>CERTO.</b> Está escrito.<br>10. "Maria ia para uma festa." <b>ERRADO.</b> O texto fala de audiência, não de festa.</div>

<h3>10. 10 QUESTÕES DE FIXAÇÃO</h3>

7. Segundo o texto, Maria disse: a) "Já são 9h" b) "Já são 8h" c) "Estou tranquila" d) Nada<br>

function doLogin(){let n=document.getElementById("name")?.value.trim();let p=document.getElementById("pass")?.value;if(!n){alert("Digite seu nome");return}let u=getUsers();if(!u[n]){u[n]={pass:p||DEFAULT_PASS,history:{}};saveUsers(u);setCurrent(n);location.reload();return}if(u[n].pass===p){setCurrent(n);location.reload()}else{alert("Senha incorreta.")}}
function logout(){localStorage.removeItem("tjsp_current");location.reload()}
function openReset(){let cur=getCurrent();let nome=cur||prompt("Nome do usuário:");if(!nome)return;let chave=prompt("Chave mestra:");if(chave!==MASTER_KEY)return alert("Chave incorreta");let nova=prompt("Nova senha:");if(!nova)return;let u=getUsers();if(!u[nome])u[nome]={pass:nova,history:{}};else u[nome].pass=nova;saveUsers(u);setCurrent(nome);alert("Senha trocada! ✅");location.reload()}
function exportBackup(){let u=getUsers();let cur=getCurrent();if(!cur)return alert("Faça login");let data=JSON.stringify(u[cur]||{},null,2);let blob=new Blob([data],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download=`backup-${cur}-tjsp.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener("keydown",e=>{if(!checkAuth())return;if(e.key>="1"&&e.key<="4"&&mode==='simular'){let fb=document.getElementById("feedback");if(!fb||fb.classList.contains("hidden"))choose(parseInt(e.key)-1)}if(e.key==="Enter"){if(mode!=='simular'){markRead()}else{let fb=document.getElementById("feedback");if(fb&&!fb.classList.contains("hidden"))nextQ();else confirmQ()}}});
if(checkAuth()){render()}
</script>
</body>
</html>

{id:"portugues",name:"BLOCO I - Língua Portuguesa",icon:"📚",chapters:[
{title:"1 - Análise, compreensão e interpretação de textos - COMPLETO",content:`
<h3>1. O QUE O EDITAL PEDE, EXATAMENTE - Palavra por palavra</h3>
<div class="box-legal"><b>Edital TJSP - BLOCO I - Item 1:</b> Análise, compreensão e interpretação de diversos tipos de textos verbais, não verbais, literários e não literários.</div>
<p>Parece uma frase só, mas dentro dela tem 4 matérias diferentes. Vamos destrinchar cada palavra, porque a VUNESP cobra cada uma separadamente e você não pode confundir.</p>
<p><b>Análise</b> = desmontar o texto em partes. Ver como ele é feito. Quais palavras ele usa, como ele organiza as ideias, qual é a estrutura. É como desmontar um motor para ver as peças.</p>
<p><b>Compreensão</b> = entender o que está escrito, literalmente. O que o texto diz, com todas as letras. Sem inventar, sem deduzir.</p>
<p><b>Interpretação</b> = entender o que o autor QUIS dizer, mesmo sem escrever diretamente. É ler nas entrelinhas. É entender a intenção, a crítica, o elogio escondido.</p>
<p>Exemplo completo: Se o texto diz "O fórum estava lotado, com fila na porta e servidores correndo".<br><b>Compreensão:</b> Tinha muita gente no fórum, tinha fila, servidores estavam correndo.<br><b>Interpretação:</b> O autor quis dizer que o serviço está demorado, que falta servidor, que a população está buscando a justiça e não está sendo atendida rápido. Ele quis mostrar um problema.</p>
<p>Percebe a diferença? Compreensão é o que está na superfície. Interpretação é o que está por baixo.</p>

<h3>2. TEXTO VERBAL, NÃO VERBAL E MISTO - Explicação linha por linha</h3>
<h4>2.1 Texto Verbal - Usa palavras</h4>
<p>É o texto que usa <b>PALAVRAS</b>. Escritas ou faladas. É o que você mais vê na prova, porque a prova é escrita.</p>
<p>Exemplos de texto verbal, um por um, para você nunca mais confundir:</p>
<ul><li>1. <b>Notícia de jornal:</b> "Tribunal abre concurso para escrevente com 100 vagas." - Só palavras, é verbal.</li><li>2. <b>E-mail do chefe:</b> "Por favor, envie o processo até amanhã." - Só palavras, é verbal.</li><li>3. <b>Lei, edital, contrato:</b> "Art. 5º Todos são iguais perante a lei." - Só palavras, é verbal.</li><li>4. <b>Bilhete, carta:</b> "Querida Maria, chego amanhã." - Só palavras, é verbal.</li><li>5. <b>Conversa no WhatsApp:</b> "Oi, você vai para o fórum hoje?" - Só palavras, é verbal.</li><li>6. <b>Poema, romance:</b> "No meio do caminho tinha uma pedra." - Só palavras, é verbal.</li><li>7. <b>Bula de remédio:</b> "Tomar 1 comprimido a cada 8 horas." - Só palavras, é verbal.</li><li>8. <b>Manual de instrução:</b> "Aperte o botão verde para ligar." - Só palavras, é verbal.</li></ul>
<p>Se tem palavra, e NÃO tem imagem importante, é verbal.</p>
<h4>2.2 Texto Não Verbal - Só imagem, sem nenhuma palavra</h4>
<p>É o texto que usa <b>IMAGEM, sem nenhuma palavra</b>. Ele comunica sem escrever. Você entende só de olhar.</p>
<ul><li>9. <b>Placa de trânsito de "Proibido estacionar" só com desenho:</b> Um círculo vermelho com um carro e um traço. Sem escrever "proibido". Você entende só de olhar. É não verbal.</li><li>10. <b>Placa de "Silêncio" com dedo na boca:</b> Desenho de um dedo na frente da boca. Sem palavra. É não verbal.</li><li>11. <b>Gráfico de pizza, sem legenda escrita:</b> Só as fatias coloridas, sem título, sem número. Você entende pela imagem. É não verbal.</li><li>12. <b>Foto de uma manifestação, sem texto:</b> Só a foto, sem legenda, sem título. Você entende que tem muita gente protestando. É não verbal.</li><li>13. <b>Semáforo:</b> Vermelho, amarelo, verde, sem nenhuma palavra escrita. Você entende: pare, atenção, siga. É não verbal.</li><li>14. <b>Símbolo de acessibilidade:</b> Desenho de cadeira de rodas, sem palavra. Você entende: lugar para cadeirante. É não verbal.</li></ul>
<p>Se só tem imagem, sem nenhuma palavra, é não verbal.</p>
<h4>2.3 Texto Misto / Multimodal - Palavra + Imagem juntas</h4>
<p>É o que mais cai na VUNESP hoje. É o texto que usa <b>PALAVRA + IMAGEM juntas</b>. Um completa o outro. Se tirar a imagem, você não entende tudo. Se tirar a palavra, também não entende tudo.</p>
<ul><li>15. <b>Charge com desenho + balão de fala:</b> Tem o desenho do político e o balão com a fala dele. Se tirar o desenho, você não sabe quem está falando. Se tirar a fala, você não sabe o que ele disse. Precisa dos dois. É misto.</li><li>16. <b>Tirinha:</b> Desenho + fala dos personagens. Precisa dos dois. É misto.</li><li>17. <b>Infográfico:</b> Gráfico + texto explicando o gráfico. Precisa dos dois. É misto.</li><li>18. <b>Propaganda:</b> Foto do produto + frase de efeito. "Compre já!" A foto mostra o produto, a frase convence. Precisa dos dois. É misto.</li><li>19. <b>Meme:</b> Foto + frase engraçada em cima. A graça está na combinação da foto com a frase. Sem a foto, a frase não tem graça. Sem a frase, a foto é normal. É misto.</li><li>20. <b>História em quadrinhos:</b> Desenho + fala + narração. Precisa de tudo. É misto.</li></ul>
<div class="box-peg"><b>Pegadinha que cai toda prova:</b> A VUNESP mostra uma charge com desenho e fala e pergunta: "Esse texto é verbal ou não verbal?" Muita gente marca "não verbal" porque tem desenho. <b>ERRADO.</b> Se tem desenho + palavra, é <b>misto</b>. Só é não verbal se NÃO tiver nenhuma palavra. Decore isso, porque cai em toda prova.</div>

<h3>3. TEXTO LITERÁRIO E NÃO LITERÁRIO - A diferença que decide a questão</h3>
<h4>3.1 Texto Literário - Beleza, emoção, figurado</h4>
<p>É o texto que tem preocupação com a <b>BELEZA, com a EMOÇÃO, com o COMO ele fala</b>, não só com O QUE ele fala. Ele usa sentido figurado, metáfora, ritmo, sonoridade.</p>
<p>Características do literário, uma por uma:</p>
<ul><li>Usa metáfora, comparação, ironia. Ex: "Ele é um leão" - não é um leão de verdade, é metáfora para bravo.</li><li>Pode inventar, criar mundo fictício. Ex: Harry Potter, Senhor dos Anéis - não existem de verdade, são inventados.</li><li>Quer emocionar, fazer pensar, não só informar. Quer que você sinta algo.</li><li>A linguagem é mais trabalhada, mais bonita, mais poética.</li></ul>
<p>Exemplos de literário:</p>
<ul><li>1. <b>Poema:</b> "No meio do caminho tinha uma pedra / tinha uma pedra no meio do caminho." - Usa repetição, ritmo, metáfora.</li><li>2. <b>Romance:</b> "Dom Casmurro", "Capitães da Areia" - Histórias longas inventadas, com personagens, emoção.</li><li>3. <b>Conto:</b> História curta inventada, com começo, meio e fim.</li><li>4. <b>Crônica:</b> Texto curto sobre o dia a dia, com humor e reflexão. Ex: Um autor que conta que foi ao fórum e viu uma cena engraçada, e no final reflete sobre a vida.</li><li>5. <b>Fábula:</b> "A cigarra e a formiga", com animais falando e moral no final. Animais não falam de verdade, é inventado para ensinar.</li></ul>
<h4>3.2 Texto Não Literário - Informar direto</h4>
<p>É o texto que quer <b>INFORMAR direto, sem enfeite</b>. Ele quer que você entenda rápido, sem duvidar, sem interpretar demais.</p>
<ul><li>Linguagem direta, clara, objetiva. Sem metáfora.</li><li>Não usa metáfora, usa sentido próprio, literal. Se diz "pedra", é pedra de verdade.</li><li>Quer informar, instruir, ordenar. Quer resolver um problema.</li><li>Não quer emocionar, quer resolver. Não quer que você chore, quer que você entenda.</li></ul>
<p>Exemplos de não literário:</p>
<ul><li>6. <b>Notícia de jornal:</b> "Tribunal abre concurso para escrevente." - Informa, direto.</li><li>7. <b>Edital:</b> "As inscrições vão de 10 a 20 de maio." - Informa data, direto.</li><li>8. <b>Bula de remédio:</b> "Tomar 1 comprimido a cada 8 horas." - Instrui, direto.</li><li>9. <b>Manual:</b> "Aperte o botão verde para ligar." - Instrui, direto.</li><li>10. <b>Lei:</b> "Art. 5º Todos são iguais perante a lei." - Ordena, direto.</li></ul>
<h4>3.3 O mesmo assunto, nos dois tipos - Compare lado a lado</h4>
<p>Assunto: Chuva.</p>
<p><b>Versão não literária:</b> "Hoje choveu 50mm em São Paulo. A Defesa Civil emitiu alerta. Evite áreas de alagamento. O trânsito está lento na Marginal."</p>
<p><b>Versão literária:</b> "O céu desabou sobre São Paulo, como se chorasse todas as mágoas do ano. As ruas viraram rios, e os carros, barquinhos perdidos, tentando sobreviver à tempestade."</p>
<p>É o mesmo assunto, mas o jeito de falar muda tudo. Na prova, a VUNESP te dá um texto e pergunta: "O texto é literário ou não literário? Justifique." Você tem que olhar para o COMO ele fala, não para o assunto. Se ele usa metáfora, comparação, emoção, é literário. Se ele informa direto, com número, data, ordem, é não literário.</p>
<p>Outro exemplo, assunto: Fórum.</p>
<p><b>Não literário:</b> "O fórum de Santos atende das 9h às 17h. O telefone é 1234-5678."</p>
<p><b>Literário:</b> "O fórum era um formigueiro, onde cada processo era uma folha carregada com suor, e cada servidor, uma formiga tentando não se perder no labirinto de papéis."</p>

<h3>4. COMO LER UM TEXTO NA PROVA - O método completo que funciona</h3>
<p>Não leia o texto como se estivesse lendo WhatsApp. Leia com método. Esse método é o que os aprovados usam, e é o que vai te fazer ganhar tempo.</p>
<p><b>Passo 1 - Leia o enunciado ANTES do texto (30 segundos)</b><br>Antes de ler o texto, leia a pergunta. A pergunta te diz o que procurar. Ex: Se a pergunta é "Qual é a ideia principal?", você já vai ler procurando a ideia principal. Se a pergunta é "O autor é a favor ou contra?", você já vai ler procurando a opinião. Muita gente lê o texto inteiro sem saber o que procurar, depois lê a pergunta e tem que ler tudo de novo. Você perde 5 minutos por questão assim. Em 16 questões, você perde 80 minutos. Você não tem esse tempo.</p>
<p><b>Passo 2 - Leia o texto 1ª vez para entender o geral (2 minutos)</b><br>Leia sem parar, sem sublinhar, só para entender: "Do que esse texto está falando?" "Quem escreveu?" "Para quem ele escreveu?" No final, você tem que conseguir resumir o texto em 1 frase. Ex: "Esse texto fala que o TJSP vai abrir concurso e que a prova vai ser difícil." Se você não consegue resumir em 1 frase, você não entendeu. Leia de novo.</p>
<p><b>Passo 3 - Leia o texto 2ª vez procurando detalhes (2 minutos)</b><br>Agora sim, sublinhe ou marque mentalmente: palavras que se repetem - elas são importantes. Palavras de ligação - mas, porque, portanto, embora - elas mostram a relação entre ideias. Adjetivos - eles mostram a opinião do autor. Números, datas, nomes - a VUNESP adora perguntar isso. Se o texto diz "100 vagas", a pergunta vai ser "quantas vagas?"</p>
<p><b>Passo 4 - Volte para as alternativas e elimine (1 minuto)</b><br>Não procure a alternativa certa de primeira. Elimine as absurdas. Alternativa que fala de algo que NÃO está no texto: elimine. Alternativa que é o contrário do texto: elimine. Alternativa com palavra absoluta: "sempre", "nunca", "todos", "nenhum" - desconfie, quase sempre está errada, porque o texto raramente é absoluto. Sobraram 2? Volte no texto e procure a prova. A certa tem que ter prova no texto. A errada não tem.</p>

<h3>5. OS 10 ERROS QUE TODO MUNDO COMETE NESTE CAPÍTULO</h3>
<ul><li>Erro 1: Achar que texto com imagem é sempre não verbal. Se tem imagem + palavra, é misto.</li><li>Erro 2: Achar que texto literário só existe em poema. Conto, crônica, romance também são literários.</li><li>Erro 3: Achar que notícia é literária porque é bem escrita. Notícia é não literária, porque quer informar.</li><li>Erro 4: Ler o texto antes de ler a pergunta. Você perde tempo.</li><li>Erro 5: Marcar alternativa que parece lógica, mas não está no texto. Se não tem prova no texto, está errada.</li><li>Erro 6: Confundir compreensão com interpretação. Compreensão é o que está escrito. Interpretação é o que o autor quis dizer.</li><li>Erro 7: Achar que charge é só desenho. Charge tem desenho + fala, é mista.</li><li>Erro 8: Achar que gráfico é sempre não verbal. Se o gráfico tem título, legenda, números escritos, ele é misto.</li><li>Erro 9: Achar que autor neutro não tem ponto de vista. Todo autor tem ponto de vista, até em notícia, na escolha do que mostrar.</li><li>Erro 10: Marcar alternativa com "sempre" ou "nunca" sem conferir. O texto raramente é absoluto.</li></ul>

<h3>6. 10 PEGADINHAS VUNESP - Do jeito que a banca coloca</h3>
<div class="box-peg">1. "Todo texto com imagem é não verbal." <b>ERRADO.</b> Se tem imagem + palavra, é misto.<br>2. "Texto literário só existe em poema." <b>ERRADO.</b> Conto, crônica, romance também são.<br>3. "Notícia é texto literário." <b>ERRADO.</b> Notícia é não literária, quer informar.<br>4. "Charge é texto não verbal." <b>ERRADO.</b> Charge tem desenho + fala, é mista.<br>5. "Gráfico com título e legenda é não verbal." <b>ERRADO.</b> Tem palavra, é misto.<br>6. "Texto não literário não pode ter metáfora." <b>CERTO, em regra.</b> Não literário usa sentido próprio.<br>7. "Crônica é texto literário." <b>CERTO.</b> Crônica usa humor, reflexão, sentido figurado.<br>8. "Edital é texto não literário." <b>CERTO.</b> Edital quer informar, direto.<br>9. "Meme é texto verbal." <b>ERRADO.</b> Meme tem foto + frase, é misto.<br>10. "Placa de trânsito sem palavra é texto verbal." <b>ERRADO.</b> Sem palavra, é não verbal.</div>

<h3>7. 10 QUESTÕES DE FIXAÇÃO - Faça agora, sem olhar as respostas</h3>
<p>1. Um texto que usa apenas uma foto de uma manifestação, sem nenhuma legenda, é: a) Verbal b) Não verbal c) Misto d) Literário<br>
2. Uma tirinha com desenho e balão de fala é: a) Verbal b) Não verbal c) Mista d) Não literária<br>
3. Um poema que usa metáfora para falar de amor é: a) Não literário b) Literário c) Não verbal d) Misto<br>
4. Um edital de concurso que informa data da prova é: a) Literário b) Não literário c) Não verbal d) Misto<br>
5. Uma charge com desenho de político e fala "Vou resolver tudo!" é: a) Não verbal b) Verbal c) Mista d) Sem texto<br>
6. Uma bula de remédio que diz "Tomar 1 comprimido a cada 8h" é: a) Literária b) Não literária c) Não verbal d) Poética<br>
7. Um infográfico com gráfico + texto explicando é: a) Não verbal b) Verbal c) Misto d) Literário<br>
8. Um romance inventado sobre um juiz é: a) Não literário b) Literário c) Não verbal d) Misto<br>
9. Uma placa "Proibido estacionar" só com desenho de carro e traço vermelho é: a) Verbal b) Não verbal c) Mista d) Literária<br>
10. Qual é o primeiro passo para ler um texto na prova? a) Ler o texto inteiro b) Ler o enunciado antes do texto c) Sublinhar tudo d) Chutar a alternativa</p>
<p><b>Gabarito comentado:</b> 1-B (Só foto, sem palavra = não verbal) / 2-C (Desenho + fala = misto) / 3-B (Poema com metáfora = literário) / 4-B (Edital informa = não literário) / 5-C (Desenho + fala = misto) / 6-B (Bula informa = não literária) / 7-C (Gráfico + texto = misto) / 8-B (Romance inventado = literário) / 9-B (Só desenho = não verbal) / 10-B (Leia o enunciado antes do texto)</p>

<div class="box-resumo"><b>📌 RESUMO FINAL + MAPA MENTAL:</b><br><b>TEXTO:</b> Verbal = palavra. Não verbal = só imagem. Misto = palavra + imagem.<br><b>TIPO:</b> Literário = beleza, figurado, emocionar (poema, romance, conto, crônica). Não literário = informar direto (notícia, edital, bula, manual, lei).<br><b>MÉTODO:</b> 1. Leia o enunciado antes 2. Leia o texto 1ª vez para o geral 3. Leia 2ª vez para detalhes 4. Elimine as absurdas, procure prova no texto.</div>
`}

mkQ("Um edital de concurso que informa data da prova é:",["Literário","Não literário","Não verbal","Misto"],1,"Edital informa direto = não literário.","Não literário = informar","Literário emociona, usa figurado."),
mkQ("Qual é o primeiro passo para ler um texto na prova?",["Ler o texto inteiro","Ler o enunciado antes do texto","Sublinhar tudo","Chutar a alternativa"],1,"Leia o enunciado antes, assim você já sabe o que procurar.","Enunciado antes do texto","Ler o texto sem saber o que procurar perde tempo.")
]}
];
let mode='livro';let activeTopic=LIVRO[0].id;let chapterIndex=0;let qIndex=0;let chosen=null;
function getList(){if(mode==='livro')return LIVRO;if(mode==='resumo')return RESUMO;return DB}
function getKey(){if(mode==='livro')return 'livro_';if(mode==='resumo')return 'resumo_';return ''}
function setMode(m){mode=m;['livro','resumo','simular'].forEach(k=>{let b=document.getElementById('tab-'+k);if(b){let on=(k===m);b.style.background=on?'#7f1d1d':'#fff';b.style.color=on?'#fff':'#000'}});let list=getList();activeTopic=list[0].id;chapterIndex=0;qIndex=0;render()}
function renderSidebar(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let list=getList();let html='';let title=mode==='livro'?'📖 Livro Completo - Cap 1':mode==='resumo'?'⚡ Resuminho - Cap 1':'📝 Simulado - Cap 1';html+=`<div class="card"><b>${title}</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:0%"></div></div><small id="ptext"></small></div>`;list.forEach(t=>{let key=getKey()+t.id;let done=(hist[key]?.done||0);let total=mode==='simular'?t.questions.length:t.chapters.length;let pct=total?Math.round(done/total*100):0;html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${done}/${total} • ${pct}%</small></div><span class="badge">${pct}%</span></div>`});document.getElementById("sidebar").innerHTML=html;updateProgress()}
function updateProgress(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let list=getList();let pct=0,txt="";if(mode==='simular'){let tot=list.reduce((s,t)=>s+t.questions.length,0);let done=list.reduce((s,t)=>s+(hist[t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" • "+pct+"%"}else{let key=getKey();let tot=list.reduce((s,t)=>s+t.chapters.length,0);let done=list.reduce((s,t)=>s+(hist[key+t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" págs • "+pct+"%"}let b=document.getElementById("pbar");if(b)b.style.width=pct+"%";let pt=document.getElementById("ptext");if(pt)pt.innerText=txt}
function selectTopic(id){activeTopic=id;chapterIndex=0;qIndex=0;chosen=null;if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open');render()}
function render(){renderSidebar();let list=getList();let t=list.find(x=>x.id===activeTopic);if(mode==='simular'){let total=t.questions.length;let qq=t.questions[qIndex];if(!qq){document.getElementById("app").innerHTML=`<div class="card"><h2>Concluído! 🎉</h2><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="qIndex=0;render()">Refazer</button> <button class="btn" onclick="setMode('resumo')">Ver Resuminho →</button></div></div>`;return}let html=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${t.icon} ${t.name}</b><span class="badge">${qIndex+1}/${total}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((qIndex/total)*100)}%"></div></div><p class="q">${qIndex+1}. ${qq.q}</p><div id="opts">${qq.o.map((op,i)=>`<div class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${op}</div>`).join("")}</div><div id="feedback" class="hidden"></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="confirmQ()">Corrigir (Enter)</button><button class="btn" onclick="nextQ()">Pular</button></div></div>`;document.getElementById("app").innerHTML=html;return}
let chap=t.chapters[chapterIndex];if(!chap){document.getElementById("app").innerHTML=`<div class="card"><h2>Concluído! 🎉</h2><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="chapterIndex=0;render()">Recomeçar</button> ${mode==='livro'?'<button class="btn" onclick="setMode(\'resumo\')">Ir pro Resuminho →</button>':'<button class="btn" onclick="setMode(\'simular\')">Ir pro Simulado →</button>'}</div></div>`;return}
let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${t.icon} ${t.name} - ${chap.title}</b><span class="badge">${chapterIndex+1}/${t.chapters.length}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((chapterIndex/t.chapters.length)*100)}%"></div></div><div class="book-page">${chap.content}</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="markRead()">✅ Li e entendi + Próxima → (Enter)</button><button class="btn" onclick="nextChapter()">Pular →</button></div></div>`;document.getElementById("app").innerHTML=html}
function markRead(){let users=getUsers();let cur=getCurrent();if(!users[cur])return;let key=getKey()+activeTopic;if(!users[cur].history[key])users[cur].history[key]={done:0};let h=users[cur].history[key];if(chapterIndex>=(h.done||0))h.done=Math.max(h.done||0,chapterIndex+1);saveUsers(users);nextChapter()}
function nextChapter(){let t=getList().find(x=>x.id===activeTopic);if(!t)return;chapterIndex++;if(chapterIndex>=t.chapters.length)chapterIndex=t.chapters.length;render()}
function choose(i){chosen=i;document.querySelectorAll(".opt").forEach((el,idx)=>{el.style.borderWidth=idx===i?"3px":"1.5px";el.style.fontWeight=idx===i?"700":"400"})}
function confirmQ(){if(chosen===null)return alert("Escolha 1-4");let t=DB.find(x=>x.id===activeTopic);let qq=t.questions[qIndex];document.querySelectorAll(".opt").forEach((el,idx)=>{if(idx===qq.a)el.classList.add("correct");else if(idx===chosen&&chosen!==qq.a)el.classList.add("wrong")});let acerto=chosen===qq.a;let fb=document.getElementById("feedback");fb.classList.remove("hidden");fb.innerHTML=`<div class="explain"><div style="font-weight:800;color:${acerto?'#16a34a':'#dc2626'}">${acerto?'✅ ACERTOU!':'❌ ERROU'}</div><div style="margin-top:8px"><b>Correta: ${String.fromCharCode(65+qq.a)}. ${qq.o[qq.a]}</b></div><div style="margin-top:8px"><b>Por que CERTA está certa:</b><br><small>${qq.ec}</small></div><div style="margin-top:8px"><b>Por que ERRADAS estão erradas:</b><br><small>${qq.ei}</small></div><div style="margin-top:8px;background:#fff;border:1px dashed #000;border-radius:8px;padding:8px"><b>📚 Explicação Completa:</b><br><small>${qq.e}</small></div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary" onclick="nextQ()">Próxima →</button> <button class="btn" onclick="setMode('livro')">Ver livro 📖</button></div></div>`;let users=getUsers();let cur=getCurrent();if(!users[cur].history[activeTopic])users[cur].history[activeTopic]={done:0,hits:0};let h=users[cur].history[activeTopic];if(qIndex>=(h.done||0))h.done=Math.max(h.done||0,qIndex+1);if(acerto)h.hits=(h.hits||0)+1;saveUsers(users);updateProgress()}
function nextQ(){let t=DB.find(x=>x.id===activeTopic);qIndex++;chosen=null;if(qIndex>=t.questions.length)qIndex=t.questions.length;render()}
function checkAuth(){let cur=getCurrent();let loginDiv=document.getElementById("login-overlay");if(!cur){if(!loginDiv){let div=document.createElement("div");div.id="login-overlay";div.innerHTML=`<div style="position:fixed;inset:0;background:linear-gradient(135deg,#7f1d1d,#991b1b);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px"><div class="card" style="width:100%;max-width:420px;background:#fff"><h2 style="margin-top:0;color:#000">Login TJSP</h2><input id="name" placeholder="Seu nome" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><input id="pass" type="password" placeholder="Senha: SaygonEscrivao2026" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><button class="btn btn-primary" style="width:100%;padding:12px;margin-top:8px" onclick="doLogin()">Entrar</button><p style="margin-top:12px"><a href="#" onclick="openReset();return false" style="color:#000">Esqueci senha / Reset com chave</a></p><small style="color:#000">Senha padrão: SaygonEscrivao2026<br>Chave: TJSP2026RESET</small></div></div>`;document.body.appendChild(div);setTimeout(()=>{document.getElementById("name")?.focus()},100)}return false}else{if(loginDiv)loginDiv.remove();return true}}
function doLogin(){let n=document.getElementById("name")?.value.trim();let p=document.getElementById("pass")?.value;if(!n){alert("Digite seu nome");return}let u=getUsers();if(!u[n]){u[n]={pass:p||DEFAULT_PASS,history:{}};saveUsers(u);setCurrent(n);location.reload();return}if(u[n].pass===p){setCurrent(n);location.reload()}else{alert("Senha incorreta.")}}
function logout(){localStorage.removeItem("tjsp_current");location.reload()}
function openReset(){let cur=getCurrent();let nome=cur||prompt("Nome do usuário:");if(!nome)return;let chave=prompt("Chave mestra:");if(chave!==MASTER_KEY)return alert("Chave incorreta");let nova=prompt("Nova senha:");if(!nova)return;let u=getUsers();if(!u[nome])u[nome]={pass:nova,history:{}};else u[nome].pass=nova;saveUsers(u);setCurrent(nome);alert("Senha trocada! ✅");location.reload()}
function exportBackup(){let u=getUsers();let cur=getCurrent();if(!cur)return alert("Faça login");let data=JSON.stringify(u[cur]||{},null,2);let blob=new Blob([data],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download=`backup-${cur}-tjsp.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener("keydown",e=>{if(!checkAuth())return;if(e.key>="1"&&e.key<="4"&&mode==='simular'){let fb=document.getElementById("feedback");if(!fb||fb.classList.contains("hidden"))choose(parseInt(e.key)-1)}if(e.key==="Enter"){if(mode!=='simular'){markRead()}else{let fb=document.getElementById("feedback");if(fb&&!fb.classList.contains("hidden"))nextQ();else confirmQ()}}});
if(checkAuth()){render()}
</script>
</body>
</html>

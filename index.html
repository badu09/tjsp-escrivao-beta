{title:"1 - Análise, compreensão e interpretação de textos",content:`
<h3>1. O QUE O EDITAL PEDE</h3>
<div class="box-legal"><b>Edital - BLOCO I - Item 1:</b> Análise, compreensão e interpretação de diversos tipos de textos verbais, não verbais, literários e não literários.</div>
<p><b>Análise</b> = desmontar o texto. <b>Compreensão</b> = entender o que está escrito. <b>Interpretação</b> = entender o que o autor QUIS dizer.</p>
<h3>2. VERBAL, NÃO VERBAL, MISTO</h3>
<p><b>Verbal:</b> usa palavras. Ex: notícia, e-mail, lei, poema, bula, manual, conversa no WhatsApp.</p>
<p><b>Não verbal:</b> só imagem, sem palavra. Ex: placa de trânsito só com desenho, semáforo, foto sem legenda, símbolo de acessibilidade.</p>
<p><b>Misto / Multimodal:</b> palavra + imagem juntas. Ex: charge com balão, tirinha, infográfico, propaganda, meme, HQ.</p>
<div class="box-peg"><b>Pegadinha:</b> Charge com desenho + fala é MISTA, não não verbal. Só é não verbal se NÃO tiver nenhuma palavra.</div>
<h3>3. LITERÁRIO E NÃO LITERÁRIO</h3>
<p><b>Literário:</b> preocupação com beleza, emoção, figurado. Ex: poema, romance, conto, crônica, fábula. Usa metáfora, ironia.</p>
<p><b>Não literário:</b> quer informar direto. Ex: notícia, edital, bula, manual, lei. Linguagem direta, sentido próprio.</p>
<p><b>Compare - Assunto Chuva:</b><br><b>Não literário:</b> "Hoje choveu 50mm em São Paulo. Evite áreas de alagamento."<br><b>Literário:</b> "O céu desabou sobre São Paulo, como se chorasse todas as mágoas do ano."</p>
<h3>4. MÉTODO DE LEITURA</h3>
<p><b>Passo 1:</b> Leia o enunciado ANTES do texto. <b>Passo 2:</b> Leia 1ª vez para o geral. <b>Passo 3:</b> Leia 2ª vez para detalhes. <b>Passo 4:</b> Elimine as absurdas, procure prova no texto. Desconfie de "sempre, nunca, todos, nenhum".</p>
<h3>5. 10 ERROS</h3>
<ul><li>Texto com imagem + palavra é misto, não não verbal.</li><li>Literário não é só poema. Conto, crônica, romance também são.</li><li>Notícia é não literária.</li><li>Não leia o texto antes da pergunta.</li><li>Se não tem prova no texto, está errado.</li><li>Compreensão = escrito. Interpretação = quis dizer.</li><li>Charge é mista.</li><li>Gráfico com título é misto.</li><li>Todo autor tem ponto de vista, até em notícia.</li><li>Não marque "sempre/nunca" sem conferir.</li></ul>
<h3>6. 10 PEGADINHAS</h3>
<div class="box-peg">1. Todo texto com imagem é não verbal - ERRADO, se tem palavra é misto.<br>2. Literário só em poema - ERRADO.<br>3. Notícia é literária - ERRADO.<br>4. Charge é não verbal - ERRADO, é mista.<br>5. Gráfico com título é não verbal - ERRADO, é misto.<br>6. Não literário não usa metáfora - CERTO em regra.<br>7. Crônica é literária - CERTO.<br>8. Edital é não literário - CERTO.<br>9. Meme é verbal - ERRADO, é misto.<br>10. Placa sem palavra é verbal - ERRADO, é não verbal.</div>
<h3>7. QUESTÕES DE FIXAÇÃO</h3>
<p>1. Foto sem legenda é: b) Não verbal / 2. Tirinha com balão é: c) Mista / 3. Poema com metáfora é: b) Literário / 4. Edital é: b) Não literário / 5. Charge é: c) Mista / 6. Bula é: b) Não literária / 7. Infográfico é: c) Misto / 8. Romance é: b) Literário / 9. Placa só desenho é: b) Não verbal / 10. Primeiro passo: b) Ler o enunciado antes</p>
<div class="box-resumo"><b>📌 RESUMO:</b> Verbal = palavra. Não verbal = só imagem. Misto = os dois. Literário = beleza, figurado. Não literário = informar direto.</div>
`},
{title:"2 - Informações literais e inferências possíveis",content:`
<h3>1. O QUE O EDITAL PEDE</h3>
<div class="box-legal"><b>Edital - BLOCO I - Item 2:</b> Informações literais e inferências possíveis.</div>
<p>3 níveis: <b>Literal</b> = está escrito. <b>Inferência</b> = não está escrito, mas dá para concluir COM PROVA. <b>Invenção</b> = não está escrito e NÃO tem prova. Você inventou.</p>
<p><b>Regra de ouro:</b> Se você não consegue apontar a frase que prova, está errado.</p>
<h3>2. LITERAL</h3>
<p>Perguntas: "Segundo o texto", "De acordo com o texto", "Conforme o texto". Resposta tem que estar ESCRITA.</p>
<p><b>Texto-base:</b> "Maria chegou ao fórum às 8h, ofegante, com camisa suada e pasta pesada. Olhou para o relógio pela terceira vez e suspirou: Já são 8h, vou me atrasar para a audiência."</p>
<p>Literal: Maria chegou ao fórum. Chegou às 8h. Estava ofegante. Camisa suada. Pasta pesada. Olhou relógio 3ª vez. Suspirou. Ia para audiência.</p>
<p>Cuidado: VUNESP troca 8h por 9h, terceira por segunda. Leia número por número.</p>
<h3>3. INFERÊNCIA</h3>
<p>Perguntas: "Infere-se", "Depreende-se", "Pode-se concluir", "O autor sugere". Resposta NÃO está escrita igual, mas tem prova.</p>
<p>Inferências da Maria: Veio correndo (prova: ofegante, suada). Estava ansiosa (prova: olhou relógio 3x, suspirou). Tinha compromisso importante (prova: audiência). Carregava documentos (prova: pasta pesada).</p>
<h3>4. INVENÇÃO</h3>
<p>Maria mora longe. Maria foi de ônibus. Maria é escrevente. Maria ia para festa. Tudo sem prova = invenção = alternativa errada.</p>
<h3>5. PEGADINHAS</h3>
<div class="box-peg">1. "Segundo o texto, Maria veio de ônibus" - ERRADO, invenção.<br>2. "Infere-se que Maria estava ansiosa" - CERTO, tem prova.<br>3. "Segundo o texto, Maria chegou às 9h" - ERRADO, texto diz 8h.<br>4. "Maria é escrevente" - ERRADO, texto não fala profissão.<br>5. "Infere-se que Maria estava tranquila" - ERRADO, é o contrário.</div>
<h3>6. QUESTÕES</h3>
<p>1. Maria chegou às: b) 8h / 2. Infere-se que estava: b) Ansiosa / 3. Carregava: b) Pasta pesada / 4. Pode-se concluir: b) Veio correndo / 5. Olhou relógio: c) 3 vezes / 6. Tinha: b) Audiência / 7. Disse: b) "Já são 8h" / 8. Inventada: c) Foi de ônibus / 9. "Estava preocupada" é: b) Inferência correta / 10. "É escrevente" é: b) Errado, invenção</p>
<div class="box-resumo"><b>📌 RESUMO:</b> Literal = escrito. Inferência = conclusão COM PROVA. Invenção = sem prova, errada.</div>
`},
{title:"3 - Ponto de vista do autor",content:`
<h3>1. O QUE O EDITAL PEDE, EXATAMENTE</h3>
<div class="box-legal"><b>Edital TJSP - BLOCO I - Item 3:</b> Ponto de vista do autor.</div>
<p>Ponto de vista é a <b>opinião do autor, a posição dele</b>. Ele é a favor ou contra? Ele está criticando ou elogiando? Ele está sendo sério ou irônico? Ele está otimista ou pessimista? Ele está defendendo quem?</p>
<p>O autor nem sempre fala "eu acho". Na maioria das vezes ele ESCONDE a opinião nas palavras que ele escolhe. Por isso você precisa aprender a caçar a opinião escondida.</p>
<p>Exemplo simples: Dois jornais falam do mesmo aumento de salário.<br><b>Jornal A:</b> "O governo concedeu um <b>generoso</b> aumento de 5% aos servidores."<br><b>Jornal B:</b> "O governo concedeu um <b>mísero</b> aumento de 5% aos servidores."<br>É o mesmo fato: aumento de 5%. Mas o ponto de vista é oposto. Generoso = a favor. Mísero = contra. A palavra que o autor escolhe entrega a opinião dele.</p>

<h3>2. OS 5 TIPOS DE PONTO DE VISTA QUE MAIS CAEM</h3>
<table><tr><th>Tipo</th><th>Como identificar</th><th>Exemplo</th></tr>
<tr><td><b>Favorável / Elogio</b></td><td>Adjetivos positivos, verbos de conquista</td><td>"Brilhante decisão", "Conseguiu melhorar"</td></tr>
<tr><td><b>Contrário / Crítica</b></td><td>Adjetivos negativos, verbos de insistência no erro</td><td>"Absurdo aumento", "Insiste em errar"</td></tr>
<tr><td><b>Irônico</b></td><td>Diz o contrário do que pensa, com exagero</td><td>"Que maravilha, mais um aumento!"</td></tr>
<tr><td><b>Neutro / Imparcial</b></td><td>Só informa, sem adjetivo, sem opinião</td><td>"O tribunal informou que a prova será em maio."</td></tr>
<tr><td><b>Otimista / Pessimista</b></td><td>Palavras de esperança ou de medo</td><td>"Promete agilizar" (otimista) / "Vai piorar" (pessimista)</td></tr></table>

<h3>3. ONDE A OPINIÃO SE ESCONDE - As 4 pistas</h3>
<h4>Pista 1 - Adjetivos entregam tudo</h4>
<p>Adjetivo é a palavra que dá qualidade. É onde o autor mais mostra a opinião.</p>
<ul><li>1. "O <b>absurdo</b> aumento" = contra</li><li>2. "A <b>brilhante</b> decisão" = a favor</li><li>3. "O <b>corajoso</b> juiz" = a favor</li><li>4. "O <b>covarde</b> político" = contra</li><li>5. "A <b>justa</b> decisão" = a favor</li><li>6. "A <b>injusta</b> cobrança" = contra</li><li>7. "O <b>excelente</b> atendimento" = a favor</li><li>8. "O <b>péssimo</b> atendimento" = contra</li><li>9. "A <b>necessária</b> reforma" = a favor</li><li>10. "A <b>desnecessária</b> despesa" = contra</li></ul>
<h4>Pista 2 - Verbos entregam também</h4>
<ul><li>11. "O governo <b>conseguiu</b> melhorar" = elogio, ele conseguiu, foi capaz</li><li>12. "O governo <b>insiste</b> em errar" = crítica, ele continua errando</li><li>13. "O juiz <b>garantiu</b> o direito" = a favor, ele protegeu</li><li>14. "O juiz <b>ignorou</b> o pedido" = contra, ele não ligou</li><li>15. "O tribunal <b>avançou</b>" = positivo</li><li>16. "O tribunal <b>retrocedeu</b>" = negativo</li></ul>
<h4>Pista 3 - Ironia - A mais difícil</h4>
<p>Ironia é quando o autor diz o contrário do que pensa, para criticar de forma engraçada. Na prova, 90% das ironias são CRÍTICAS disfarçadas de elogio.</p>
<ul><li>17. "Que <b>maravilha</b>, mais um aumento de imposto!" = Ele NÃO acha maravilha. Ele está criticando.</li><li>18. "Que <b>ótimo</b>, o processo atrasou de novo!" = Ele NÃO acha ótimo. Ele está criticando o atraso.</li><li>19. "Parabéns, você conseguiu perder o prazo!" = Não é parabéns de verdade. É crítica.</li><li>20. "Claro, porque o fórum nunca tem fila, né?" = Ele está dizendo que o fórum SEMPRE tem fila. É ironia.</li></ul>
<p><b>Como identificar ironia na prova:</b> Se o elogio é exagerado demais e não combina com a situação, é ironia. Ninguém acha "maravilha" pagar mais imposto. Ninguém acha "ótimo" processo atrasar. Se não faz sentido elogiar, é ironia.</p>
<h4>Pista 4 - O que o autor ESCOLHE mostrar</h4>
<p>Até notícia "neutra" tem ponto de vista na escolha do que mostrar. Exemplo: Um autor que é contra o governo vai mostrar só as filas, os atrasos, os erros. Um autor a favor vai mostrar só as inaugurações, as melhorias. O ponto de vista está na seleção.</p>
<p>Ex: Texto 1 só fala das filas do fórum. Texto 2 só fala da nova sala inaugurada. Os dois falam do fórum, mas o ponto de vista é diferente porque cada um escolheu mostrar um lado.</p>

<h3>4. 10 TEXTOS CURTOS PARA TREINAR - Leia e descubra o ponto de vista</h3>
<p><b>Texto 1:</b> "Finalmente, depois de anos de espera, o tribunal inaugurou a nova sala de atendimento, que promete agilizar a vida do cidadão."<br><b>Ponto de vista:</b> Positivo, otimista, aliviado. Palavras: "finalmente" (alívio), "promete agilizar" (esperança).</p>
<p><b>Texto 2:</b> "Mais uma vez, o governo anunciou uma reforma que só vai tirar direitos dos servidores."<br><b>Ponto de vista:</b> Contrário, crítico, pessimista. Palavras: "mais uma vez" (cansaço), "só vai tirar" (crítica).</p>
<p><b>Texto 3:</b> "O juiz, com coragem e sabedoria, decidiu a favor do cidadão."<br><b>Ponto de vista:</b> A favor, elogio. Palavras: "coragem", "sabedoria".</p>
<p><b>Texto 4:</b> "O tribunal informou que as inscrições começam em maio."<br><b>Ponto de vista:</b> Neutro, só informa. Nenhum adjetivo, nenhuma opinião.</p>
<p><b>Texto 5:</b> "Que beleza, o sistema caiu no meio da audiência!"<br><b>Ponto de vista:</b> Irônico, crítico. Ninguém acha beleza sistema cair.</p>
<p><b>Texto 6:</b> "É inaceitável que o cidadão espere 5 horas na fila."<br><b>Ponto de vista:</b> Contrário, indignado. Palavra: "inaceitável".</p>
<p><b>Texto 7:</b> "A brilhante iniciativa do TJSP vai ajudar milhares de pessoas."<br><b>Ponto de vista:</b> A favor, elogio. Palavra: "brilhante".</p>
<p><b>Texto 8:</b> "O autor sugere que a reforma é necessária, mas precisa ser discutida com calma."<br><b>Ponto de vista:</b> A favor com ressalva. Ele apoia, mas com cuidado. Não é 100% a favor, nem 100% contra.</p>
<p><b>Texto 9:</b> "Infelizmente, mais um servidor foi agredido no fórum."<br><b>Ponto de vista:</b> Lamenta, é contra a violência. Palavra: "infelizmente".</p>
<p><b>Texto 10:</b> "Felizmente, o processo foi concluído antes do prazo."<br><b>Ponto de vista:</b> Positivo, aliviado. Palavra: "felizmente".</p>

<h3>5. COMO A VUNESP PERGUNTA</h3>
<ul><li>"Qual é o ponto de vista do autor?"</li><li>"O autor é a favor ou contra...?"</li><li>"O autor critica ou elogia...?"</li><li>"A expressão 'que maravilha' revela..." (resposta: ironia, crítica)</li><li>"O autor demonstra..." (otimismo, pessimismo, indignação, etc)</li><li>"Segundo o autor, a medida é..." (boa, ruim, necessária, absurda)</li></ul>
<p>Quando a pergunta for assim, não procure o que está escrito literalmente. Procure os ADJETIVOS e os VERBOS. Eles são a prova.</p>

<h3>6. OS 10 ERROS QUE TODO MUNDO COMETE</h3>
<ul><li>Erro 1: Achar que notícia é sempre neutra. Até notícia tem ponto de vista na escolha do que mostrar.</li><li>Erro 2: Achar que ironia é elogio. Ironia quase sempre é crítica disfarçada.</li><li>Erro 3: Ignorar os adjetivos. Adjetivo é onde a opinião mora.</li><li>Erro 4: Confundir ponto de vista do autor com ponto de vista do personagem. Se o personagem fala, não é o autor. Ex: O personagem diz "o governo é ótimo", mas o autor pode estar ironizando o personagem.</li><li>Erro 5: Achar que "infelizmente" e "felizmente" não importam. Elas importam muito, são a opinião.</li><li>Erro 6: Marcar "neutro" quando o texto tem adjetivo. Se tem adjetivo positivo ou negativo, não é neutro.</li><li>Erro 7: Achar que autor que critica tudo é neutro. Criticar é um ponto de vista.</li><li>Erro 8: Não perceber a ressalva. "É necessária, mas..." não é 100% a favor.</li><li>Erro 9: Confundir ponto de vista com fato. Fato: "A prova será em maio". Opinião: "A prova será muito difícil".</li><li>Erro 10: Não voltar no texto para procurar a palavra que prova. Sempre volte.</li></ul>

<h3>7. 10 PEGADINHAS VUNESP</h3>
<div class="box-peg">1. "O autor é neutro porque é uma notícia." <b>ERRADO.</b> Até notícia tem ponto de vista na escolha do que mostrar.<br>2. "Ironia é elogio." <b>ERRADO.</b> Ironia é quase sempre crítica disfarçada.<br>3. "'Que maravilha, mais um aumento!' mostra que o autor está feliz." <b>ERRADO.</b> Mostra ironia, crítica.<br>4. "'Brilhante decisão' mostra que o autor é contra." <b>ERRADO.</b> Brilhante é elogio, a favor.<br>5. "'Absurdo aumento' mostra que o autor é a favor." <b>ERRADO.</b> Absurdo é crítica, contra.<br>6. "'Infelizmente' não mostra opinião." <b>ERRADO.</b> Mostra lamento, opinião negativa.<br>7. "'Felizmente' mostra pessimismo." <b>ERRADO.</b> Mostra otimismo, alívio.<br>8. "Adjetivo não importa para ponto de vista." <b>ERRADO.</b> Adjetivo é a principal pista.<br>9. "Se o personagem elogia, o autor elogia." <b>ERRADO.</b> Personagem e autor são diferentes.<br>10. "'É necessária, mas precisa de calma' é 100% a favor." <b>ERRADO.</b> É a favor com ressalva.</div>

<h3>8. 10 QUESTÕES DE FIXAÇÃO</h3>
<p>1. Em "O absurdo aumento de impostos", o autor é: a) A favor b) Contra c) Neutro d) Irônico<br>
2. Em "A brilhante decisão do juiz", o autor: a) Critica b) Elogia c) É neutro d) É irônico<br>
3. Em "Que maravilha, mais um aumento!", o autor está: a) Feliz b) Sendo irônico, criticando c) Neutro d) Elogiando<br>
4. Em "O tribunal informou que a prova será em maio", o autor é: a) A favor b) Contra c) Neutro, só informa d) Irônico<br>
5. Em "Infelizmente, o processo atrasou", o autor: a) Está feliz b) Lamenta, é contra o atraso c) É neutro d) Elogia<br>
6. Em "Felizmente, o processo terminou antes do prazo", o autor: a) Lamenta b) Está aliviado, positivo c) Critica d) É neutro<br>

<p><b>Gabarito comentado:</b> 1-B (Absurdo = contra) / 2-B (Brilhante = elogio) / 3-B (Ironia = crítica) / 4-C (Sem adjetivo, só informa) / 5-B (Infelizmente = lamento) / 6-B (Felizmente = alívio) / 7-B (Insiste em errar = crítica) / 8-B (Conseguiu = elogio) / 9-C (A favor, mas com calma) / 10-B (Adjetivo é a principal pista)</p>

let mode='livro';let activeTopic=LIVRO[0].id;let chapterIndex=0;let qIndex=0;let chosen=null;
function getList(){if(mode==='livro')return LIVRO;if(mode==='resumo')return RESUMO;return DB}
function getKey(){if(mode==='livro')return 'livro_';if(mode==='resumo')return 'resumo_';return ''}
function setMode(m){mode=m;['livro','resumo','simular'].forEach(k=>{let b=document.getElementById('tab-'+k);if(b){let on=(k===m);b.style.background=on?'#7f1d1d':'#fff';b.style.color=on?'#fff':'#000'}});let list=getList();activeTopic=list[0].id;chapterIndex=0;qIndex=0;render()}
function renderSidebar(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let list=getList();let html='';let title=mode==='livro'?'📖 Livro Completo - BLOCO I':mode==='resumo'?'⚡ Resuminho - BLOCO I':'📝 Simulado - BLOCO I';html+=`<div class="card"><b>${title}</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:0%"></div></div><small id="ptext"></small></div>`;list.forEach(t=>{let key=getKey()+t.id;let done=(hist[key]?.done||0);let total=mode==='simular'?t.questions.length:t.chapters.length;let pct=total?Math.round(done/total*100):0;let label=mode==='simular'?`${done}/${total} • ${pct}%`:`${done}/${total} caps • ${pct}%`;html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${label}</small></div><span class="badge">${pct}%</span></div>`});document.getElementById("sidebar").innerHTML=html;updateProgress()}
function updateProgress(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let list=getList();let pct=0,txt="";if(mode==='simular'){let tot=list.reduce((s,t)=>s+t.questions.length,0);let done=list.reduce((s,t)=>s+(hist[t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" • "+pct+"%"}else{let key=getKey();let tot=list.reduce((s,t)=>s+t.chapters.length,0);let done=list.reduce((s,t)=>s+(hist[key+t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" págs • "+pct+"%"}let b=document.getElementById("pbar");if(b)b.style.width=pct+"%";let pt=document.getElementById("ptext");if(pt)pt.innerText=txt}
function selectTopic(id){activeTopic=id;chapterIndex=0;qIndex=0;chosen=null;if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open');render()}
function render(){renderSidebar();let list=getList();let t=list.find(x=>x.id===activeTopic);if(mode==='simular'){let total=t.questions.length;let qq=t.questions[qIndex];if(!qq){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><p>Você fez ${total} questões do Cap 1 a 3.</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="qIndex=0;render()">Refazer</button> <button class="btn" onclick="setMode('resumo')">Ver Resuminho →</button></div></div>`;return}let html=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${t.icon} ${t.name}</b><span class="badge">${qIndex+1}/${total}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((qIndex/total)*100)}%"></div></div><p class="q">${qIndex+1}. ${qq.q}</p><div id="opts">${qq.o.map((op,i)=>`<div class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${op}</div>`).join("")}</div><div id="feedback" class="hidden"></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="confirmQ()">Corrigir (Enter)</button><button class="btn" onclick="nextQ()">Pular</button></div></div>`;document.getElementById("app").innerHTML=html;return}
let chap=t.chapters[chapterIndex];if(!chap){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="chapterIndex=0;render()">Recomeçar</button> ${mode==='livro'?'<button class="btn" onclick="setMode(\'resumo\')">Ir pro Resuminho →</button>':'<button class="btn" onclick="setMode(\'simular\')">Ir pro Simulado →</button>'}</div></div>`;return}
let nextLabel=mode==='livro'?'✅ Li e entendi + Próxima →':'✅ Revisei + Próxima →';let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${t.icon} ${t.name} - ${chap.title}</b><span class="badge">${chapterIndex+1}/${t.chapters.length}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((chapterIndex/t.chapters.length)*100)}%"></div></div><div class="book-page">${chap.content}</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="markRead()">${nextLabel} (Enter)</button><button class="btn" onclick="nextChapter()">Pular →</button></div></div>`;document.getElementById("app").innerHTML=html}
function markRead(){let users=getUsers();let cur=getCurrent();if(!users[cur])return;let key=getKey()+activeTopic;if(!users[cur].history[key])users[cur].history[key]={done:0};let h=users[cur].history[key];if(chapterIndex>=(h.done||0))h.done=Math.max(h.done||0,chapterIndex+1);saveUsers(users);nextChapter()}
function nextChapter(){let t=getList().find(x=>x.id===activeTopic);if(!t)return;chapterIndex++;if(chapterIndex>=t.chapters.length)chapterIndex=t.chapters.length;render()}
function choose(i){chosen=i;document.querySelectorAll(".opt").forEach((el,idx)=>{el.style.borderWidth=idx===i?"3px":"1.5px";el.style.fontWeight=idx===i?"700":"400"})}
function confirmQ(){if(chosen===null)return alert("Escolha 1-4");let t=DB.find(x=>x.id===activeTopic);let qq=t.questions[qIndex];document.querySelectorAll(".opt").forEach((el,idx)=>{if(idx===qq.a)el.classList.add("correct");else if(idx===chosen&&chosen!==qq.a)el.classList.add("wrong")});let acerto=chosen===qq.a;let fb=document.getElementById("feedback");fb.classList.remove("hidden");fb.innerHTML=`<div class="explain"><div style="font-weight:800;color:${acerto?'#16a34a':'#dc2626'}">${acerto?'✅ ACERTOU!':'❌ ERROU'}</div><div style="margin-top:8px"><b>Correta: ${String.fromCharCode(65+qq.a)}. ${qq.o[qq.a]}</b></div><div style="margin-top:8px"><b>Por que CERTA está certa:</b><br><small>${qq.ec}</small></div><div style="margin-top:8px"><b>Por que ERRADAS estão erradas:</b><br><small>${qq.ei}</small></div><div style="margin-top:8px;background:#fff;border:1px dashed #000;border-radius:8px;padding:8px"><b>📚 Explicação Completa:</b><br><small>${qq.e}</small></div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary" onclick="nextQ()">Próxima →</button> <button class="btn" onclick="setMode('livro')">Ver livro 📖</button></div></div>`;let users=getUsers();let cur=getCurrent();if(!users[cur].history[activeTopic])users[cur].history[activeTopic]={done:0,hits:0};let h=users[cur].history[activeTopic];if(qIndex>=(h.done||0))h.done=Math.max(h.done||0,qIndex+1);if(acerto)h.hits=(h.hits||0)+1;saveUsers(users);updateProgress()}
function nextQ(){let t=DB.find(x=>x.id===activeTopic);qIndex++;chosen=null;if(qIndex>=t.questions.length)qIndex=t.questions.length;render()}
function checkAuth(){let cur=getCurrent();let loginDiv=document.getElementById("login-overlay");if(!cur){if(!loginDiv){let div=document.createElement("div");div.id="login-overlay";div.innerHTML=`<div style="position:fixed;inset:0;background:linear-gradient(135deg,#7f1d1d,#991b1b);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px"><div class="card" style="width:100%;max-width:420px;background:#fff"><h2 style="margin-top:0;color:#000">Login TJSP</h2><input id="name" placeholder="Seu nome" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><input id="pass" type="password" placeholder="Senha: SaygonEscrivao2026" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><button class="btn btn-primary" style="width:100%;padding:12px;margin-top:8px" onclick="doLogin()">Entrar</button><p style="margin-top:12px"><a href="#" onclick="openReset();return false" style="color:#000">Esqueci senha / Reset com chave</a></p><small style="color:#000">Senha padrão: SaygonEscrivao2026<br>Chave: TJSP2026RESET</small></div></div>`;document.body.appendChild(div);setTimeout(()=>{document.getElementById("name")?.focus()},100)}return false}else{if(loginDiv)loginDiv.remove();return true}}
function doLogin(){let n=document.getElementById("name")?.value.trim();let p=document.getElementById("pass")?.value;if(!n){alert("Digite seu nome");return}let u=getUsers();if(!u[n]){u[n]={pass:p||DEFAULT_PASS,history:{}};saveUsers(u);setCurrent(n);location.reload();return}if(u[n].pass===p){setCurrent(n);location.reload()}else{alert("Senha incorreta.")}}
function logout(){localStorage.removeItem("tjsp_current");location.reload()}
function openReset(){let cur=getCurrent();let nome=cur||prompt("Nome do usuário:");if(!nome)return;let chave=prompt("Chave mestra:");if(chave!==MASTER_KEY)return alert("Chave incorreta");let nova=prompt("Nova senha:");if(!nova)return;let u=getUsers();if(!u[nome])u[nome]={pass:nova,history:{}};else u[nome].pass=nova;saveUsers(u);setCurrent(nome);alert("Senha trocada! ✅");location.reload()}
function exportBackup(){let u=getUsers();let cur=getCurrent();if(!cur)return alert("Faça login");let data=JSON.stringify(u[cur]||{},null,2);let blob=new Blob([data],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download=`backup-${cur}-tjsp.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener("keydown",e=>{if(!checkAuth())return;if(e.key>="1"&&e.key<="4"&&mode==='simular'){let fb=document.getElementById("feedback");if(!fb||fb.classList.contains("hidden"))choose(parseInt(e.key)-1)}if(e.key==="Enter"){if(mode!=='simular'){markRead()}else{let fb=document.getElementById("feedback");if(fb&&!fb.classList.contains("hidden"))nextQ();else confirmQ()}}});
if(checkAuth()){render()}
</script>

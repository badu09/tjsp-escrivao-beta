<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>TJSP Escrevente - Livro Completo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:#fff;color:#000;line-height:1.5}
header{background:linear-gradient(90deg,#7f1d1d,#991b1b);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px}
.book-page{line-height:1.7;font-size:15px}
.book-page h3{color:#7f1d1d;margin:16px 0 8px;font-size:18px;border-left:4px solid #dc2626;padding-left:10px}
.book-page h4{margin:14px 0 6px;font-size:15px}
.box-legal{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px;margin:10px 0}
.box-peg{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px;margin:10px 0}
.box-macete{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;margin:10px 0}
.book-page ul{margin:8px 0 8px 20px}.book-page li{margin:4px 0}
.layout{display:flex;min-height:100vh}
.sidebar{width:320px;background:#f8fafc;border-right:1px solid #e2e8f0;padding:12px;overflow:auto;flex-shrink:0}
.main{flex:1;padding:16px;max-width:900px;width:100%}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.topic{padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;display:flex;justify-content:space-between;margin-bottom:6px}
.topic.active{background:#fef2f2;border-color:#fecaca}
.badge{background:#e2e8f0;border-radius:999px;padding:2px 8px;font-size:11px}
.btn{border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;background:#fff;color:#000;border:1px solid #000}
.btn-primary{background:#7f1d1d;color:#fff;border-color:#7f1d1d}
.q{font-weight:700;font-size:16px;margin:12px 0}
.opt{border:1.5px solid #000;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;background:#fff}
.opt.correct{background:#f0fdf4;border-color:#16a34a}
.opt.wrong{background:#fef2f2;border-color:#dc2626}
.explain{background:#fff;border:1px solid #000;border-radius:10px;padding:12px;margin-top:12px}
.hidden{display:none}
input{color:#000}
#btn-menu{display:none}
@media(max-width:768px){
.layout{flex-direction:column}
.sidebar{display:none;width:100%;border-right:none;border-bottom:1px solid #e2e8f0}
.sidebar.open{display:block}
#btn-menu{display:inline-block}
header h1{font-size:15px}
.main{padding:10px}
}
</style>
</head>
<body>
<header><h1>⚖️ TJSP Escrevente - Livro Completo</h1><div><button id="btn-menu" class="btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Matérias</button> <small>Progresso salvo</small></div></header>

<button class="btn" onclick="exportBackup()">💾 Backup</button>

</div>

</div>
</div>
<script>
const DEFAULT_PASS="SaygonEscrivao2026";const MASTER_KEY="TJSP2026RESET";
const getUsers=()=>{try{return JSON.parse(localStorage.getItem("tjsp_users")||"{}")}catch(e){return{}}};
const saveUsers=u=>localStorage.setItem("tjsp_users",JSON.stringify(u));
const getCurrent=()=>localStorage.getItem("tjsp_current");
const setCurrent=c=>localStorage.setItem("tjsp_current",c);

const BOOK=[
{id:"constitucional",name:"Direito Constitucional",icon:"⚖️",chapters:[
{title:"Cap 1 - Art 5º Caput",content:`<h3>LEI SECA</h3><div class="box-legal"><b>Art. 5º Todos são iguais perante a lei, garantindo-se aos brasileiros e estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade.</b></div><h4>V-L-I-S-P</h4><ul><li><b>Vida:</b> vedação pena de morte salvo guerra declarada</li><li><b>Liberdade:</b> 17 liberdades no Art 5º</li><li><b>Igualdade:</b> formal e material - cotas ADC 41 STF</li><li><b>Segurança:</b> jurídica e física</li><li><b>Propriedade:</b> com função social</li></ul><div class="box-macete"><b>PEGADINHA VUNESP:</b> Se trocar propriedade por moradia, saúde ou educação está ERRADO. Isso é Art 6º, não caput.</div>`},
{title:"Cap 2 - Igualdade e Legalidade",content:`<h3>LEI SECA</h3><div class="box-legal">I - homens e mulheres iguais em direitos e obrigações<br>II - ninguém obrigado a fazer ou deixar de fazer senão em virtude de lei</div><ul><li>Igualdade não impede licença maternidade 120 dias x paternidade 5 dias</li><li>Particular: pode tudo que não é proibido. Administração: só pode o que a lei autoriza.</li></ul>`},
{title:"Cap 3 - Intimidade, Casa, Sigilo",content:`<h3>LEI SECA</h3><div class="box-legal">X - invioláveis intimidade, vida privada, honra e imagem<br>XI - casa asilo inviolável - de dia com mandado, de noite só flagrante, desastre, socorro<br>XII - sigilo correspondência e comunicações</div><div class="box-macete">CASA: inclui escritório fechado, quarto de hotel. NÃO inclui bar, escritório aberto, cela.<br>SIGILO: Telefone só juiz Lei 9.296. Delegado NUNCA quebra sozinho.</div>`},
{title:"Cap 4 - Processo e Provas",content:`<h3>LEI SECA</h3><div class="box-legal">XXXV - lei não excluirá da apreciação do Judiciário lesão ou ameaça<br>LIV - devido processo legal<br>LV - contraditório e ampla defesa<br>LVI - inadmissíveis provas ilícitas</div><ul><li>Prova ilícita = fruto da árvore envenenada</li><li>Contraditório vale até no PAD - Súmula Vinculante 5</li></ul>`},
{title:"Cap 5 - Direitos Sociais Art 6º",content:`<h3>LEI SECA</h3><div class="box-legal">Art 6º São direitos sociais a educação, a saúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância, a assistência aos desamparados.</div><p><b>MACETE:</b> Art 5º = defesa contra Estado. Art 6º = Estado tem que FAZER.</p><p>Decore: <b>EDU SAU ALI TRA MOR TRANS LAZ SEG PREV PROT ASSIS</b></p>`},
{title:"Cap 6 - Nacionalidade Art 12",content:`<h3>LEI SECA</h3><div class="box-legal">Brasileiro nato: nascido no Brasil (salvo filho de estrangeiro a serviço do país) + nascido no exterior filho de pai/mãe brasileiro a serviço do Brasil + nascido no exterior filho de brasileiro registrado ou que venha residir e opte.</div><ul><li>Naturalizado: estrangeiro que pede, português com residência e idoneidade</li><li>Perda: cancelamento de naturalização por sentença, aquisição de outra nacionalidade, etc.</li></ul>`},
{title:"Cap 7 - Direitos Políticos Art 14",content:`<h3>LEI SECA</h3><div class="box-legal">Alistamento obrigatório 18-70 anos, facultativo 16-18 e +70 e analfabetos. Inelegíveis: inalistáveis e analfabetos.</div><ul><li>Voto direto, secreto, universal e periódico</li><li>Idade mínima: Vereador 18, Deputado 21, Governador/Senador 30, Presidente 35</li><li>Perda/suspensão: condenação criminal transitada em julgado, improbidade, etc.</li></ul>`},
{title:"Cap 8 - Organização do Estado e Poderes",content:`<h3>RESUMO</h3><ul><li><b>União:</b> Art 21 e 22 - competências privativas e exclusivas</li><li><b>Estados:</b> competência remanescente</li><li><b>Municípios:</b> interesse local</li><li><b>Poderes:</b> Legislativo, Executivo, Judiciário - independentes e harmônicos</li><li><b>STF:</b> guarda da Constituição. <b>STJ:</b> uniformizar lei federal. <b>TJSP:</b> justiça estadual.</li></ul><div class="box-peg"><b>VUNESP AMA:</b> Federação = indissolúvel, autonomia dos entes, repartição de competências.</div>`}
]},
{id:"portugues",name:"Língua Portuguesa",icon:"📚",chapters:[
{title:"Cap 1 - Concordância Verbal",content:`<h3>REGRA OURO</h3><div class="box-legal">Verbo concorda com sujeito.</div><h4>HAVER = EXISTIR - impessoal</h4><ul><li>Certo: Havia muitos processos / Houve muitos processos</li><li>Errado: Haviam muitos processos - VUNESP pega 80% aqui</li></ul><h4>FAZER tempo</h4><ul><li>Faz dois anos que estudo - sempre singular</li></ul>`},
{title:"Cap 2 - Crase A+A=À",content:`<h3>MACETE INFALÍVEL</h3><div class="box-macete">Troca por AO masculino. Se der AO, tem crase.<br>Fui à praia -> Fui AO shopping ✅</div><ul><li>Às vezes tem, às 10h tem, à medida que tem, a partir NUNCA tem</li><li>Antes de verbo nunca: Começou a chover</li></ul>`},
{title:"Cap 3 - Pontuação",content:`<h3>VÍRGULA</h3><ul><li>NUNCA separa sujeito do verbo: Os servidores, trabalham ERRADO</li><li>Obrigatória: aposto, vocativo, adjunto deslocado, oração intercalada</li><li>Proibida: entre verbo e complemento</li></ul>`},
{title:"Cap 4 - Concordância Nominal e Regência",content:`<ul><li><b>É proibido / É proibida:</b> sem artigo = invariável. É proibido entrada. Com artigo concorda: É proibida a entrada.</li><li><b>Regência:</b> Assistir = ver (VTDI - assistir AO jogo), morar (VI), preferir (VTDI - prefiro café A leite, sem MAIS)</li><li><b>Chegar / ir:</b> Cheguei AO tribunal, não NO tribunal (VUNESP ama)</li></ul>`},
{title:"Cap 5 - Verbo - Vozes e Tempos",content:`<ul><li><b>Voz ativa:</b> O juiz proferiu a sentença</li><li><b>Voz passiva:</b> A sentença foi proferida pelo juiz</li><li><b>Se + verbo:</b> Vende-se casas (singular) / Vendem-se casas? Cuidado: se índice de indeterminação ou partícula apassivadora</li><li><b>Por / pôr:</b> Por = preposição, Pôr = verbo colocar</li></ul>`},
{title:"Cap 6 - Interpretação de Texto",content:`<div class="box-macete">VUNESP: 1) Leia o enunciado antes do texto 2) Marque palavras: SEGUNDO O TEXTO, INFERE-SE, DEPREENDE-SE 3) Segundo o texto = está escrito. Infere-se = pode concluir, mas sem inventar.</div><ul><li>Cuidado com: NEM SEMPRE, APENAS, SOMENTE, EXCETO - mudam tudo</li><li>Ironia, sentido figurado, conotação x denotação</li></ul>`},
{title:"Cap 7 - Ortografia e Acentuação",content:`<ul><li><b>Porquê / porque / por que / por quê:</b> Porquê = motivo (o porquê), Porque = pois, Por que = por qual motivo, Por quê = no final</li><li><b>Mau / mal:</b> Mau = bom (antônimo), Mal = bem</li><li><b>Mas / mais / más:</b> Mas = porém, Mais = quantidade, Más = ruins</li><li>Novo acordo: voo, ideia, assembleia SEM acento. Herói, papéis, céu COM acento.</li></ul>`}
]},
{id:"processual_civil",name:"Processo Civil",icon:"📝",chapters:[
{title:"Cap 1 - Petição Inicial Art 319",content:`<div class="box-legal">Art 319: I - juízo, II - partes, III - causa de pedir, IV - pedido, V - valor da causa, VI - provas, VII - opção audiência conciliação</div><p>Pedido certo e determinado Art 322. Causa de pedir = fatos + fundamentos.</p>`},
{title:"Cap 2 - Citação e Intimação",content:`<ul><li><b>Citação:</b> chama réu para se defender. Correio, oficial, edital, eletrônico.</li><li><b>Intimação:</b> comunica ato já praticado. Diário, eletrônico, oficial.</li><li><b>Prazos:</b> Contestação 15 dias úteis, Réplica 15 dias úteis</li></ul>`},
{title:"Cap 3 - Atos Processuais e Prazos",content:`<ul><li>Prazos em dias úteis (CPC) - não conta feriado, fim de semana</li><li>Contagem: exclui dia do começo, inclui dia do vencimento</li><li>Preclusão: perda do direito de praticar ato por perder prazo</li></ul>`},
{title:"Cap 4 - Sentença e Recursos",content:`<ul><li><b>Sentença:</b> relatório, fundamentação, dispositivo</li><li><b>Apelação:</b> contra sentença, 15 dias</li><li><b>Agravo de Instrumento:</b> contra decisão interlocutória, 15 dias</li><li><b>Embargos de Declaração:</b> omissão, contradição, obscuridade - 5 dias</li></ul>`},
{title:"Cap 5 - Audiência e Provas",content:`<ul><li><b>Audiência de conciliação Art 334:</b> tentativa de acordo antes da contestação</li><li><b>Provas:</b> documental, testemunhal, pericial, inspeção judicial, depoimento pessoal</li><li><b>Ônus da prova:</b> autor prova fato constitutivo, réu fato impeditivo/modificativo/extintivo</li></ul>`},
{title:"Cap 6 - Execução e Cumprimento",content:`<ul><li><b>Cumprimento de sentença:</b> título judicial - 15 dias para pagar, senão multa 10% + honorários 10%</li><li><b>Execução:</b> título extrajudicial - citação para pagar em 3 dias</li><li><b>Penhora:</b> dinheiro primeiro, depois bens</li></ul>`}
]},
{id:"processual_penal",name:"Processo Penal",icon:"👮",chapters:[
{title:"Cap 1 - Inquérito Policial",content:`<ul><li>Procedimento administrativo, inquisitivo, sigiloso, dispensável</li><li>Presidido pelo Delegado, prazo: 10 dias preso, 30 dias solto (Justiça Estadual)</li><li>Indiciamento: fundamentado, não é condenação</li></ul>`},
{title:"Cap 2 - Ação Penal",content:`<ul><li><b>Pública incondicionada:</b> MP denuncia, sem precisar de representação</li><li><b>Pública condicionada:</b> precisa de representação da vítima</li><li><b>Privada:</b> vítima entra com queixa-crime, prazo 6 meses (decadência)</li></ul>`},
{title:"Cap 3 - Prisão e Liberdade",content:`<div class="box-legal">Prisão em flagrante, preventiva, temporária</div><ul><li><b>Temporária:</b> 5 dias + 5, só na investigação, crimes do rol Lei 7.960</li><li><b>Preventiva:</b> garantia da ordem pública, conveniência da instrução, assegurar aplicação da lei</li><li><b>Relaxamento:</b> prisão ilegal. <b>Revogação:</b> não precisa mais. <b>Liberdade provisória:</b> com ou sem fiança</li></ul>`},
{title:"Cap 4 - Provas no Processo Penal",content:`<ul><li>Prova ilícita inadmissível, desentranhada</li><li>Exame de corpo de delito obrigatório em crime que deixa vestígio</li><li>Testemunha: compromisso de dizer a verdade, salvo parentes e impedidos</li></ul>`},
{title:"Cap 5 - Sentença Penal e Recursos",content:`<ul><li><b>Apelação:</b> 5 dias - contra sentença</li><li><b>Recurso em Sentido Estrito:</b> 5 dias - contra decisões do rol Art 581 CPP</li><li><b>Embargos de Declaração:</b> 2 dias</li><li><b>Recurso Especial / Extraordinário:</b> 15 dias</li></ul>`},
{title:"Cap 6 - Tribunal do Júri",content:`<ul><li>Crimes dolosos contra a vida: homicídio, infanticídio, aborto, induzimento ao suicídio</li><li>Fases: judicium accusationis (pronúncia) e judicium causae (plenário)</li><li>7 jurados, decisão por maioria, sigilo das votações</li></ul>`}
]},
{id:"penal",name:"Direito Penal",icon:"🔒",chapters:[
{title:"Cap 1 - Princípios e Lei Penal",content:`<div class="box-legal">Art 1º CP: Não há crime sem lei anterior que o defina. Não há pena sem prévia cominação legal.</div><ul><li><b>Legalidade:</b> só lei cria crime. <b>Anterioridade:</b> lei tem que existir antes do fato.</li><li><b>Analogia in malam partem:</b> PROIBIDA. In bonam partem: permitida.</li><li><b>Lei mais benéfica retroage. Lei mais grave não retroage.</b></li></ul>`},
{title:"Cap 2 - Crime - Fato Típico",content:`<ul><li><b>Crime = Fato Típico + Ilícito + Culpável</b></li><li><b>Fato típico:</b> conduta + resultado + nexo + tipicidade</li><li><b>Dolo:</b> quer o resultado ou assume o risco. <b>Culpa:</b> imprudência, negligência, imperícia</li><li><b>Consumado x Tentado:</b> tentado = começou execução, não consumou por alheio à vontade</li></ul>`},
{title:"Cap 3 - Excludentes de Ilicitude",content:`<div class="box-legal">Art 23: Estado de necessidade, Legítima defesa, Estrito cumprimento do dever legal, Exercício regular de direito</div><ul><li><b>Legítima defesa:</b> usar moderadamente meios necessários para repelir injusta agressão atual ou iminente</li><li><b>Estado de necessidade:</b> sacrificar bem menor para salvar bem maior</li></ul>`},
{title:"Cap 4 - Culpabilidade e Imputabilidade",content:`<ul><li><b>Imputável:</b> maior de 18 anos, mentalmente são</li><li><b>Inimputável:</b> doença mental, menor de 18 - medida de segurança, não pena</li><li><b>Embriaguez:</b> voluntária NÃO exclui. Acidental completa exclui. Culposa não exclui.</li></ul>`},
{title:"Cap 5 - Penas",content:`<ul><li><b>Privativas de liberdade:</b> reclusão, detenção, prisão simples (contravenção)</li><li><b>Restritivas de direitos:</b> prestação de serviços, limitação de fim de semana, perda de bens, etc.</li><li><b>Multa:</b> dias-multa 10 a 360</li><li><b>Regimes:</b> fechado, semiaberto, aberto. Progressão: 1/6 regra geral, hediondo mais rigoroso</li></ul>`},
{title:"Cap 6 - Crimes em Espécie - VUNESP",content:`<ul><li><b>Furto Art 155:</b> subtrair coisa alheia móvel. <b>Roubo Art 157:</b> furto + violência/grave ameaça</li><li><b>Estelionato Art 171:</b> obter vantagem mediante fraude</li><li><b>Peculato Art 312:</b> funcionário apropria-se de bem público</li><li><b>Corrupção passiva Art 317:</b> solicitar/receber vantagem. <b>Ativa Art 333:</b> oferecer</li><li><b>Homicídio Art 121:</b> simples, privilegiado, qualificado</li></ul>`}
]},
{id:"administrativo",name:"Direito Administrativo",icon:"🏛️",chapters:[
{title:"Cap 1 - Princípios LIMPE",content:`<div class="box-legal">Art 37 CF: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência - LIMPE</div><ul><li><b>Legalidade:</b> Administração só faz o que lei permite</li><li><b>Impessoalidade:</b> sem favoritismo, finalidade pública</li><li><b>Publicidade:</b> atos públicos, salvo sigilo</li><li><b>Eficiência:</b> melhor resultado com menor custo</li></ul>`},
{title:"Cap 2 - Atos Administrativos",content:`<ul><li><b>Atributos:</b> presunção de legitimidade, imperatividade, autoexecutoriedade, tipicidade</li><li><b>Requisitos:</b> competência, finalidade, forma, motivo, objeto - COFIFOMO</li><li><b>Anulação:</b> ato ilegal - pode Administração e Judiciário. <b>Revogação:</b> ato inconveniente - só Administração, respeita direito adquirido</li></ul>`},
{title:"Cap 3 - Servidores Públicos",content:`<ul><li><b>Cargo:</b> efetivo (concurso), comissão (livre nomeação), vitalício (juiz, MP)</li><li><b>Estabilidade:</b> 3 anos efetivo exercício + avaliação</li><li><b>Remuneração:</b> teto = subsídio Ministro STF. Vedada acumulação, salvo 2 cargos de professor, saúde, etc.</li><li><b>Deveres:</b> assiduidade, lealdade, obediência, etc.</li></ul>`},
{title:"Cap 4 - Licitações Lei 14.133/2021",content:`<ul><li><b>Modalidades:</b> Pregão, Concorrência, Concurso, Leilão, Diálogo Competitivo</li><li><b>Princípios:</b> isonomia, julgamento objetivo, competitividade</li><li><b>Pregão:</b> bens e serviços comuns, menor preço ou maior desconto</li><li><b>Dispensa x Inexigibilidade:</b> Dispensa = pode licitar mas lei dispensa. Inexigibilidade = inviável competição (fornecedor exclusivo)</li></ul>`},
{title:"Cap 5 - Contratos e Poderes",content:`<ul><li><b>Poderes:</b> vinculado, discricionário, hierárquico, disciplinar, regulamentar, polícia</li><li><b>Poder de polícia:</b> limitar direito em prol do interesse público - fiscalização, multa, interdição</li><li><b>Contrato administrativo:</b> cláusulas exorbitantes - Administração pode alterar unilateralmente, rescindir, fiscalizar</li></ul>`},
{title:"Cap 6 - Responsabilidade Civil do Estado",content:`<div class="box-legal">Art 37 §6º CF: Responsabilidade OBJETIVA - Estado responde independente de culpa, por dano causado por agente.</div><ul><li><b>Objetiva:</b> não precisa provar culpa do servidor. Precisa provar: conduta, dano, nexo.</li><li><b>Excludentes:</b> culpa exclusiva da vítima, caso fortuito, força maior</li><li><b>Direito de regresso:</b> Estado paga vítima e cobra do servidor se ele agiu com dolo/culpa</li></ul>`}
]},
{id:"informatica",name:"Informática",icon:"💻",chapters:[
{title:"Cap 1 - Windows e Atalhos",content:`<ul><li><b>CTRL+C:</b> copiar, <b>CTRL+X:</b> recortar, <b>CTRL+V:</b> colar, <b>CTRL+Z:</b> desfazer, <b>CTRL+S:</b> salvar</li><li><b>ALT+TAB:</b> alternar janelas, <b>WIN+D:</b> mostrar área de trabalho, <b>WIN+E:</b> explorador</li><li><b>CTRL+SHIFT+ESC:</b> gerenciador de tarefas</li></ul>`},
{title:"Cap 2 - Word",content:`<ul><li><b>CTRL+B:</b> negrito, <b>CTRL+I:</b> itálico, <b>CTRL+U:</b> sublinhado</li><li><b>CTRL+J:</b> justificar, <b>CTRL+E:</b> centralizar, <b>CTRL+L:</b> esquerda</li><li>Mala direta, sumário automático, controle de alterações, quebra de página CTRL+ENTER</li></ul>`},
{title:"Cap 3 - Excel",content:`<ul><li><b>=SOMA(A1:A10)</b>, <b>=MÉDIA</b>, <b>=SE(A1>10;\"Aprovado\";\"Reprovado\")</b></li><li><b>=PROCV</b> procura na vertical, <b>=PROCH</b> na horizontal</li><li><b>$A$1</b> = referência absoluta, não muda ao arrastar. <b>A1</b> = relativa</li><li>Alça de preenchimento, filtro, tabela dinâmica</li></ul>`},
{title:"Cap 4 - Internet e Segurança",content:`<ul><li><b>Phishing:</b> e-mail falso para roubar senha. <b>Spam:</b> lixo. <b>Malware:</b> vírus, trojan, ransomware (sequestra arquivos)</li><li><b>HTTPS:</b> site seguro com cadeado. <b>Backup:</b> cópia de segurança - nuvem, HD externo</li><li><b>Senha forte:</b> letras + números + símbolos, não repetir</li></ul>`},

let mode='estudar';let activeTopic=BOOK[0].id;let chapterIndex=0;let qIndex=0;let chosen=null;
function setMode(m){mode=m;const b1=document.getElementById('tab-estudar');const b2=document.getElementById('tab-simular');if(b1){b1.style.background=m==='estudar'?'#7f1d1d':'#fff';b1.style.color=m==='estudar'?'#fff':'#000'}if(b2){b2.style.background=m==='simular'?'#7f1d1d':'#fff';b2.style.color=m==='simular'?'#fff':'#000'}if(m==='estudar'){activeTopic=BOOK[0].id;chapterIndex=0}else{activeTopic=DB[0].id;qIndex=0}render()}
function renderSidebar(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let html='';if(mode==='estudar'){html+=`<div class="card"><b>📖 Livro Completo</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:0%"></div></div><small id="ptext"></small></div>`;BOOK.forEach(t=>{let done=(hist['book_'+t.id]?.done||0);let pct=t.chapters.length?Math.round(done/t.chapters.length*100):0;html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${done}/${t.chapters.length} caps • ${pct}%</small></div><span class="badge">${pct}%</span></div>`})}else{html+=`<div class="card"><b>Progresso Simulado</b><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px"><div id="pbar" style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:0%"></div></div><small id="ptext"></small></div>`;DB.forEach(t=>{let done=(hist[t.id]?.done||0);let total=t.questions.length;let pct=total?Math.round(done/total*100):0;html+=`<div class="topic ${t.id===activeTopic?'active':''}" onclick="selectTopic('${t.id}')"><div><b>${t.icon} ${t.name}</b><br><small>${done}/${total} • ${pct}%</small></div><span class="badge">${pct}%</span></div>`})}document.getElementById("sidebar").innerHTML=html;updateProgress()}
function updateProgress(){let users=getUsers();let cur=getCurrent();let hist=users[cur]?.history||{};let pct=0,txt="";if(mode==='estudar'){let tot=BOOK.reduce((s,t)=>s+t.chapters.length,0);let done=BOOK.reduce((s,t)=>s+(hist['book_'+t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" págs • "+pct+"%"}else{let tot=DB.reduce((s,t)=>s+t.questions.length,0);let done=DB.reduce((s,t)=>s+(hist[t.id]?.done||0),0);pct=tot?Math.round(done/tot*100):0;txt=done+"/"+tot+" • "+pct+"%"}let b=document.getElementById("pbar");if(b)b.style.width=pct+"%";let pt=document.getElementById("ptext");if(pt)pt.innerText=txt}
function selectTopic(id){activeTopic=id;chapterIndex=0;qIndex=0;chosen=null;if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open');render()}
function render(){renderSidebar();if(mode==='estudar'){let t=BOOK.find(x=>x.id===activeTopic);let chap=t.chapters[chapterIndex];if(!chap){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="chapterIndex=0;render()">Recomeçar</button> <button class="btn" onclick="setMode('simular')">Ir pro Simulado →</button></div></div>`;return}let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${t.icon} ${t.name} - ${chap.title}</b><span class="badge">${chapterIndex+1}/${t.chapters.length}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((chapterIndex/t.chapters.length)*100)}%"></div></div><div class="book-page">${chap.content}</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="markRead()">✅ Lido + Próxima → (Enter)</button><button class="btn" onclick="nextChapter()">Pular →</button></div></div>`;document.getElementById("app").innerHTML=html}else{let t=DB.find(x=>x.id===activeTopic);let total=t.questions.length;let qq=t.questions[qIndex];if(!qq){document.getElementById("app").innerHTML=`<div class="card"><h2>${t.icon} ${t.name} concluído! 🎉</h2><p>Você fez ${total} questões.</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="qIndex=0;render()">Refazer</button> <button class="btn" onclick="setMode('estudar')">Ver Livro →</button></div></div>`;return}let html=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${t.icon} ${t.name}</b><span class="badge">${qIndex+1}/${total}</span></div><div style="height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0"><div style="height:100%;background:linear-gradient(90deg,#7f1d1d,#dc2626);width:${Math.round((qIndex/total)*100)}%"></div></div><p class="q">${qIndex+1}. ${qq.q}</p><div id="opts">${qq.o.map((op,i)=>`<div class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${op}</div>`).join("")}</div><div id="feedback" class="hidden"></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="confirmQ()">Corrigir (Enter)</button><button class="btn" onclick="nextQ()">Pular</button></div></div>`;document.getElementById("app").innerHTML=html}}
function markRead(){let users=getUsers();let cur=getCurrent();if(!users[cur])return;let key='book_'+activeTopic;if(!users[cur].history[key])users[cur].history[key]={done:0};let h=users[cur].history[key];if(chapterIndex>=(h.done||0))h.done=Math.max(h.done||0,chapterIndex+1);saveUsers(users);nextChapter()}
function nextChapter(){let t=BOOK.find(x=>x.id===activeTopic);if(!t)return;chapterIndex++;if(chapterIndex>=t.chapters.length)chapterIndex=t.chapters.length;render()}
function choose(i){chosen=i;document.querySelectorAll(".opt").forEach((el,idx)=>{el.style.borderWidth=idx===i?"3px":"1.5px";el.style.fontWeight=idx===i?"700":"400"})}
function confirmQ(){if(chosen===null)return alert("Escolha 1-4");let t=DB.find(x=>x.id===activeTopic);let qq=t.questions[qIndex];document.querySelectorAll(".opt").forEach((el,idx)=>{if(idx===qq.a)el.classList.add("correct");else if(idx===chosen&&chosen!==qq.a)el.classList.add("wrong")});let acerto=chosen===qq.a;let fb=document.getElementById("feedback");fb.classList.remove("hidden");fb.innerHTML=`<div class="explain"><div style="font-weight:800;color:${acerto?'#16a34a':'#dc2626'}">${acerto?'✅ ACERTOU!':'❌ ERROU'}</div><div style="margin-top:8px"><b>Correta: ${String.fromCharCode(65+qq.a)}. ${qq.o[qq.a]}</b></div><div style="margin-top:8px"><b>Por que CERTA está certa:</b><br><small>${qq.ec}</small></div><div style="margin-top:8px"><b>Por que ERRADAS estão erradas:</b><br><small>${qq.ei}</small></div><div style="margin-top:8px;background:#fff;border:1px dashed #000;border-radius:8px;padding:8px"><b>📚 Explicação Completa:</b><br><small>${qq.e}</small></div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary" onclick="nextQ()">Próxima →</button> <button class="btn" onclick="setMode('estudar')">Ver livro 📖</button></div></div>`;let users=getUsers();let cur=getCurrent();if(!users[cur].history[activeTopic])users[cur].history[activeTopic]={done:0,hits:0};let h=users[cur].history[activeTopic];if(qIndex>=(h.done||0))h.done=Math.max(h.done||0,qIndex+1);if(acerto)h.hits=(h.hits||0)+1;saveUsers(users);updateProgress()}
function nextQ(){let t=DB.find(x=>x.id===activeTopic);qIndex++;chosen=null;if(qIndex>=t.questions.length)qIndex=t.questions.length;render()}
function checkAuth(){let cur=getCurrent();let loginDiv=document.getElementById("login-overlay");if(!cur){if(!loginDiv){let div=document.createElement("div");div.id="login-overlay";div.innerHTML=`<div style="position:fixed;inset:0;background:linear-gradient(135deg,#7f1d1d,#991b1b);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px"><div class="card" style="width:100%;max-width:420px;background:#fff"><h2 style="margin-top:0;color:#000">Login TJSP</h2><input id="name" placeholder="Seu nome" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><input id="pass" type="password" placeholder="Senha: SaygonEscrivao2026" style="width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;font-size:16px;background:#fff;color:#000" autocomplete="off"><button class="btn btn-primary" style="width:100%;padding:12px;margin-top:8px" onclick="doLogin()">Entrar</button><p style="margin-top:12px"><a href="#" onclick="openReset();return false" style="color:#000">Esqueci senha / Reset com chave</a></p><small style="color:#000">Senha padrão: SaygonEscrivao2026<br>Chave: TJSP2026RESET</small></div></div>`;document.body.appendChild(div);setTimeout(()=>{document.getElementById("name")?.focus()},100)}return false}else{if(loginDiv)loginDiv.remove();return true}}
function doLogin(){let n=document.getElementById("name")?.value.trim();let p=document.getElementById("pass")?.value;if(!n){alert("Digite seu nome");return}let u=getUsers();if(!u[n]){u[n]={pass:p||DEFAULT_PASS,history:{}};saveUsers(u);setCurrent(n);location.reload();return}if(u[n].pass===p){setCurrent(n);location.reload()}else{alert("Senha incorreta.")}}
function logout(){localStorage.removeItem("tjsp_current");location.reload()}
function openReset(){let cur=getCurrent();let nome=cur||prompt("Nome do usuário:");if(!nome)return;let chave=prompt("Chave mestra:");if(chave!==MASTER_KEY)return alert("Chave incorreta");let nova=prompt("Nova senha:");if(!nova)return;let u=getUsers();if(!u[nome])u[nome]={pass:nova,history:{}};else u[nome].pass=nova;saveUsers(u);setCurrent(nome);alert("Senha trocada! ✅");location.reload()}
function exportBackup(){let u=getUsers();let cur=getCurrent();if(!cur)return alert("Faça login");let data=JSON.stringify(u[cur]||{},null,2);let blob=new Blob([data],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download=`backup-${cur}-tjsp.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener("keydown",e=>{if(!checkAuth())return;if(e.key>="1"&&e.key<="4"&&mode==='simular'){let fb=document.getElementById("feedback");if(!fb||fb.classList.contains("hidden"))choose(parseInt(e.key)-1)}if(e.key==="Enter"){if(mode==='estudar'){markRead()}else{let fb=document.getElementById("feedback");if(fb&&!fb.classList.contains("hidden"))nextQ();else confirmQ()}}});
if(checkAuth()){render()}
</script>
</body>
</html>
